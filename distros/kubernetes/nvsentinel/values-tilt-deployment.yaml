# Tilt with USE_DEPLOYMENT_PLATFORM_CONNECTOR=1: the deployment platform
# connector with two replicas, and every publisher sending to it. The node-local
# DaemonSet stays on (the chart default) because the gpu monitor mounts the
# socket directory it creates.

platformConnector:
  deployment:
    enabled: true
    replicas: 2

preflight:
  publishTo: deployment

gpu-health-monitor:
  publishTo: deployment

syslog-health-monitor:
  publishTo: deployment

nic-health-monitor:
  publishTo: deployment

csp-health-monitor:
  publishTo: deployment

kubernetes-object-monitor:
  publishTo: deployment

slurm-drain-monitor:
  publishTo: deployment

nvcre-certification-monitor:
  publishTo: deployment

health-events-analyzer:
  publishTo: deployment

lifecycle-manager:
  publishTo: deployment

suite: janitor log level
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/janitor/templates/deployment.yaml
  - charts/janitor/templates/configmap.yaml
set:
  global.janitor.enabled: true
tests:
  - it: sets LOG_LEVEL to info by default
    template: charts/janitor/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: info

  - it: passes logLevel to LOG_LEVEL
    template: charts/janitor/templates/deployment.yaml
    set:
      janitor.logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: debug

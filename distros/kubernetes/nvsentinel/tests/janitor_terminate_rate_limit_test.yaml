suite: janitor terminate rate limit
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/janitor/templates/configmap.yaml
set:
  global.janitor.enabled: true
tests:
  - it: renders no limit by default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\nterminateNodeController:\n(  .*\n)*  rateLimit:\n    maxTerminations: 0\n    window: "1m"\n'

  - it: passes the limit to the terminate controller
    set:
      janitor.config.controllers.terminateNode.rateLimit:
        maxTerminations: 3
        window: 5m
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\nterminateNodeController:\n(  .*\n)*  rateLimit:\n    maxTerminations: 3\n    window: "5m"\n'

suite: platform connector capability-scoped writers
templates:
  - templates/clusterrole.yaml
  - templates/platform-connector-deployment-serviceaccount.yaml
tests:
  - it: keeps discovery and authentication without Kubernetes sink writers
    template: templates/clusterrole.yaml
    set:
      platformConnector.k8sConnector.enabled: false
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get, list]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]

  - it: keeps the enabled Kubernetes sink writers without an eviction grant
    template: templates/clusterrole.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get, list]
            - apiGroups: [""]
              resources: [nodes/status]
              verbs: [get, patch, update, list]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, get, update, list]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]

  - it: does not add TokenReview when socket authentication is explicitly disabled
    template: templates/clusterrole.yaml
    set:
      platformConnector.k8sConnector.enabled: false
      global.platformConnectorAuth.enabled: false
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get, list]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]

  - it: scopes deployment writers to the same sink flag as its configuration
    template: templates/platform-connector-deployment-serviceaccount.yaml
    set:
      platformConnector.deployment.enabled: true
      platformConnector.k8sConnector.enabled: false
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
        documentIndex: 1

  - it: keeps the enabled deployment sink writers
    template: templates/platform-connector-deployment-serviceaccount.yaml
    set:
      platformConnector.deployment.enabled: true
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get]
            - apiGroups: [""]
              resources: [nodes/status]
              verbs: [patch, update]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, get, update]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
        documentIndex: 1

  - it: omits the node-local role when the DaemonSet is disabled
    template: templates/clusterrole.yaml
    set:
      platformConnector.daemonset.enabled: false
    asserts:
      - hasDocuments:
          count: 0

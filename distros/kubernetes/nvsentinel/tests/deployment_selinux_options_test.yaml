suite: deployment selinux options
release:
  namespace: nvsentinel
templates:
  - charts/csp-health-monitor/templates/deployment.yaml
  - charts/csp-health-monitor/templates/configmap.yaml
  - charts/health-events-analyzer/templates/deployment.yaml
  - charts/health-events-analyzer/templates/configmap.yaml
  - charts/kubernetes-object-monitor/templates/deployment.yaml
  - charts/kubernetes-object-monitor/templates/configmap.yaml
  - charts/lifecycle-manager/templates/deployment.yaml
  - charts/lifecycle-manager/templates/configmap-templates.yaml
  - charts/lifecycle-manager/templates/configmap.yaml
  - charts/nvcre-certification-monitor/templates/deployment.yaml
  - charts/nvcre-certification-monitor/templates/configmap.yaml
  - charts/slurm-drain-monitor/templates/deployment.yaml
  - charts/slurm-drain-monitor/templates/configmap.yaml
  - charts/fault-quarantine/templates/deployment.yaml
  - charts/fault-quarantine/templates/configmap.yaml
  - charts/fault-remediation/templates/deployment.yaml
  - charts/fault-remediation/templates/configmap.yaml
  - charts/janitor-provider/templates/deployment.yaml
  - charts/janitor/templates/deployment.yaml
  - charts/janitor/templates/configmap.yaml
  - charts/labeler/templates/deployment.yaml
  - charts/labeler/templates/configmap.yaml
  - charts/node-drainer/templates/deployment.yaml
  - charts/node-drainer/templates/configmap.yaml
tests:
  - it: csp-health-monitor must not set a pod securityContext by default
    template: charts/csp-health-monitor/templates/deployment.yaml
    set:
      global.cspHealthMonitor.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: csp-health-monitor must set pod SELinux options from global.seLinuxOptions
    template: charts/csp-health-monitor/templates/deployment.yaml
    set:
      global.cspHealthMonitor.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seLinuxOptions:
              type: spc_t

  - it: health-events-analyzer must not set a pod securityContext by default
    template: charts/health-events-analyzer/templates/deployment.yaml
    set:
      global.healthEventsAnalyzer.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: health-events-analyzer must set pod SELinux options from global.seLinuxOptions
    template: charts/health-events-analyzer/templates/deployment.yaml
    set:
      global.healthEventsAnalyzer.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seLinuxOptions:
              type: spc_t

  - it: kubernetes-object-monitor must not set a pod securityContext by default
    template: charts/kubernetes-object-monitor/templates/deployment.yaml
    set:
      global.kubernetesObjectMonitor.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: kubernetes-object-monitor must set pod SELinux options from global.seLinuxOptions
    template: charts/kubernetes-object-monitor/templates/deployment.yaml
    set:
      global.kubernetesObjectMonitor.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seLinuxOptions:
              type: spc_t

  - it: lifecycle-manager must not set a pod securityContext by default
    template: charts/lifecycle-manager/templates/deployment.yaml
    set:
      global.lifecycleManager.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: lifecycle-manager must set pod SELinux options from global.seLinuxOptions
    template: charts/lifecycle-manager/templates/deployment.yaml
    set:
      global.lifecycleManager.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seLinuxOptions:
              type: spc_t

  - it: nvcre-certification-monitor must not set a pod securityContext by default
    template: charts/nvcre-certification-monitor/templates/deployment.yaml
    set:
      global.nvcreCertificationMonitor.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: nvcre-certification-monitor must set pod SELinux options from global.seLinuxOptions

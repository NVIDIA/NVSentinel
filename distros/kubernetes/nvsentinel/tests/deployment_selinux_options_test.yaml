  - it: fault-quarantine must not set SELinux options without audit logging
    template: charts/fault-quarantine/templates/deployment.yaml
    set:
      global.faultQuarantine.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: fault-quarantine must keep the audit-logging fsGroup alone when SELinux options are unset
    template: charts/fault-quarantine/templates/deployment.yaml
    set:
      global.faultQuarantine.enabled: true
      global.auditLogging.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 65532

  - it: fault-quarantine must add SELinux options next to the audit-logging fsGroup
    template: charts/fault-quarantine/templates/deployment.yaml
    set:
      global.faultQuarantine.enabled: true
      global.auditLogging.enabled: true
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext

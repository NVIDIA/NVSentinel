suite: Metadata collector metrics network policy
release:
  name: nvsentinel
templates:
  - templates/metadata-collector-metrics-networkpolicy.yaml
set:
  networkPolicy.enabled: true
  global.metadataCollector.enabled: true
tests:
  - it: allows the default metrics port only on the NVIDIA discovery pods
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: nvidia-metadata-collector
            app.kubernetes.io/instance: nvsentinel
      - equal:
          path: spec.ingress[0].ports
          value:
            - protocol: TCP
              port: 2113

  - it: follows an overridden collector metrics port
    set:
      metadata-collector.metrics.port: 22441
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 22441

  - it: does not render when collector metrics are disabled
    set:
      metadata-collector.metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when the collector is disabled
    set:
      global.metadataCollector.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when chart network policies are disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

suite: janitor-provider metrics network policy
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/janitor-provider/templates/networkpolicy.yaml
set:
  global.janitorProvider.enabled: true
tests:
  # A policy selecting these pods declares policyTypes Ingress, so every port that
  # no policy names is denied. The service policy alone therefore hid the metrics
  # port from the chart's own PodMonitor.
  - it: renders a policy for the service port and one for the metrics port
    asserts:
      - hasDocuments:
          count: 2

  - it: admits the gRPC service port
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: janitor-provider-allow-service-traffic
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 50051

  - it: admits the metrics port so the PodMonitor can scrape it
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: janitor-provider-allow-metrics-traffic
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 2112
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP
      - equal:
          path: spec.policyTypes
          value:
            - Ingress

  - it: selects the janitor-provider pods and no others
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: janitor-provider

  - it: follows global.metricsPort when it is overridden
    documentIndex: 1
    set:
      global.metricsPort: 9999
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 9999

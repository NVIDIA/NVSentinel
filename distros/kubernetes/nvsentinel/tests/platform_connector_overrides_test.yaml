suite: Platform connector override rules
templates:
  - templates/configmap.yaml
tests:
  - it: renders a rule that sends a fault to a custom action
    set:
      platformConnector.transformers.OverrideTransformer.rules:
        - name: nvlink-to-rma
          when: 'event.checkName == "GpuNvlinkWatch"'
          override:
            recommendedAction: CUSTOM
            customRecommendedAction: hardware-rma
    asserts:
      - matchRegex:
          path: data["overrides.toml"]
          pattern: 'override = \{recommendedAction = "CUSTOM", customRecommendedAction = "hardware-rma"\}'
  - it: renders a rule without a custom action unchanged
    set:
      platformConnector.transformers.OverrideTransformer.rules:
        - name: suppress-xid-109
          when: 'event.agent == "syslog-health-monitor"'
          override:
            isFatal: false
            recommendedAction: NONE
    asserts:
      - matchRegex:
          path: data["overrides.toml"]
          pattern: 'override = \{isFatal = false, recommendedAction = "NONE"\}'
      - notMatchRegex:
          path: data["overrides.toml"]
          pattern: customRecommendedAction

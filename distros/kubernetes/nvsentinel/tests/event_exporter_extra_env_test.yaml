suite: event-exporter extra env
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/event-exporter/templates/deployment.yaml
  - charts/event-exporter/templates/configmap.yaml
set:
  global.eventExporter.enabled: true
tests:
  - it: adds no extra env vars by default
    template: charts/event-exporter/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
          any: true

  - it: passes event-exporter.extraEnv to the container
    template: charts/event-exporter/templates/deployment.yaml
    set:
      event-exporter.extraEnv:
        - name: HTTPS_PROXY
          value: http://proxy.example.com:3128
        - name: NO_PROXY
          value: .svc,.cluster.local
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://proxy.example.com:3128
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: .svc,.cluster.local

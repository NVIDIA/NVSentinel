suite: nvidia-labeler guard
templates:
  - templates/nvidia-labeler-validation.yaml
tests:
  - it: renders with the default values
    asserts:
      - notFailedTemplate: {}

  - it: refuses to turn off nvidia-labeler while a reader of its labels is enabled
    set:
      labeler.nvidiaLabeler.enabled: false
      global.gpuHealthMonitor.enabled: false
      global.syslogHealthMonitor.enabled: false
      global.metadataCollector.enabled: false
      global.nicHealthMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "labeler.nvidiaLabeler.enabled is false, but these components are enabled: global.nicHealthMonitor.enabled\\."

  - it: lists every enabled reader
    set:
      labeler.nvidiaLabeler.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "global.gpuHealthMonitor.enabled, global.syslogHealthMonitor.enabled, global.metadataCollector.enabled\\."

  - it: allows turning off nvidia-labeler together with every reader of its labels
    set:
      labeler.nvidiaLabeler.enabled: false
      global.gpuHealthMonitor.enabled: false
      global.syslogHealthMonitor.enabled: false
      global.nicHealthMonitor.enabled: false
      global.metadataCollector.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: skips the check while the labeler chart is off
    set:
      global.labeler.enabled: false
      labeler.nvidiaLabeler.enabled: false
    asserts:
      - notFailedTemplate: {}

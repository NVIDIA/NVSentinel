suite: datastore credentials
templates:
  - templates/certmanager-postgresql.yaml
  - templates/configmap-datastore.yaml
  - templates/configmap.yaml
  - templates/daemonset.yaml
tests:
  - it: injects PostgreSQL password credentials from an existing Secret
    set:
      global.datastore:
        provider: postgresql
        credentialsFromSecret:
          name: external-postgresql
        connection:
          host: postgres.example.com
          port: 5432
          database: nvsentinel
          username: nvsentinel
          sslmode: require
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: external-postgresql
              optional: false
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--database-client-cert-mount-path=/etc/ssl/client-certs"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRESQL_CLIENT_CERT_MOUNT_PATH
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: postgresql-client-cert-original

  - it: preserves bundled certificates for certificate authentication
    set:
      global.datastore:
        provider: postgresql
        connection:
          host: nvsentinel-postgresql
          port: 5432
          database: nvsentinel
          username: postgres
          sslmode: verify-full
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--database-client-cert-mount-path=/etc/ssl/client-certs"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgresql-client-cert-original
            secret:
              secretName: postgresql-client-cert
              optional: false

  - it: skips bundled certificate resources for password authentication
    set:
      global.clusterType: standalone
      global.datastore:
        provider: postgresql
        credentialsFromSecret:
          name: external-postgresql
    template: templates/certmanager-postgresql.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the PostgreSQL password out of the generated ConfigMap
    set:
      global.datastore:
        provider: postgresql
        credentialsFromSecret:
          name: external-postgresql
        connection:
          host: postgres.example.com
          port: 5432
          database: nvsentinel
          username: nvsentinel
          sslmode: require
    template: templates/configmap-datastore.yaml
    asserts:
      - notExists:
          path: data.DATASTORE_PASSWORD
      - equal:
          path: data.DATASTORE_SSLMODE
          value: require

  - it: preserves MongoDB credential Secret injection
    set:
      global.mongodbStore.enabled: false
      global.datastore:
        provider: mongodb
        credentialsFromSecret:
          name: external-mongodb
        connection:
          host: mongodb.example.com
          port: 27017
          database: HealthEventsDatabase
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: external-mongodb
              optional: false

suite: janitor GPU reset Job template patch
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/janitor/templates/configmap.yaml
set:
  global.janitor.enabled: true
tests:
  - it: renders no patch by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: jobTemplatePatch

  # The patch is rendered as a string, so its field names keep their case.
  - it: renders the patch as a YAML string under resetJob
    set:
      janitor.config.controllers.gpuReset.resetJob.jobTemplatePatch:
        spec:
          activeDeadlineSeconds: 900
          template:
            spec:
              serviceAccountName: provider-reset
              initContainers:
                - name: stop-provider-daemonsets
                  image: provider/reset-hooks:1.0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\n  resetJob:\n(    .*\n)*    jobTemplatePatch: \|\n      spec:\n        activeDeadlineSeconds: 900\n'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\n            serviceAccountName: provider-reset\n'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\n            initContainers:\n            - image: provider/reset-hooks:1.0\n              name: stop-provider-daemonsets\n'

# The Job calls umbrella helpers, as in deployed_crversion_test.yaml.
suite: percona mongodb initialization Job deadline
templates:
  - charts/mongodb-store/templates/jobs.yaml
release:
  name: nvsentinel
  namespace: nvsentinel
set:
  global.mongodbStore.enabled: true
  mongodb-store.useBitnami: false
  mongodb-store.usePerconaOperator: true
tests:
  - it: uses a 30 minute deadline by default
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1800
      - matchRegex:
          path: metadata.name
          pattern: ^create-mongodb-database-2592000-[0-9a-f]{8}$
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true
  - it: renders a custom deadline
    documentSelector:
      path: kind
      value: Job
    set:
      mongodb-store.job.activeDeadlineSeconds: 3600
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 3600
      - matchRegex:
          path: metadata.name
          pattern: ^create-mongodb-database-2592000-[0-9a-f]{8}$
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true
  - it: retains the default for null
    documentSelector:
      path: kind
      value: Job
    set:
      mongodb-store.job.activeDeadlineSeconds: null
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1800
      - matchRegex:
          path: metadata.name
          pattern: ^create-mongodb-database-2592000-[0-9a-f]{8}$
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true
  - it: omits the deadline for zero
    documentSelector:
      path: kind
      value: Job
    set:
      mongodb-store.job.activeDeadlineSeconds: 0
    asserts:
      - notExists:
          path: spec.activeDeadlineSeconds
      - matchRegex:
          path: metadata.name
          pattern: ^create-mongodb-database-2592000-[0-9a-f]{8}$
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true
  - it: rejects a negative deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: -1
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects a fractional deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: 1.5
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects a quoted deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: "1800"
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects a boolean deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: true
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects an empty string deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: ""
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects a list deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: []
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)
  - it: rejects a mapping deadline
    set:
      mongodb-store.job.activeDeadlineSeconds: {}
    asserts:
      - failedTemplate:
          errorMessage: mongodb-store.job.activeDeadlineSeconds must be a non-negative integer (0 disables the deadline)

suite: datastore health events cleanup
templates:
  - templates/configmap-datastore.yaml
tests:
  - it: passes the PostgreSQL health event retention settings to the components
    set:
      global.datastore:
        provider: postgresql
        connection:
          host: postgres.example.com
          port: 5432
          database: nvsentinel
          username: nvsentinel
        healthEventsCleanup:
          retention: 720h
          interval: 30m
          batchSize: 5000
          maxBatches: 20
    asserts:
      - equal:
          path: data.DATASTORE_HEALTH_EVENTS_RETENTION
          value: "720h"
      - equal:
          path: data.DATASTORE_HEALTH_EVENTS_CLEANUP_INTERVAL
          value: "30m"
      - equal:
          path: data.DATASTORE_HEALTH_EVENTS_CLEANUP_BATCH_SIZE
          value: "5000"
      - equal:
          path: data.DATASTORE_HEALTH_EVENTS_CLEANUP_MAX_BATCHES
          value: "20"

  - it: leaves retention off when it is not set
    set:
      global.datastore:
        provider: postgresql
        connection:
          host: postgres.example.com
          port: 5432
          database: nvsentinel
          username: nvsentinel
    asserts:
      - notExists:
          path: data.DATASTORE_HEALTH_EVENTS_RETENTION
      - notExists:
          path: data.DATASTORE_HEALTH_EVENTS_CLEANUP_INTERVAL

  - it: renders only the settings that are set
    set:
      global.datastore:
        provider: postgresql
        connection:
          host: postgres.example.com
          port: 5432
          database: nvsentinel
          username: nvsentinel
        healthEventsCleanup:
          retention: 168h
    asserts:
      - equal:
          path: data.DATASTORE_HEALTH_EVENTS_RETENTION
          value: "168h"
      - notExists:
          path: data.DATASTORE_HEALTH_EVENTS_CLEANUP_BATCH_SIZE

  - it: does not render the settings for MongoDB, which uses collectionExpirySeconds
    set:
      global.datastore:
        provider: mongodb
        credentialsFromSecret:
          name: external-mongodb
        connection:
          host: mongodb.example.com
          port: 27017
          database: HealthEventsDatabase
        healthEventsCleanup:
          retention: 720h
    asserts:
      - notExists:
          path: data.DATASTORE_HEALTH_EVENTS_RETENTION

suite: platform-connectors selinux options
templates:
  - templates/configmap.yaml
  - templates/daemonset.yaml
tests:
  - it: must not set a pod securityContext by default
    template: templates/daemonset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: must set pod SELinux options from global.seLinuxOptions
    set:
      global.seLinuxOptions:
        type: spc_t
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seLinuxOptions:
              type: spc_t

  - it: must keep the audit-logging fsGroup alongside SELinux options
    set:
      global.auditLogging.enabled: true
      global.seLinuxOptions:
        type: spc_t
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 65532
            seLinuxOptions:
              type: spc_t

  - it: must keep the audit-logging fsGroup alone when SELinux options are unset
    set:
      global.auditLogging.enabled: true
    template: templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 65532

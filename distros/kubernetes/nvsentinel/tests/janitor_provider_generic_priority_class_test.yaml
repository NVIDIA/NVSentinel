suite: janitor-provider generic reboot job priority class
release:
  name: nvsentinel
  namespace: nvsentinel
templates:
  - charts/janitor-provider/templates/deployment.yaml
set:
  global.janitorProvider.enabled: true
  janitor-provider.csp.provider: generic
tests:
  - it: does not set GENERIC_REBOOT_JOB_PRIORITY_CLASS_NAME by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENERIC_REBOOT_JOB_PRIORITY_CLASS_NAME
          any: true

  - it: passes rebootJobPriorityClassName to GENERIC_REBOOT_JOB_PRIORITY_CLASS_NAME
    set:
      janitor-provider.csp.generic.rebootJobPriorityClassName: system-node-critical
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENERIC_REBOOT_JOB_PRIORITY_CLASS_NAME
            value: system-node-critical

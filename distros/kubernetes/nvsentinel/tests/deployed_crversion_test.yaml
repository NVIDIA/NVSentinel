# Lives in the umbrella suite because the bootstrap Job calls umbrella helpers,
# so it cannot render with the subchart alone.
suite: deployed crVersion check
templates:
  - charts/mongodb-store/templates/jobs.yaml
set:
  global.mongodbStore.enabled: true
  mongodb-store.useBitnami: false
  mongodb-store.usePerconaOperator: true
tests:
  - it: grants nothing and adds no init container by default
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["psmdb.percona.com"]
            resources: ["perconaservermongodbs"]
            verbs: ["get"]
        documentIndex: 1
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: validate-deployed-crversion
          any: true
        documentIndex: 3

  # The grant and the check are gated on one value, so an install can never
  # carry the permission without the check that justifies it.
  - it: adds the init container when enabled
    set:
      mongodb-store.validateDeployedCrVersion: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: validate-deployed-crversion
          any: true
        documentIndex: 3

  - it: grants get on perconaservermongodbs when enabled
    set:
      mongodb-store.validateDeployedCrVersion: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["psmdb.percona.com"]
            resources: ["perconaservermongodbs"]
            verbs: ["get"]
        documentIndex: 1

  # Bitnami has no custom resource to read, so neither half may appear.
  - it: stays absent on the Bitnami backend even when enabled
    set:
      mongodb-store.useBitnami: true
      mongodb-store.usePerconaOperator: false
      mongodb-store.validateDeployedCrVersion: true
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["psmdb.percona.com"]
            resources: ["perconaservermongodbs"]
            verbs: ["get"]
        documentIndex: 1
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: validate-deployed-crversion
          any: true
        documentIndex: 3

  # The comparison is against the operator tag, so the rendered script has to
  # carry it. A refactor that drops either interpolation would leave the check
  # silently skipping on an empty version or looking up the wrong resource.
  - it: carries the operator tag and the resource name into the script
    set:
      mongodb-store.validateDeployedCrVersion: true
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[3].command[2]
          pattern: 'OP_TAG="1\.23\.0"'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.initContainers[3].command[2]
          pattern: 'CR_NAME="mongodb"'
        documentIndex: 3

  - it: follows psmdb-db.fullnameOverride when the resource is renamed
    set:
      mongodb-store.validateDeployedCrVersion: true
      mongodb-store.psmdb-db.fullnameOverride: sentinel-store
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[3].command[2]
          pattern: 'CR_NAME="sentinel-store"'
        documentIndex: 3

suite: external mongodb setup job
templates:
  - templates/job-external-mongodb-setup.yaml
set:
  global.datastore:
    provider: mongodb
    credentialsFromSecret:
      name: external-mongodb
  global.mongodbStore.enabled: false
tests:
  # app.kubernetes.io/name has to carry the Job's own name and be emitted once.
  # Appending it after the common labels emitted it twice, and a duplicate
  # mapping key makes strict parsers reject the whole release even though Helm itself renders it.
  - it: names the Job distinctly without duplicating the label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: external-mongodb-setup
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mongodb-init

  - it: keeps the common labels alongside the Job-specific name
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]

  # The deployment platform connector's replicas are ready only once this
  # index exists, so the setup script creates it with the other indexes, and
  # the Job is not a hook: a post-install hook (Argo PostSync) waits for the
  # pods to be ready, and the pods wait for the index.
  - it: creates the idempotency index in a plain Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "var idempotencyIndexName = 'healthevent_idempotency_key_unique';"
      # The script runs inside sh -c with the eval in double quotes, so the
      # dollar of the index filter's $exists must reach mongosh escaped;
      # unescaped it would expand to an empty shell variable.
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '\{ ''\\\$exists'': true \}'
      - isNull:
          path: metadata.annotations["helm.sh/hook"]

  # The Job is immutable and no longer a hook, so the hash that makes a
  # changed pod template a new Job must survive the 63-character name limit:
  # a long release name is shortened, the hash never is.
  - it: keeps the hash in the name for a long release name
    release:
      name: customer-production-gpu-cluster-nvsentinel
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^customer-production-gpu-external-mongodb-setup-[0-9]+-[0-9a-f]{8}$

suite: external mongodb setup job
templates:
  - templates/job-external-mongodb-setup.yaml
set:
  global.datastore:
    provider: mongodb
    credentialsFromSecret:
      name: external-mongodb
  global.mongodbStore.enabled: false
tests:
  # app.kubernetes.io/name has to carry the Job's own name and be emitted once.
  # Appending it after the common labels emitted it twice, and a duplicate
  # mapping key makes strict parsers reject the whole release even though Helm itself renders it.
  - it: names the Job distinctly without duplicating the label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: external-mongodb-setup
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mongodb-init

  - it: keeps the common labels alongside the Job-specific name
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]

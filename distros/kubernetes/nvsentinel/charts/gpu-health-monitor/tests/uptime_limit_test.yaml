suite: GpuUptimeLimitWatch configuration
templates:
  - templates/configmap.yaml
tests:
  - it: renders the check disabled by default
    set:
      global.platformConnectorAuth.enabled: false
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[uptimelimit\\]\\n\\s*Enabled = false\\n\\s*StoreOnly = true\\n\\s*AffectedVbiosVersions = \\n\\s*MaxUptimeHours = 0\\n\\s*StaggerHours = 0\\n"

  - it: maps the error code to a reboot
    set:
      global.platformConnectorAuth.enabled: false
    asserts:
      - matchRegex:
          path: data["dcgmerrorsmapping.csv"]
          pattern: "(?m)^GPU_UPTIME_LIMIT_EXCEEDED,RESTART_BM$"

  - it: renders an enabled check
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.storeOnly: false
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B", "96.00.AF.00.01"]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[uptimelimit\\]\\n\\s*Enabled = true\\n\\s*StoreOnly = false\\n\\s*AffectedVbiosVersions = 97\\.00\\.82\\.00\\.4B,96\\.00\\.AF\\.00\\.01\\n\\s*MaxUptimeHours = 1512\\n\\s*StaggerHours = 0\\n"
      - notMatchRegex:
          path: data["config.ini"]
          pattern: "AffectedDriverVersions"

  - it: rejects an enabled check without versions
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit must list at least one non-blank affectedVbiosVersions entry when uptimeLimit.enabled is true

  - it: rejects an enabled check without a limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.maxUptimeHours must be a finite number greater than 0 when uptimeLimit.enabled is true

  - it: rejects a quoted limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.maxUptimeHours: "1512"
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.maxUptimeHours must be a number, got string "1512"; with --set, use --set-json for a value with a fraction

  - it: rejects an unquoted version that YAML reads as a number
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: [97.10]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedVbiosVersions entries must be quoted strings, got float64 97.1; for example, an unquoted 97.00 is read as 97

  - it: rejects an unquoted vBIOS version even when the check is disabled
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.affectedVbiosVersions: [97]
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedVbiosVersions entries must be quoted strings, got float64 97; for example, an unquoted 97.00 is read as 97

  - it: rejects an enabled check whose versions are all blank
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["", "  "]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit must list at least one non-blank affectedVbiosVersions entry when uptimeLimit.enabled is true

  - it: rejects a version string where a list is expected
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.affectedVbiosVersions: "97.00.82.00.4B"
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedVbiosVersions must be a list, got string 97.00.82.00.4B

  - it: accepts a limit with a fraction
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1512.5
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "MaxUptimeHours = 1512\\.5\\n"

  - it: rejects a version entry that contains a comma
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: [", "]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedVbiosVersions entries must not contain a comma, got ", "; list each version as its own entry

  - it: accepts a blank entry beside a real version
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B", ""]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "AffectedVbiosVersions = 97\\.00\\.82\\.00\\.4B,\\n"

  - it: rejects an enabled check that lists only driver versions
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: ["570.133.20"]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit must list at least one non-blank affectedVbiosVersions entry when uptimeLimit.enabled is true

  - it: renders a stagger
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1440
      uptimeLimit.staggerHours: 72
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "\\n\\s*MaxUptimeHours = 1440\\n\\s*StaggerHours = 72\\n"

  - it: accepts a stagger with a fraction
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1440
      uptimeLimit.staggerHours: 71.5
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "StaggerHours = 71\\.5\\n"

  - it: rejects a negative stagger
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1440
      uptimeLimit.staggerHours: -1
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.staggerHours must be a finite number of at least 0 and less than maxUptimeHours when uptimeLimit.enabled is true

  - it: rejects a stagger equal to the limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1440
      uptimeLimit.staggerHours: 1440
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.staggerHours must be a finite number of at least 0 and less than maxUptimeHours when uptimeLimit.enabled is true

  - it: rejects a stagger greater than the limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1440.5
      uptimeLimit.staggerHours: 2000
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.staggerHours must be a finite number of at least 0 and less than maxUptimeHours when uptimeLimit.enabled is true

  - it: rejects a quoted stagger
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.staggerHours: "72"
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.staggerHours must be a number, got string "72"; with --set, use --set-json for a value with a fraction

  - it: does not range-check the stagger when the check is disabled
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.staggerHours: -1
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "StaggerHours = -1\\n"

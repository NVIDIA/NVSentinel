suite: GpuUptimeLimitWatch configuration
templates:
  - templates/configmap.yaml
tests:
  - it: renders the check disabled by default
    set:
      global.platformConnectorAuth.enabled: false
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[uptimelimit\\]\\n\\s*Enabled = false\\n\\s*StoreOnly = true\\n\\s*AffectedDriverVersions = \\n\\s*AffectedVbiosVersions = \\n\\s*MaxUptimeHours = 0\\n"

  - it: maps the error code to a reboot
    set:
      global.platformConnectorAuth.enabled: false
    asserts:
      - matchRegex:
          path: data["dcgmerrorsmapping.csv"]
          pattern: "(?m)^GPU_UPTIME_LIMIT_EXCEEDED,RESTART_BM$"

  - it: renders an enabled check
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.storeOnly: false
      uptimeLimit.affectedDriverVersions: ["570.133.20", "580.82.07"]
      uptimeLimit.affectedVbiosVersions: ["97.00.82.00.4B"]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[uptimelimit\\]\\n\\s*Enabled = true\\n\\s*StoreOnly = false\\n\\s*AffectedDriverVersions = 570\\.133\\.20,580\\.82\\.07\\n\\s*AffectedVbiosVersions = 97\\.00\\.82\\.00\\.4B\\n\\s*MaxUptimeHours = 1512\\n"

  - it: rejects an enabled check without versions
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit must list at least one non-blank affectedDriverVersions or affectedVbiosVersions entry when uptimeLimit.enabled is true

  - it: rejects an enabled check without a limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: ["570.133.20"]
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.maxUptimeHours must be a finite number greater than 0 when uptimeLimit.enabled is true

  - it: rejects a quoted limit
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.maxUptimeHours: "1512"
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.maxUptimeHours must be a number, got string "1512"; with --set, use --set-json for a value with a fraction

  - it: rejects an unquoted version that YAML reads as a number
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.affectedDriverVersions: [580.10]
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedDriverVersions entries must be quoted strings, got float64 580.1; for example, an unquoted 580.10 is read as 580.1

  - it: rejects an unquoted vBIOS version even when the check is disabled
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.affectedVbiosVersions: [97]
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedVbiosVersions entries must be quoted strings, got float64 97; for example, an unquoted 580.10 is read as 580.1

  - it: rejects an enabled check whose versions are all blank
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: ["", "  "]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit must list at least one non-blank affectedDriverVersions or affectedVbiosVersions entry when uptimeLimit.enabled is true

  - it: rejects a version string where a list is expected
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.affectedDriverVersions: "570.133.20"
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedDriverVersions must be a list, got string 570.133.20

  - it: accepts a limit with a fraction
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: ["570.133.20"]
      uptimeLimit.maxUptimeHours: 1512.5
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "MaxUptimeHours = 1512\\.5\\n"

  - it: rejects a version entry that contains a comma
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: [", "]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - failedTemplate:
          errorMessage: gpu-health-monitor.uptimeLimit.affectedDriverVersions entries must not contain a comma, got ", "; list each version as its own entry

  - it: accepts a blank entry beside a real version
    set:
      global.platformConnectorAuth.enabled: false
      uptimeLimit.enabled: true
      uptimeLimit.affectedDriverVersions: ["570.133.20", ""]
      uptimeLimit.maxUptimeHours: 1512
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "AffectedDriverVersions = 570\\.133\\.20,\\n"


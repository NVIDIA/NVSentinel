suite: observe-only DCGM flags
templates:
  - templates/configmap.yaml
tests:
  - it: keeps probe hangs and NVSwitch events observe-only by default
    set:
      global.platformConnectorAuth.enabled: false
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[dcgm\\].*ProbeStoreOnly = true\\n.*NvswitchStoreOnly = true\\n"

  - it: renders probeStoreOnly on its own
    set:
      global.platformConnectorAuth.enabled: false
      dcgm.probeStoreOnly: false
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[dcgm\\].*ProbeStoreOnly = false\\n.*NvswitchStoreOnly = true\\n"

  - it: renders nvswitchStoreOnly on its own
    set:
      global.platformConnectorAuth.enabled: false
      dcgm.nvswitchStoreOnly: false
    asserts:
      - matchRegex:
          path: data["config.ini"]
          pattern: "(?s)\\[dcgm\\].*ProbeStoreOnly = true\\n.*NvswitchStoreOnly = false\\n"

image:
  repository: nvcr.io/nv-ngc-devops/nvsentinel/gpu-health-monitor
  pullPolicy: IfNotPresent

imagePullSecrets: 
  - name: nvidia-ngcuser-pull-secret

nameOverride: ""
fullnameOverride: ""

updateStrategy: RollingUpdate
maxUnavailable: 1

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsUser: 0

resources: 
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  nvidia.com/gpu.present: "true"

tolerations: 
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

affinity: {}

useHostNetworking: true
metricsPort: 8000

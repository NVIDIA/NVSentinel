image:
  repository: nvcr.io/nv-ngc-devops/nvsentinel/gpu-health-monitor
  pullPolicy: IfNotPresent

imagePullSecrets: 
  - name: nvidia-ngcuser-pull-secret

nameOverride: ""
fullnameOverride: ""

updateStrategy: RollingUpdate
maxUnavailable: 1

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsUser: 0

resources: 
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  nvidia.com/gpu.present: "true"

additionalHostVolumes:
  - name: vulkan-icd-mount
    hostPath:
      path: /home/kubernetes/bin/nvidia/vulkan/icd.d
      type: Directory
  - name: nvidia-install-dir-host
    hostPath:
      path: /home/kubernetes/bin/nvidia
      type: Directory

additionalVolumeMounts:
  - mountPath: /usr/local/nvidia
    name: nvidia-install-dir-host
    readOnly: true
  - mountPath: /etc/vulkan/icd.d
    name: vulkan-icd-mount
    readOnly: true

tolerations: 
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

affinity: {}

useHostNetworking: true
metricsPort: 8000

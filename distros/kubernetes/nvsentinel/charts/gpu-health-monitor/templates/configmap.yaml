apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu-health-monitor.fullname" . }}
  labels:
    {{- include "gpu-health-monitor.labels" . | nindent 4 }}
data:
  config.ini: |
    [logging]
    LogFormat = %%(asctime)s,%%(msecs)03d %%(levelname)-8s [%%(filename)s:%%(lineno)d] %%(message)s
    DateTimeFormat = %%Y-%%m-%%d:%%H:%%M:%%S

    [dcgm]
    {{- $poll := .Values.dcgm.pollIntervalSeconds | default 15 }}
    {{- /* Only nil falls back; 0 is a valid override that disables the watchdog. */}}
    {{- $deadline := .Values.dcgm.probeDeadlineSeconds }}
    {{- if kindIs "invalid" $deadline }}
    {{- $deadline = mul $poll 3 }}
    {{- end }}
    PollIntervalSeconds = {{ $poll }}
    ProbeDeadlineSeconds = {{ $deadline }}
    ProbeStoreOnly = {{ .Values.dcgm.probeStoreOnly }}

    [dcgmfieldsmonitoring]
    gputemplimitmonitoringenabled = {{ .Values.dcgmFieldsMonitoring.gpuTempLimitMonitoringEnabled }}
    gputemplimitstoreonly = {{ .Values.dcgmFieldsMonitoring.gpuTempLimitStoreOnly }}
    gpupowerbrakemonitoringenabled = {{ .Values.dcgmFieldsMonitoring.gpuPowerBrakeMonitoringEnabled }}
    gpupowerbrakestoreonly = {{ .Values.dcgmFieldsMonitoring.gpuPowerBrakeStoreOnly }}
    gpupowerbrakeminconsecutivepolls = {{ .Values.dcgmFieldsMonitoring.gpuPowerBrakeMinConsecutivePolls }}

    [dcgmhealthcheck]
    SuppressedErrorCodes = {{ .Values.dcgmHealthCheck.suppressedErrorCodes | join "," }}
    ConnectivityFailureEscalationThreshold = {{ .Values.dcgmHealthCheck.connectivityFailureEscalationThreshold }}
{{- $debounce := list }}
{{- range $code, $polls := .Values.dcgmHealthCheck.minConsecutivePolls }}
{{- $debounce = append $debounce (printf "%s=%d" $code (int $polls)) }}
{{- end }}
    MinConsecutivePolls = {{ join "," $debounce }}

    [eventprocessors.kubernetes]
    ConflictRetryCount = 10

    [eventprocessors.platformconnector]
    SocketPath = /var/run/nvsentinel.sock

    [cli]
    EnabledEventProcessors = PlatformConnectorEventProcessor

{{ (.Files.Glob "files/dcgmerrorsmapping.csv").AsConfig | indent 2 }}

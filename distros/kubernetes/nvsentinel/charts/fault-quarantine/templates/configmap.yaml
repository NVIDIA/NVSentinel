apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-quarantine-config
  labels:
    {{- include "fault-quarantine-module.labels" . | nindent 4 }}
data:
  config.toml: |
    [[rule-sets]]
      version = "1"
      name = "NIC fatal error ruleset"                  # an admin friendly name for the rule set, used only for logging

      [[rule-sets.match.all]]
        kind = "HealthEvent"                   # the kind of rule (the evaluator to use)
        expression = "event.agent == 'nic-health-monitor' && event.componentClass == 'NIC'"

      [[rule-sets.match.all]]
        kind = "HealthEvent" 
        expression = "event.isFatal == true"

      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "NICErrOccurred"
        effect = "NoSchedule"

      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      version = "1"
      name = "GPU fatal error ruleset"              

      [[rule-sets.match.all]]
        kind = "HealthEvent"                 
        expression = "event.isFatal == true"

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'gpu-health-monitor' && event.componentClass == 'GPU'"

      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "GPUErrOccurred"
        effect = "NoSchedule"

      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      version = "1"
      name = "NVSwitch fatal error ruleset"    

      [[rule-sets.match.all]]
        kind = "HealthEvent" 
        expression = "event.agent == 'nvswitch-health-monitor' && event.checkName == 'NvswitchErrorFromKmsgWatch'"

      [[rule-sets.match.all]]
        kind = "HealthEvent" 
        expression = "event.isFatal == true"

      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "NVSwitchErrOccurred"
        effect = "NoSchedule"

      [rule-sets.cordon]
        shouldCordon = true



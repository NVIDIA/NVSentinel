replicaCount: 1

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

resources: 
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "1"
    memory: "1Gi"

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}

tolerations: []

metricsPort: 2112

# Log level for the fault quarantine module (klog verbosity)
logLevel: 1

clientCertMountPath: "/etc/ssl/mongo-client"

circuitBreaker:
  enabled: true
  percentage: 50
  duration: 5m

config: |
  label-prefix = "k8saas.nvidia.com/"
  
  [[rule-sets]]
    version = "1"
    name = "NIC fatal error ruleset"                  # an admin friendly name for the rule set, used only for logging

    [[rule-sets.match.all]]
      kind = "HealthEvent"                   # the kind of rule (the evaluator to use)
      expression = "event.agent == 'nic-health-monitor' && event.componentClass == 'NIC'"

    [[rule-sets.match.all]]
      kind = "HealthEvent" 
      expression = "event.isFatal == true"

    [[rule-sets.match.all]]w
      kind = "Node"
      expression = '''
          !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
      '''
    [[rule-sets.match.all]]
      kind = "MaxPercentageOfNodesToCordon"
      expression = "maxPercentageOfNodesToCordon <= 100.0"
  
    [rule-sets.cordon]
      shouldCordon = true

  [[rule-sets]]
    version = "1"
    name = "GPU fatal error ruleset"              

    [[rule-sets.match.all]]
      kind = "HealthEvent"                 
      expression = "event.isFatal == true && (event.errorCode == null || !event.errorCode.exists(e, e == 'DCGM_FR_CLOCK_THROTTLE_POWER'))"  # We need to exclude DCGM error DCGM_FR_CLOCK_THROTTLE_POWER due to a bug in driver R550: https://nvbugspro.nvidia.com/bug/4838367

    [[rule-sets.match.all]]
      kind = "HealthEvent"
      expression = "event.agent == 'gpu-health-monitor' && event.componentClass == 'GPU' && (event.errorCode == null || !event.errorCode.exists(e, e == 'DCGM_FR_CLOCK_THROTTLE_POWER'))"


    [[rule-sets.match.all]]
      kind = "Node"
      expression = '''
          !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
      '''

    [[rule-sets.match.all]]
      kind = "MaxPercentageOfNodesToCordon"
      expression = "maxPercentageOfNodesToCordon <= 100.0"

    [rule-sets.cordon]
      shouldCordon = true

  [[rule-sets]]
    version = "1"
    name = "NVSwitch fatal error ruleset"    

    [[rule-sets.match.all]]
      kind = "HealthEvent" 
      expression = "event.agent == 'nvswitch-health-monitor' && event.checkName == 'NvswitchErrorFromKmsgWatch'"

    [[rule-sets.match.all]]
      kind = "HealthEvent" 
      expression = "event.isFatal == true"

    [[rule-sets.match.all]]
      kind = "Node"
      expression = '''
          !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
      '''
      
    [[rule-sets.match.all]]
      kind = "MaxPercentageOfNodesToCordon"
      expression = "maxPercentageOfNodesToCordon <= 100.0"

    [rule-sets.cordon]
      shouldCordon = true

  [[rule-sets]]
    version = "1"
    name = "CSP health monitor fatal error ruleset"    

    [[rule-sets.match.all]]
      kind = "HealthEvent" 
      expression = "event.agent == 'csp-health-monitor' && event.checkName == 'CSPMaintenance'"

    [[rule-sets.match.all]]
      kind = "HealthEvent" 
      expression = "event.isFatal == true"

    [[rule-sets.match.all]]
      kind = "Node"
      expression = '''
          !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
      '''
      
    [[rule-sets.match.all]]
      kind = "MaxPercentageOfNodesToCordon"
      expression = "maxPercentageOfNodesToCordon <= 100.0"

    [rule-sets.cordon]
      shouldCordon = true

  [[rule-sets]]
    version = "1"
    name = "Syslog fatal error ruleset"

    [[rule-sets.match.all]]
      kind = "HealthEvent"
      expression = "event.agent == 'syslog-health-monitor' && event.componentClass == 'GPU'"

    [[rule-sets.match.all]]
      kind = "HealthEvent"
      expression = "event.isFatal == true"

    [[rule-sets.match.all]]
      kind = "Node"
      expression = '''
          !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
      '''

    [[rule-sets.match.all]]
      kind = "MaxPercentageOfNodesToCordon"
      expression = "maxPercentageOfNodesToCordon <= 100.0"

    [rule-sets.cordon]
      shouldCordon = true

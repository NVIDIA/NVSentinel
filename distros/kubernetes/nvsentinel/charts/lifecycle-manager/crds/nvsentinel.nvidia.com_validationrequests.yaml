---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: validationrequests.nvsentinel.nvidia.com
spec:
  group: nvsentinel.nvidia.com
  names:
    kind: ValidationRequest
    listKind: ValidationRequestList
    plural: validationrequests
    singular: validationrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ValidationRequest is the Schema for the ValidationRequests API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state.
            properties:
              nodes:
                description: Nodes lists the nodes to validate.
                items:
                  description: NodeSpec identifies a node to include in the validation
                    run.
                  properties:
                    name:
                      description: Name is the node name.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              tests:
                description: |-
                  Tests lists the test names to run. Each name must reference a key in
                  ValidationConfiguration.spec.tests. If empty, defaultTests from the active
                  ValidationConfiguration are used.
                items:
                  type: string
                type: array
            required:
            - nodes
            type: object
          status:
            description: Status defines the observed state.
            properties:
              completionTime:
                description: CompletionTime is when the ValidationRequest reached
                  a terminal phase.
                format: date-time
                type: string
              conditions:
                description: Conditions reflect the current status of the ValidationRequest
                  using standard Kubernetes condition types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: Phase is the overall lifecycle state of the ValidationRequest.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              skipped:
                description: Skipped records nodes and tests that were omitted from
                  execution.
                properties:
                  nodes:
                    description: Nodes lists nodes that were skipped because they
                      no longer exist.
                    items:
                      type: string
                    type: array
                  tests:
                    description: |-
                      Tests lists tests that were skipped due to unmet batch minimums with
                      batchFailurePolicy: ignore.
                    items:
                      type: string
                    type: array
                type: object
              startTime:
                description: StartTime is when reconciliation began.
                format: date-time
                type: string
              testGroups:
                description: TestGroups tracks progress of each test group.
                items:
                  description: TestGroupStatus tracks the progress of a single test
                    group across all its attempts.
                  properties:
                    attempts:
                      description: Attempts records each execution attempt for this
                        group.
                      items:
                        description: AttemptStatus records the outcome of a single
                          test execution attempt.
                        properties:
                          endTime:
                            description: EndTime is when the attempt completed.
                            format: date-time
                            type: string
                          failedNodes:
                            description: FailedNodes lists nodes that caused this
                              specific attempt to fail.
                            items:
                              type: string
                            type: array
                          failureReason:
                            description: FailureReason describes why the attempt failed.
                            enum:
                            - TestFailed
                            - TestTimeout
                            - NodeReadinessViolation
                            - NodeDeleted
                            - BatchMinimumNotMet
                            type: string
                          objectName:
                            description: ObjectName is the name of the provider resource
                              created for this attempt.
                            type: string
                          phase:
                            description: Phase is the current lifecycle state of this
                              attempt.
                            enum:
                            - Pending
                            - Running
                            - Succeeded
                            - Failed
                            type: string
                          startTime:
                            description: StartTime is when the attempt began.
                            format: date-time
                            type: string
                        type: object
                      type: array
                    name:
                      description: Name identifies this test group.
                      type: string
                    nodes:
                      default: []
                      description: Nodes lists the node names included in this group.
                      items:
                        type: string
                      type: array
                    phase:
                      description: Phase is the current lifecycle state of this test
                        group.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      type: string
                    provider:
                      description: |-
                        Provider is the key of the provider in the ValidationConfiguration used to create this group's
                        provider resources. This allows fetching each AttemptStatus.ObjectName by GVK.
                      type: string
                    tests:
                      default: []
                      description: Tests lists the test names included in this group.
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  - nodes
                  - provider
                  - tests
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

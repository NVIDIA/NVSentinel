suite: ResourceSlice RBAC
templates:
  - templates/clusterrole.yaml
tests:
  - it: grants ResourceSlice read access for the default gpu-allocatable readiness criterion
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceslices
            verbs:
              - list
              - watch

  - it: grants ResourceSlice read access when only a newNodeValidation criterion references resourceSlices
    set:
      config.readinessCriteria:
        - name: not-under-quarantine
          expression: '!has(node.metadata.annotations)'
      config.newNodeValidation.criteria:
        - name: gpu-present
          expression: 'resourceSlices.exists(s, s.spec.driver == "gpu.nvidia.com")'
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceslices
            verbs:
              - list
              - watch

  - it: omits ResourceSlice access when no criterion references resourceSlices
    set:
      config.readinessCriteria:
        - name: not-under-quarantine
          expression: '!has(node.metadata.annotations)'
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceslices
          any: true

  - it: omits ResourceSlice access when the validation controller is disabled
    set:
      controllers.validationRequest.enabled: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceslices
          any: true

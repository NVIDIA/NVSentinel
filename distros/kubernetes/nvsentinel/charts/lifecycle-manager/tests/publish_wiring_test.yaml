suite: lifecycle-manager publishTo wiring
templates:
  - templates/deployment.yaml
  # Rendered too because the template above checksum-annotates them.
  - templates/configmap.yaml
  - templates/configmap-templates.yaml
release:
  name: nvsentinel
  namespace: nvsentinel
set:
  global.tracing.enabled: false
  controllers.maintenanceRequest.enabled: true
  global.platformConnectorAuth.enabled: true
  global.platformConnectorAuth.audience: platform-connector.nvsentinel.nvidia.com
  global.platformConnectorAuth.tokenMountPath: /var/run/secrets/nvsentinel/platform-connector
  global.platformConnectorAuth.tokenExpirationSeconds: 3600
tests:
  # With publishTo "deployment" the MaintenanceRequest controller dials the
  # deployment platform connector over TLS with the socket token from its usual
  # mount, and carries the label the connector's network policy admits.
  - it: wires the MaintenanceRequest controller to the deployment platform connector
    template: templates/deployment.yaml
    set:
      publishTo: deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TARGET
            value: platform-connector-deployment.nvsentinel.svc.cluster.local:50051
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TOKEN_PATH
            value: /var/run/secrets/nvsentinel/platform-connector/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TLS_CA_FILE
            value: /etc/nvsentinel/platform-connector-deployment-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: platform-connector-deployment-ca
            mountPath: /etc/nvsentinel/platform-connector-deployment-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: platform-connector-deployment-ca
            secret:
              secretName: platform-connector-deployment-grpc-cert
              items:
                - key: ca.crt
                  path: ca.crt

  - it: sends no CA and marks the connection insecure in the TLS development mode
    template: templates/deployment.yaml
    set:
      publishTo: deployment
      global.platformConnectorDeployment.tls.mode: insecureDevelopmentMode
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_INSECURE
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TLS_CA_FILE
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: platform-connector-deployment-ca
          any: true

  - it: follows a global gRPC port override
    template: templates/deployment.yaml
    set:
      publishTo: deployment
      global.platformConnectorDeployment.grpcPort: 15055
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TARGET
            value: platform-connector-deployment.nvsentinel.svc.cluster.local:15055

  # The default keeps the socket, no direct-publish environment and no label.
  # deployment_test.yaml covers the socket token and its flag.
  - it: keeps the socket wiring by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: platform-connector-socket
            hostPath:
              path: /var/run/nvsentinel
              type: DirectoryOrCreate
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TARGET
          any: true

  # The switch belongs to the MaintenanceRequest controller; with it off the
  # chart publishes nothing and the value is ignored.
  - it: ignores publishTo while the MaintenanceRequest controller is off
    template: templates/deployment.yaml
    set:
      publishTo: deployment
      controllers.maintenanceRequest.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PUBLISH_TARGET
          any: true

  - it: refuses an unknown publishTo
    template: templates/deployment.yaml
    set:
      publishTo: sidecar
    asserts:
      - failedTemplate:
          errorPattern: lifecycle-manager.publishTo must be "socket" or "deployment"

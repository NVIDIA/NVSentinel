{{- if .Values.controllers.validationRequest.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lifecycle-manager.fullname" . }}
  labels:
    {{- include "lifecycle-manager.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  config.yaml: |
    apiVersion: nvsentinel.nvidia.com/v1alpha1
    kind: ValidationConfiguration
    metadata:
      name: default
    spec:
      schedulingGate:
        {{- toYaml .Values.config.schedulingGate | nindent 8 }}
      readinessCriteria:
        {{- toYaml .Values.config.readinessCriteria | nindent 8 }}
      defaultTests:
        {{- toYaml .Values.config.defaultTests | nindent 8 }}
      templateMountPath: {{ .Values.config.templateMountPath }}
      providers:
        {{- toYaml .Values.config.providers | nindent 8 }}
      maxConcurrentGroups: {{ .Values.config.maxConcurrentGroups }}
      tests:
        {{- toYaml .Values.config.tests | nindent 8 }}
{{- end }}

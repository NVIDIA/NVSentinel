---
{{- if ne .Values.webhook.certProvider "openshift-service-ca" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "lifecycle-manager.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lifecycle-manager.labels" . | nindent 4 }}
spec:
  secretName: {{ include "lifecycle-manager.fullname" . }}-webhook-cert
  duration: 8760h
  renewBefore: 360h
  subject:
    organizations:
      - NVIDIA
  commonName: {{ include "lifecycle-manager.fullname" . }}.{{ .Release.Namespace }}.svc
  dnsNames:
    - {{ include "lifecycle-manager.fullname" . }}
    - {{ include "lifecycle-manager.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "lifecycle-manager.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "lifecycle-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.webhook.certIssuer }}
    kind: Issuer
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "lifecycle-manager.fullname" . }}-validating-webhook
  labels:
    {{- include "lifecycle-manager.labels" . | nindent 4 }}
  annotations:
{{- if eq .Values.webhook.certProvider "openshift-service-ca" }}
    service.beta.openshift.io/inject-cabundle: "true"
{{- else }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "lifecycle-manager.fullname" . }}-webhook-cert
{{- end }}
webhooks:
  - name: vvalidationrequest-v1alpha1.kb.io
    clientConfig:
      service:
        name: {{ include "lifecycle-manager.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-nvsentinel-nvidia-com-v1alpha1-validationrequest
        port: {{ .Values.webhook.port }}
    rules:
      - apiGroups:
          - nvsentinel.nvidia.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - validationrequests
        scope: "Cluster"
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10

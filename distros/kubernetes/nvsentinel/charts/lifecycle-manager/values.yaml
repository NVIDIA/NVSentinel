replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/lifecycle-manager
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullNameOverride: "lifecycle-manager"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources: {}

nodeSelector: {}

# Pod priority for this component. Overridden by the matching global when that is set.
priorityClassName: ""

tolerations: []

affinity: {}

extraEnv: []

# We define the config as a Helm map rather than as an embedded ValidationConfiguration
# yaml string so that we can range over config.providers in the lifecycle-manager ClusterRole
# to automatically generate the lifecycle-manager ClusterRole
config:
  schedulingGate:
    cordon:
      remove: true
  readinessCriteria:
    - name: gpu-allocatable
      expression: >-
        has(node.status.allocatable) && "nvidia.com/gpu" in node.status.allocatable &&
        quantity(node.status.allocatable["nvidia.com/gpu"]) > 0
    - name: not-under-quarantine
      expression: >-
        !(has(node.metadata.annotations) &&
        "quarantineHealthEvent" in node.metadata.annotations)
  defaultTests:
    - dcgm-diag-test
  templateMountPath: /etc/nvsentinel/templates
  providers:
    k8s-job-provider:
      apiGroup: "batch"
      version: "v1"
      kind: "Job"
      resource: "jobs"
      templateFile: k8s-job-template.yaml
      supportsTestBatching: false
      retries: 5
      timeoutSeconds: 1800
      successfulCondition:
        type: Complete
        status: "True"
      failedCondition:
        type: Failed
        status: "True"
  maxConcurrentGroups: 3
  tests:
    dcgm-diag-test:
      provider: k8s-job-provider
      image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
      # Add dcgmi diag retries for runtime errors which indicate that dcgmi diag failed to run compared to
      # the command failing due to detecting a GPU health issue. Specifically, we have observed that dcgm-diag-test
      # retries can result in a DCGM_ST_IN_USE runtime error because a previous request to nv-hostengine does not
      # terminate if the client disconnects (for example if our dcgmi process has terminated). An optimization to
      # this script would be to call dcgmi diag --stop on exit or start-up. A related issue was observed in preflight
      # DCGM tests: https://github.com/NVIDIA/NVSentinel/issues/1363
      command:
        - sh
        - -c
        - |
          i=0
          max=10
          while [ "$i" -lt "$max" ]; do
            dcgmi diag --host nvidia-dcgm.gpu-operator.svc:5555 --run 2 --json > /tmp/dcgm-diag-out.json 2>&1
            rc=$?
            cat /tmp/dcgm-diag-out.json

            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q '"runtime_error"' /tmp/dcgm-diag-out.json; then
              echo "dcgmi diag failed with a diagnostic result (exit $rc); not retrying" >&2
              exit "$rc"
            fi

            i=$((i + 1))

            if [ "$i" -ge "$max" ]; then
              echo "dcgmi diag returned a runtime_error after $max attempts; giving up" >&2
              exit "$rc"
            fi

            echo "dcgmi diag returned a runtime_error (attempt $i/$max); retrying" >&2
            sleep 30
          done
      supportsBatchingNodes: false
      minimumNodesPerBatch: 1
      batchFailurePolicy: fail

  templates:
    "k8s-job-template.yaml": |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: {{.ValidationRequestName}}-{{.TestGroupName}}
        namespace: {{.Namespace}}
      spec:
        activeDeadlineSeconds: {{.TimeoutSeconds}}
        backoffLimit: 0
        template:
          spec:
            nodeName: {{(index .Nodes 0).NodeName}}
            restartPolicy: Never
            tolerations:
              {{- range .Tolerations}}
              - key: {{.Key}}
                value: {{.Value}}
                operator: {{.Operator}}
                effect: {{.Effect}}
              {{- end}}
            containers:
              - name: test
                image: {{.Image}}
                command:
                  {{- range .Command}}
                  - {{quote .}}
                  {{- end}}
                env:
                  {{- range .Env}}
                  - name: {{.Name}}
                    value: {{quote .Value}}
                  {{- end}}
  
controllers:
  validationRequest:
    enabled: true

leaderElection:
  enabled: true

webhook:
  port: 9443
  certDir: "/tmp/k8s-webhook-server/serving-certs"
  certIssuer: "lifecycle-manager-selfsigned-issuer"
  certProvider: cert-manager

metrics:
  tls:
    enabled: false
    certDir: "/tmp/k8s-metrics-server/metrics-certs"
    issuerName: ""
    issuerKind: "Issuer"
    issuerGroup: ""
    duration: "2160h"
    renewBefore: "720h"
    organization: "NVIDIA"

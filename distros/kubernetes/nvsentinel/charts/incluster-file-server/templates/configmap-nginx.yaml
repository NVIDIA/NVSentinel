{{ if or (eq .Values.global.clusterType "standalone") (eq .Values.global.clusterType "mgmt") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-file-server-nginx-conf
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      charset utf-8;

      access_log /dev/stdout;
      error_log /dev/stderr info;

      client_max_body_size 0;

      # Health endpoint for k8s probes (no auth)
      location = /healthz {
        access_log off;
        return 200;
      }

      location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
      }

      # Upload endpoint for collectors (no auth; restrict via NetworkPolicy)
      location /upload/ {
        root /usr/share/nginx/html;
        client_max_body_size 0;
        create_full_put_path on;
        dav_methods PUT DELETE MKCOL;
        dav_access user:rw group:rw all:r;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        disable_symlinks if_not_owner from=/usr/share/nginx/html;
      }
    }
{{- end }}

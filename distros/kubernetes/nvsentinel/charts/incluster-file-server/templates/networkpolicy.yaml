{{ if or (eq .Values.global.clusterType "standalone") (eq .Values.global.clusterType "mgmt") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: file-server-networkpolicy
  namespace: {{ .Release.Namespace }}
spec:
  # Select the file-server pods in this namespace
  podSelector:
    matchLabels:
      app: nvsentinel-file-server

  policyTypes:
    - Ingress

  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        # Allow only same-namespace traffic by default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}        

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fault-notification-module.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fault-notification-module.labels" . | nindent 4}}
  annotations:
    dgxc.nvidia.com/resource-category: management
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fault-notification-module.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fault-notification-module.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nvsentinel.serviceAccountName" . }}
      containers:
        - name: fault-notification
          image: "{{ .Values.global.faultNotificationModule.image.repository }}:{{ .Values.global.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.faultNotificationModule.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          args:
          - "--metrics-port={{ .Values.metricsPort }}"
          - "--config-path={{ .Values.configPath }}"
          - "--mongo-client-cert-mount-path={{ .Values.clientCertMountPath }}"
          - "--dry-run={{ .Values.global.dryRun }}"
          volumeMounts:
          - name: config-volume
            mountPath: /etc/config/config.toml
            subPath: config.toml
          - name: mongo-app-client-cert
            mountPath: {{ .Values.clientCertMountPath }}
            readOnly: true
          envFrom:
            - configMapRef:
                name: mongodb-config
                optional: true
      volumes:
      - name: config-volume
        configMap:
          name: fault-notification-config
          items:
          - key: config.toml
            path: config.toml
      - name: mongo-app-client-cert
        secret:
          secretName: mongo-app-client-cert-secret
          optional: true
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
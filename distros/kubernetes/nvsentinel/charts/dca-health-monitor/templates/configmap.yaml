apiVersion: v1
kind: ConfigMap
metadata:
  name: dca-health-monitor-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dca-health-monitor.labels" . | nindent 4 }}
data:
  fars_roles: |
    DRACO_CLUSTER_GPU-H100
    GPU-H100
  healthcheck_conf: |
    fars_host_endpoint: "localhost"
    fars_cache_file: "/tmp/farsroles.txt"
    fars_file_uid: 34000
    fars_file_gid: 30
    fars_static_file: "/etc/healthcheck/default/farsroles.txt"
  cluster_conf: |
    DRACO_CLUSTER_GPU-H100:
      _is_slurm_node: false
      _cluster:
          name: GPU-H100

    GPU-H100:

      hw_drv_gpu_ecc_error:
        uncorrected_total: 1024000
        corrected_total: 1024000
        uncorrected_total_sram: 1024000
        corrected_total_sram: 1024000
        uncorrected_vol: 3
        corrected_vol: 1024
        timeout: 60
        _group:
          - epilog
          - prolog
          - gpu

      hw_drv_gpu_ecc_remapped_rows:
        correctable_threshold: 1024
        banks_low: 3000
        banks_none: 3000
        banks_partial: 3000
        timeout: 60
        _group:
          - epilog
          - prolog
          - gpu
      
      sw_drv_config_nvidia_smi:
        timeout: 60
        _group:
            - prolog
            - epilog
            - gpu
          
      hw_drv_gpu_ecc_retired_pages:
        timeout: 60
        _group:
          - epilog
          - prolog
          - gpu



      hw_drv_gpu_topology:
        timeout: 60
        _group:
          - epilog
          - prolog
          - gpu

      sw_sys_config_nv_container_cli:
        _group:
          - software

      sw_sys_logs_qspi_timeout:
        path: /nvsentinel/var/log/journal
        matches:
            - "QSPI Transfer failed with timeout"
        count: 0
        boot: true
        tags:
            - "--priority=err"
            - "--dmesg"
        timeout: 120
        _group:
            - logs

      sw_sys_logs_lustre_error:
        path: /nvsentinel/var/log/journal
        matches:
            - "LNetError: "
            - "LustreError: "
        count: 0
        tags:
            - "--priority=err"
        ignore_case: false
        timeout: 60
        _group:
            - logs

      sw_sys_logs_io_error:
        path: /nvsentinel/var/log/journal
        matches:
            - "I/O error"
        count: 1
        boot: true
        tags:
            - "--priority=err"
            - "--identifier=kernel"
            - "--identifier=systemd"
        timeout: 60
        _group:
            - logs
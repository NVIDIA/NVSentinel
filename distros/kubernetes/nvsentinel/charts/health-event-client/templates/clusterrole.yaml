{{- if .Values.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "health-event-client.fullname" . }}
  labels:
    {{- include "health-event-client.labels" . | nindent 4 }}
rules:
- apiGroups:
  - janitor.dgxc.nvidia.com
  resources:
  - rebootnodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
{{- end }}


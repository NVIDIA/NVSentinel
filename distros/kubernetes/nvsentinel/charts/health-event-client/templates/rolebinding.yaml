{{- if .Values.roleBinding.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "health-event-client.fullname" . }}-mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "health-event-client.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Namespace }}-mongodb-role"
subjects:
- kind: ServiceAccount
  name: {{ include "health-event-client.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}

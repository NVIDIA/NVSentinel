{{ if or (eq .Values.global.clusterType "standalone") (eq .Values.global.clusterType "tenant") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syslog-health-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syslog-health-monitor.labels" . | nindent 4 }}
data:
  # This ConfigMap is currently minimal as primary configuration is passed
  # via command-line arguments in the DaemonSet, sourced from values.yaml.
  # It can be extended in the future if needed for more complex configurations
  # or scripts.
  log_check_definitions.yaml: |
    checks:
{{- if .Values.global.kata.enabled }}
      - name: "SysLogsXIDError"
        matches:
          - 'NVRM: Xid'
        count: 0
        ignoreCase: true
        tags:
          - "-u containerd.service"
        journalPath: "/nvsentinel/var/log/journal/"
        boot: false
{{- else }}
      - name: SysLogsXidError
        matches:
          - 'Xid .* waiting for RPC response from GPU'
        count: 0
        ignoreCase: true
        tags: []
        journalPath: "/nvsentinel/var/log/journal/"
        boot: false
        recommended_action: NODE_REBOOT

      - name: "SysLogsGPUMissing"
        matches:
          - 'GPU has fallen off the bus'
        count: 0
        ignoreCase: true
        tags: [] # Assuming empty if not specified
        journalPath: "/nvsentinel/var/log/journal/"
        boot: false
        recommended_action: NODE_REBOOT




{{- end }}

  # XID error mappings (shared with GPU health monitor from main chart)
{{ (.Files.Glob "files/xiderrorsmapping.csv").AsConfig | indent 2 }}

  # Action to platform connector code mapping (shared with GPU health monitor)
{{ (.Files.Glob "files/actionmapping.ini").AsConfig | indent 2 }}

{{ end }}
{{ if or (eq .Values.global.clusterType "standalone") (eq .Values.global.clusterType "tenant") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "syslog-health-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syslog-health-monitor.labels" . | nindent 4 }}

spec:
  updateStrategy:
    type: {{ .Values.updateStrategy }}
    {{- if eq .Values.updateStrategy "RollingUpdate"}}
    rollingUpdate:
      maxUnavailable: {{ .Values.maxUnavailable }}
    {{- end}}
  selector:
    matchLabels:
      {{- include "syslog-health-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "syslog-health-monitor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: syslog-health-monitor
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.syslogHealthMonitor.image.repository }}:{{ .Values.global.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - "--config-file"
            - "/etc/syslog-monitor/log_check_definitions.yaml"
            - "--polling-interval"
            - "{{ .Values.pollingInterval }}"
            - "--state-file"
            - "/var/run/syslog_monitor/state.json"
            - "--metrics-port"
            - "{{ .Values.metricsPort }}"
            - "--platform-connector-endpoint"
            {{- if .Values.global.kata.enabled }}
            # Kata mode: Use TCP connection to Kubernetes service
            - "tcp://{{ .Release.Name }}-platform-connector.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.kata.port.servicePort }}"
            {{- else }}
            # Regular mode: Use UDS socket for platform connector
            - "{{ .Values.global.socketPath | default "unix:///var/run/nvsentinel.sock" }}"
            {{- end }}
            - "--xid-mapping-file"
            - "/etc/syslog-monitor/xiderrorsmapping.csv"
            - "--action-mapping-file"
            - "/etc/syslog-monitor/actionmapping.ini"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          startupProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.metricsPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.metricsPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env: 
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config-volume
              mountPath: /etc/syslog-monitor
              readOnly: true
            - name: var-run-vol
              mountPath: /var/run/
            - name: syslog-state-vol
              mountPath: /var/run/syslog_health_monitor
            {{- if .Values.global.kata.enabled }}
            # Kata mode: Mount systemd journal and TLS certificates
            - name: host-journal
              mountPath: /nvsentinel/var/log/journal
              readOnly: true
            - name: host-systemd
              mountPath: /run/systemd/journal
              readOnly: true
            - name: host-machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: pc-root-ca
              mountPath: /etc/nvsentinel/certs/ca.crt
              readOnly: true
              subPath: ca.crt
            {{- else }}
            # Regular mode: Mount var/log directly
            - name: var-log-vol
              mountPath: /nvsentinel/var/log
              readOnly: true
            {{- end }}
            - name: proc-vol
              mountPath: /nvsentinel/proc
              readOnly: true
            - name: sys-vol
              mountPath: /nvsentinel/sys
              readOnly: true
          
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "syslog-health-monitor.fullname" . }}
        - name: var-run-vol
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
        - name: syslog-state-vol
          hostPath:
            path: /var/run/syslog_health_monitor
            type: DirectoryOrCreate
        {{- if .Values.global.kata.enabled }}
        # Kata mode: Systemd journal volumes and TLS certificates
        - name: host-journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: host-systemd
          hostPath:
            path: /run/systemd/journal
            type: Directory
        - name: host-machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: pc-root-ca
          secret:
            secretName: {{ .Values.global.kata.tls.caSecretName }}
        {{- else }}
        # Regular mode: Direct var/log mount
        - name: var-log-vol
          hostPath:
            path: /var/log
            type: Directory
        {{- end }}
        - name: sys-vol
          hostPath:
            path: /sys
            type: Directory
        - name: proc-vol    
          hostPath:
            path: /proc
            type: Directory

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end }}
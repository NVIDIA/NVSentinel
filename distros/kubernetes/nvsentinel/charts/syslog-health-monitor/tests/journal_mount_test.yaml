suite: journal mount
release:
  namespace: nvsentinel
set:
  global.platformConnectorAuth.enabled: false
tests:
  - it: regular mode mounts journalHostPath at /nvsentinel/var/log by default
    template: templates/daemonset-regular.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: var-log-vol
            hostPath:
              path: /var/log
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: var-log-vol
            mountPath: /nvsentinel/var/log
            readOnly: true

  - it: regular mode keeps a custom journalHostPath at /nvsentinel/var/log
    template: templates/daemonset-regular.yaml
    set:
      journalHostPath: /run/log
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: var-log-vol
            hostPath:
              path: /run/log
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: var-log-vol
            mountPath: /nvsentinel/var/log
            readOnly: true

  - it: regular mode mounts journalDirectoryHostPath where the monitor reads the journal
    template: templates/daemonset-regular.yaml
    set:
      journalHostPath: /ignored
      journalDirectoryHostPath: /var/log/journal
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: var-log-vol
            hostPath:
              path: /var/log/journal
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: var-log-vol
            mountPath: /nvsentinel/var/log/journal
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: var-log-vol
            mountPath: /nvsentinel/var/log
            readOnly: true

  - it: journalDirectoryHostPath is rendered verbatim, not cut at a YAML comment marker
    template: templates/daemonset-regular.yaml
    set:
      journalDirectoryHostPath: "/srv/journal #2"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: var-log-vol
            hostPath:
              path: "/srv/journal #2"
              type: Directory

  - it: kata mode ignores journalDirectoryHostPath
    template: templates/daemonset-kata.yaml
    set:
      journalDirectoryHostPath: /custom/journal
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-journal
            hostPath:
              path: /var/log/journal
              type: Directory
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: var-log-vol
            hostPath:
              path: /custom/journal
              type: Directory

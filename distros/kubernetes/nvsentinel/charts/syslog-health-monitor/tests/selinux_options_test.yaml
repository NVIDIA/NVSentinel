suite: selinux options
release:
  namespace: nvsentinel
templates:
  - templates/daemonset-regular.yaml
  - templates/daemonset-kata.yaml
set:
  global.platformConnectorAuth.enabled: false
tests:
  - it: must not set pod SELinux options by default
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: must set pod SELinux options from global.seLinuxOptions in regular and kata mode
    set:
      global.seLinuxOptions:
        type: spc_t
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seLinuxOptions
          value:
            type: spc_t

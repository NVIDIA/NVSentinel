replicaCount: 1

# Image configuration
image:
  repository: ghcr.io/nvidia/nvsentinel/janitor-provider
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: "janitor-provider"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

service:
  port: 50051

# Metrics Configuration
metrics:
  # TLS configuration for metrics server
  tls:
    # Enable TLS for metrics endpoint
    enabled: false
    # Directory containing metrics server TLS certs
    certDir: "/tmp/k8s-metrics-server/metrics-certs"
    # Cert-manager issuer name (defaults to webhook.certIssuer if not set)
    issuerName: ""
    # Cert-manager issuer kind (Issuer or ClusterIssuer)
    issuerKind: "Issuer"
    # Cert-manager issuer group (optional)
    issuerGroup: ""
    # Certificate duration (default: 90 days)
    duration: "2160h"
    # Certificate renewal time before expiry (default: 30 days)
    renewBefore: "720h"
    # Organization name for certificate subject
    organization: "NVIDIA"

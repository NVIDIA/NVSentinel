# Default values for nvcre-certification-monitor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Replicas are fixed at 1 (no leader election). Log level: debug, info, warn
# or error; anything else falls back to info.
logLevel: info

# Empty tag resolves to global.image.tag, then the chart appVersion.
image:
  repository: ghcr.io/nvidia/nvsentinel/nvcre-certification-monitor
  pullPolicy: IfNotPresent
  tag: ""

# Extra pod annotations. A config checksum is already added, so policy
# changes restart the pod on their own.
podAnnotations: {}

# Sweep interval for listing Certification CRs (Go duration, > 0). There is no
# event trigger, so a terminal Certification is acted on within one interval.
resyncInterval: 15m

# Policies select which Certification failedNode entries trigger health events.
# Each policy's `match` is a CEL expression evaluated against every
# (category, failedNode) entry of a failed Certification. If it evaluates to
# true, an unhealthy health event is published and the (node, variant, reason)
# tuple is tracked in the node annotation
# nvsentinel.dgxc.nvidia.com/nvcre-cert-failures-details.

policies:
  - name: certification-failures
    match: "(failedNode.reason == 'ThresholdViolation') || (failedNode.reason == 'WorkloadFailed')"

# Memory scales with the number of nodes and retained Certifications; raise the
# memory limit first on very large clusters.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# The `socket` volume is required: it is mounted at /var/run so the
# platform-connector socket (global.socketPath) is reachable. Change `path`
# only if platform-connectors uses a different host directory; without it the
# pod logs "Platform connector not ready" and crash-loops.
volumes:
  - name: socket
    hostPath:
      path: /var/run/nvsentinel
      type: DirectoryOrCreate

# Processing strategy for health events
# valid values: EXECUTE_REMEDIATION, STORE_ONLY
# default: EXECUTE_REMEDIATION
# EXECUTE_REMEDIATION: normal behavior; downstream modules may update cluster state.
# STORE_ONLY: observability-only behavior; event should be persisted/exported but should not modify cluster resources (i.e., no node conditions, no quarantine, no drain, no remediation).
# The monitor's own bookkeeping is written in both modes: the Node annotation and label that record held failures, and the
# Certification cert-processed / error-recovered annotations. See docs/configuration/nvcre-certification-monitor.md.
processingStrategy: EXECUTE_REMEDIATION

# Pod priority for this component. Overridden by the matching global when that is set.
priorityClassName: ""

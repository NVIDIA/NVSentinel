{{- /*
The pod device mapper (ADR-072). It writes the dgxc.nvidia.com/devices annotation that partial drains read. It needs
no GPU driver and no vendor settings, so it runs on the pod network without privileges. It runs as root only because
the kubelet's PodResources socket belongs to root.
*/}}
{{- if include "metadata-collector.podMapperEnabled" . }}
{{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
{{- /* The mapper reads its configuration once, at start. */}}
{{- $_ := set $podAnnotations "checksum/config" (((.Values.global | default dict).partialRemediationEntityTypes) | toJson | sha256sum) }}
{{- $image := .Values.podMapper.image | default dict }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "metadata-collector.mapperName" . }}
  labels:
    {{- include "metadata-collector.mapperLabels" . | nindent 4 }}
spec:
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "metadata-collector.mapperSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "metadata-collector.mapperSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "metadata-collector.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pod-device-mapper
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ $image.repository }}:{{ $image.tag | default ((.Values.global).image).tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          args:
            - --config=/etc/config/config.toml
            - --pod-mapper-max-consecutive-failures={{ .Values.podMapper.maxConsecutiveFailures }}
            {{- if include "metadata-collector.metricsEnabled" . }}
            - --metrics-port={{ .Values.global.metricsPort }}
            {{- else }}
            # 0 disables the endpoint. Omitting the flag would leave the binary on its default.
            - --metrics-port=0
            {{- end }}
          {{- if include "metadata-collector.metricsEnabled" . }}
          ports:
            # The PodMonitor of the umbrella chart scrapes a port named "metrics", and its NetworkPolicy allows
            # global.metricsPort.
            - name: metrics
              containerPort: {{ .Values.global.metricsPort }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            - name: KUBELET_HOST
              {{- include "metadata-collector.mapperKubeletHost" . | nindent 14 }}
          resources:
            {{- toYaml (.Values.podMapper.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            - name: config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: pod-resources
          hostPath:
            path: {{ printf "%s/pod-resources" (include "metadata-collector.kubeletRootDir" .) | quote }}
            type: Directory
        - name: config
          configMap:
            name: {{ include "metadata-collector.mapperName" . }}
      {{- /* Merged as maps, so a key set in both appears once, with the value of podMapper.nodeSelector. */}}
      {{- $nodeSelector := merge (deepCopy (.Values.podMapper.nodeSelector | default dict)) ((.Values.global.nodeSelector | default .Values.nodeSelector) | default dict) }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The default affinity of the discovery follows GPU driver upgrades, which the mapper does not need. */}}
      {{- with (.Values.global.affinity | default .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.global.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.global.priorityClassName | default .Values.priorityClassName) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}

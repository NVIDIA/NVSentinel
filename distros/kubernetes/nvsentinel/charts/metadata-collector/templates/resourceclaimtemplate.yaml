{{- if include "metadata-collector.gpuDraEnabled" . }}
{{- /* The API server rejects this template unless the namespace is labelled. lookup is empty under helm template and in unit tests, so this only fires against a live cluster. */}}
{{- with lookup "v1" "Namespace" "" .Release.Namespace }}
{{- if ne (index .metadata.labels "resource.kubernetes.io/admin-access" | default "") "true" }}
{{- fail (printf "global.gpuDraEnabled=true needs namespace %q labelled resource.kubernetes.io/admin-access=true before install or upgrade, or the API server rejects the admin-access GPU claim template: kubectl label namespace %s resource.kubernetes.io/admin-access=true" .metadata.name .metadata.name) }}
{{- end }}
{{- end }}
# Admin-access claim on every GPU of the node, the same pattern GPU Operator uses
# for its own DCGM DaemonSet in GPUCluster mode. The DRA driver injects the driver
# libraries and device nodes through CDI, so no RuntimeClass or host mounts are
# needed. Admin access does not consume the devices. The API server accepts
# this template only in a namespace labelled resource.kubernetes.io/admin-access:
# "true"; that label is an installation prerequisite (see docs).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ include "metadata-collector.fullname" . }}-admin-gpus
  labels:
    {{- include "metadata-collector.labels" . | nindent 4 }}
spec:
  spec:
    devices:
      requests:
        - name: gpus
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: All
            adminAccess: true
{{- end }}

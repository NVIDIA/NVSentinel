image:
  repository: ghcr.io/nvidia/nvsentinel/metadata-collector
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

resources: 
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Runtime class name for the pod. The default "nvidia" is rendered on the
# DaemonSet. Set runtimeClassName: "" to omit the field (CRI-O, and NRI-mode
# clusters with no matching RuntimeClass). In NRI mode, also mount host driver
# libraries via additionalHostVolumes / additionalVolumeMounts (and extraEnv
# if LD_LIBRARY_PATH is needed).
runtimeClassName: "nvidia"

# Extra environment variables for the metadata-collector container (optional).
# extraEnv:
#   - name: LD_LIBRARY_PATH
#     value: /usr/local/nvidia/lib
extraEnv: []

# Additional volume mounts for metadata-collector (optional).
# Use with additionalHostVolumes to mount host driver libraries when
# RuntimeClass-based injection is unavailable (NRI-mode clusters).
# additionalVolumeMounts:
#   - name: nvidia-driver-libs
#     mountPath: /usr/local/nvidia/lib
#     readOnly: true
additionalVolumeMounts: []

# Additional host volumes for metadata-collector (optional).
# additionalHostVolumes:
#   - name: nvidia-driver-libs
#     hostPath:
#       path: /usr/lib/x86_64-linux-gnu   # amd64; use /usr/lib/aarch64-linux-gnu on arm64
#       type: Directory
additionalHostVolumes: []

# Kubelet host used by the pod device mapper. By default, the Downward API
# resolves the node's primary IP, which works whether kubelet binds to
# 0.0.0.0 or to the node IP specifically.
#
# To fall back to the application default (localhost), set:
#   kubeletHost: {}
#
# A static value also works:
#   kubeletHost:
#     value: "10.0.0.1"
kubeletHost:
  valueFrom:
    fieldRef:
      fieldPath: status.hostIP

# Pod priority for this component. Overridden by the matching global when that is set.
priorityClassName: ""

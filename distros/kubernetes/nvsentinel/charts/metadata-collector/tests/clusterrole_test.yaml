suite: clusterrole
templates:
  - templates/clusterrole.yaml
tests:
  - it: must grant fine-grained and legacy kubelet pod access
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/pods
              - nodes/proxy
            verbs:
              - get
  - it: must retain pod patch access
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - patch

suite: discovery serviceaccount
templates:
  - templates/discovery-serviceaccount.yaml
set:
  global.partialRemediationEntityTypes: {}
tests:
  - it: must give the NVIDIA discovery its own ServiceAccount without a token
    asserts:
      - equal:
          path: metadata.name
          value: nvidia-metadata-collector
      - equal:
          path: automountServiceAccountToken
          value: false

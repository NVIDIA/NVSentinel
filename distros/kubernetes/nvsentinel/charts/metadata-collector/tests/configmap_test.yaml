# The umbrella chart sets global.partialRemediationEntityTypes. Rendered on its own, this chart has no
# default, so each test sets it.
suite: pod device mapper configuration
templates:
  - templates/configmap.yaml
  - templates/pod-device-mapper-daemonset.yaml
set:
  global.metadataPath: /var/lib/nvsentinel/gpu_metadata.json
tests:
  - it: fails without global.partialRemediationEntityTypes
    template: templates/configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.partialRemediationEntityTypes is missing. The chart default holds the GPU_UUID entry. An upgrade with --reuse-values keeps the values of the previous chart, which has no such key, so upgrade with --reset-then-reuse-values.
  - it: renders the entity types into config.toml
    template: templates/configmap.yaml
    set:
      global.partialRemediationEntityTypes:
        GPU_UUID:
          devices:
            - resourceNames: ["nvidia.com/gpu"]
            - driver: gpu.nvidia.com
              deviceClasses: ["gpu.nvidia.com"]
              entityValueAttribute: uuid
          scopedActions: ["COMPONENT_RESET"]
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[\[partialRemediationEntityTypes\.GPU_UUID\.devices\]\]'
      - matchRegex:
          path: data["config.toml"]
          pattern: 'entityValueAttribute = .uuid.'
  - it: passes the configuration to the mapper and mounts it
    template: templates/pod-device-mapper-daemonset.yaml
    set:
      global.partialRemediationEntityTypes: {}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config=/etc/config/config.toml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: pod-device-mapper
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
  - it: renders no configuration when the pod device mapper is disabled
    set:
      podMapper.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap.yaml
      - hasDocuments:
          count: 0
        template: templates/pod-device-mapper-daemonset.yaml
  - it: renders no configuration when podMapper.enabled is a quoted "false"
    set:
      podMapper.enabled: "false"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap.yaml

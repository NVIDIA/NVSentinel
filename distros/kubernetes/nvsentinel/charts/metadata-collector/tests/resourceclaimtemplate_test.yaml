suite: resourceclaimtemplate
templates:
  - templates/resourceclaimtemplate.yaml
set:
  global.metadataPath: /var/lib/nvsentinel/gpu_metadata.json
tests:
  - it: must render nothing in clusterpolicy mode
    asserts:
      - hasDocuments:
          count: 0

  - it: must render an admin-access claim on all gpu.nvidia.com devices in gpucluster mode
    capabilities:
      apiVersions:
        - resource.k8s.io/v1
    set:
      global.gpuOperator.mode: gpucluster
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ResourceClaimTemplate
      - equal:
          path: metadata.name
          value: metadata-collector-admin-gpus
      - equal:
          path: spec.spec.devices.requests[0].exactly
          value:
            deviceClassName: gpu.nvidia.com
            allocationMode: All
            adminAccess: true

  - it: must fail in gpucluster mode without the resource.k8s.io/v1 API
    set:
      global.gpuOperator.mode: gpucluster
    asserts:
      - failedTemplate:
          errorPattern: needs the resource.k8s.io/v1 API

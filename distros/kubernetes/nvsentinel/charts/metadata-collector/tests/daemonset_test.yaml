suite: daemonset
templates:
  - templates/daemonset.yaml
set:
  global.metadataPath: /var/lib/nvsentinel/gpu_metadata.json
tests:
  - it: must emit runtimeClassName nvidia by default
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: must omit runtimeClassName when it is empty
    set:
      runtimeClassName: ""
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: must not add extra volumes or env by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 3
      - notExists:
          path: spec.template.spec.resourceClaims
      - notExists:
          path: spec.template.spec.containers[0].resources.claims
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LD_LIBRARY_PATH
          any: true

  - it: must mount pod-resources from the default kubelet root dir
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /var/lib/kubelet/pod-resources
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pod-gpu-resources
            mountPath: /var/lib/kubelet/pod-resources
            readOnly: true

  - it: must mount pod-resources from a relocated kubelet root dir
    set:
      global.kubeletRootDir: /custom/kubelet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /custom/kubelet/pod-resources
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: pod-gpu-resources
            mountPath: /var/lib/kubelet/pod-resources
            readOnly: true

  - it: must strip a trailing slash from global.kubeletRootDir
    set:
      global.kubeletRootDir: /custom/kubelet/
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /custom/kubelet/pod-resources
              type: Directory

  - it: must strip surrounding whitespace from global.kubeletRootDir
    set:
      global.kubeletRootDir: " /custom/kubelet\n"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /custom/kubelet/pod-resources
              type: Directory

  - it: must use the default kubelet root dir when global.kubeletRootDir is null
    set:
      global.kubeletRootDir: null
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /var/lib/kubelet/pod-resources
              type: Directory

  - it: must fail on an invalid global.kubeletRootDir
    set:
      global.kubeletRootDir: custom/kubelet
    asserts:
      - failedTemplate:
          errorPattern: global.kubeletRootDir must be kubelet's --root-dir

  - it: must fail on a global.kubeletRootDir that is only a slash
    set:
      global.kubeletRootDir: /
    asserts:
      - failedTemplate:
          errorPattern: global.kubeletRootDir must be kubelet's --root-dir

  - it: must use the default kubelet root dir when global.kubeletRootDir is empty
    set:
      global.kubeletRootDir: ""
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-gpu-resources
            hostPath:
              path: /var/lib/kubelet/pod-resources
              type: Directory

  - it: must fail on a boolean global.kubeletRootDir
    set:
      global.kubeletRootDir: false
    asserts:
      - failedTemplate:
          errorPattern: global.kubeletRootDir must be kubelet's --root-dir

  - it: must fail on a numeric global.kubeletRootDir
    set:
      global.kubeletRootDir: 0
    asserts:
      - failedTemplate:
          errorPattern: global.kubeletRootDir must be kubelet's --root-dir

  - it: must fail on a global.kubeletRootDir that is the pod-resources directory
    set:
      global.kubeletRootDir: /custom/kubelet/pod-resources/
    asserts:
      - failedTemplate:
          errorPattern: global.kubeletRootDir must be kubelet's --root-dir

  - it: must render additional host volumes, mounts, and extra env
    set:
      runtimeClassName: ""
      extraEnv:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib
      additionalVolumeMounts:
        - name: nvidia-driver-libs
          mountPath: /usr/local/nvidia/lib
          readOnly: true
      additionalHostVolumes:
        - name: nvidia-driver-libs
          hostPath:
            path: /usr/lib/aarch64-linux-gnu
            type: Directory
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia-driver-libs
            mountPath: /usr/local/nvidia/lib
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nvidia-driver-libs
            hostPath:
              path: /usr/lib/aarch64-linux-gnu
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib

  - it: must hold a DRA admin-access claim and omit runtimeClassName in GPUCluster mode
    set:
      global.gpuDraEnabled: true
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - equal:
          path: spec.template.spec.resourceClaims
          value:
            - name: gpus
              resourceClaimTemplateName: metadata-collector-admin-gpus
      - equal:
          path: spec.template.spec.containers[0].resources.claims
          value:
            - name: gpus
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3

  - it: must fail on a quoted global.gpuDraEnabled
    set:
      global.gpuDraEnabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: global.gpuDraEnabled must be a boolean

suite: daemonset
templates:
  - templates/daemonset.yaml
set:
  global.metadataPath: /var/lib/nvsentinel/gpu_metadata.json
tests:
  - it: must emit runtimeClassName nvidia by default
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: must omit runtimeClassName when it is empty
    set:
      runtimeClassName: ""
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: must not add extra volumes or env by default
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 3
      - notExists:
          path: spec.template.spec.resourceClaims
      - notExists:
          path: spec.template.spec.containers[0].resources.claims
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LD_LIBRARY_PATH
          any: true

  - it: must render additional host volumes, mounts, and extra env
    set:
      runtimeClassName: ""
      extraEnv:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib
      additionalVolumeMounts:
        - name: nvidia-driver-libs
          mountPath: /usr/local/nvidia/lib
          readOnly: true
      additionalHostVolumes:
        - name: nvidia-driver-libs
          hostPath:
            path: /usr/lib/aarch64-linux-gnu
            type: Directory
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia-driver-libs
            mountPath: /usr/local/nvidia/lib
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nvidia-driver-libs
            hostPath:
              path: /usr/lib/aarch64-linux-gnu
              type: Directory
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib

  - it: must hold a DRA admin-access claim and omit runtimeClassName in GPUCluster mode
    set:
      global.gpuDraEnabled: true
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - equal:
          path: spec.template.spec.resourceClaims
          value:
            - name: gpus
              resourceClaimTemplateName: metadata-collector-admin-gpus
      - equal:
          path: spec.template.spec.containers[0].resources.claims
          value:
            - name: gpus
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3

  - it: must fail on a quoted global.gpuDraEnabled
    set:
      global.gpuDraEnabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: global.gpuDraEnabled must be a boolean

  - it: must not add the NRI CDI annotation by default
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: must request the management CDI device and omit runtimeClassName in NRI plugin mode
    set:
      nriPlugin.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["nvidia.cdi.k8s.io/container.metadata-collector"]
          value: management.nvidia.com/gpu=all
      - equal:
          path: spec.template.spec.containers[0].name
          value: metadata-collector
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notExists:
          path: spec.template.spec.resourceClaims
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3

  - it: must keep user pod annotations alongside the NRI CDI annotation
    set:
      nriPlugin.enabled: true
      nriPlugin.cdiDevice: management.nvidia.com/gpu=all,k8s.device-plugin.nvidia.com/gpu=GPU-0
      podAnnotations:
        example.com/team: gpu
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/team: gpu
            nvidia.cdi.k8s.io/container.metadata-collector: management.nvidia.com/gpu=all,k8s.device-plugin.nvidia.com/gpu=GPU-0

  - it: must fail on a quoted nriPlugin.enabled
    set:
      nriPlugin.enabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: metadata-collector.nriPlugin.enabled must be a boolean

  - it: must fail when NRI plugin mode is combined with GPUCluster mode
    set:
      nriPlugin.enabled: true
      global.gpuDraEnabled: true
    asserts:
      - failedTemplate:
          errorPattern: mutually exclusive

  - it: must fail when NRI plugin mode has no CDI device
    set:
      nriPlugin.enabled: true
      nriPlugin.cdiDevice: ""
    asserts:
      - failedTemplate:
          errorPattern: metadata-collector.nriPlugin.cdiDevice must be set

{{- if .Values.nodeRecovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "health-events-analyzer.fullname" . }}-node-recovery
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "health-events-analyzer.fullname" . }}-node-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "health-events-analyzer.fullname" . }}-node-recovery
subjects:
  - kind: ServiceAccount
    name: {{ include "health-events-analyzer.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "health-events-analyzer.fullname" . }}-recovery-events
  namespace: default
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "health-events-analyzer.fullname" . }}-recovery-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "health-events-analyzer.fullname" . }}-recovery-events
subjects:
  - kind: ServiceAccount
    name: {{ include "health-events-analyzer.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

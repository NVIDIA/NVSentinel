suite: node annotation recovery permissions
templates:
  - node-recovery-rbac.yaml
tests:
  - it: grants no node permissions by default
    asserts:
      - hasDocuments:
          count: 0
  - it: grants node access and binds the analyzer service account when enabled
    set:
      nodeRecovery.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: rules[0].resources
          value: [nodes]
        documentIndex: 0
      - equal:
          path: rules[0].verbs
          value: [get, list, watch, patch]
        documentIndex: 0
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 1

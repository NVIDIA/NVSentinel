suite: annotation recovery permissions
templates:
  - node-recovery-rbac.yaml
tests:
  - it: grants no recovery access by default
    asserts:
      - hasDocuments:
          count: 0
  - it: reads nodes and creates Events without permission to modify nodes
    set:
      nodeRecovery.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
        documentIndex: 0
      - equal:
          path: rules[0].resources
          value: [nodes]
        documentIndex: 0
      - equal:
          path: rules[0].verbs
          value: [create]
        documentIndex: 2
      - equal:
          path: rules[0].resources
          value: [events]
        documentIndex: 2
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: default
        documentIndex: 3

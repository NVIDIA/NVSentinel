replicaCount: 1

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

resources: 
  limits:
    cpu: "200m"
    memory: "300Mi"
  requests:
    cpu: "200m"
    memory: "300Mi"

image:
  repository: faultremediation
  tag: "v1"

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector:
  nodeGroup: "system-cpu"

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

metricsPort: 2112

clientCertMountPath: "/etc/ssl/mongo-client"

maintenanceResource:
  rebootResource:
    name: rebootnodes
  apiGroup: janitor.dgxc.nvidia.com
  namespace: dgxc-janitor
  version: v1alpha1
  template:
    mountPath: /etc/fault-remediation/templates
    fileName: maintenance-template.yaml
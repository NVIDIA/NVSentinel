# Default values for labeler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

logLevel: info

image:
  repository: ghcr.io/nvidia/nvsentinel/labeler
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

# Kata Containers detection configuration
# Additional node label to check when detecting Kata Containers support. If specified, the labeler
# will check BOTH this custom label AND the default 'katacontainers.io/kata-runtime' label as
# input sources for detection. The labeler will then set the output label 
# 'nvsentinel.dgxc.nvidia.com/kata.enabled' to "true" or "false" based on the detection result.
# Example: 'custom.kata.label' or 'io.katacontainers.config.runtime.oci_runtime'
# Note: The input label value must be truthy (case-insensitive): "true", "enabled", "1", or "yes"
kataLabelOverride: ""

# Pre-installed driver configuration
# When enabled, the labeler unconditionally sets nvsentinel.dgxc.nvidia.com/driver.installed=true
# on all GPU nodes, skipping driver pod detection. Use this for clusters where NVIDIA drivers
# are installed directly on the host rather than via GPU Operator driver containers.
assumeDriverInstalled: false

# DCGM pod discovery
# Comma-separated values of the `app` pod label used to find the DCGM pod on each node.
# The default matches both the classic GPU Operator DCGM DaemonSet (nvidia-dcgm) and the
# GPUCluster/DRA-mode one (nvidia-dcgm-dra).
dcgmAppLabel: "nvidia-dcgm,nvidia-dcgm-dra"

# Driver pod discovery
# Value of the `app` pod label used to find the GPU Operator driver pod on each node.
driverAppLabel: "nvidia-driver-daemonset"

# GKE driver installer discovery
# Value of the `k8s-app` pod label used to find the GKE driver installer pod on each node.
gkeInstallerAppLabel: "nvidia-driver-installer"

# DCGM bootstrap gating
# When enabled, the labeler requires the DCGM pod to be ready before setting the DCGM version
# label during the initial bootstrapping of a node. Once the bootstrap annotation is set, the
# version label will be set without requiring DCGM pod readiness.
requireDCGMReadyForBootstrap: true

# Expected device count labels
# When enabled, the labeler writes current/expected device-count labels per configured class.
# Current counts come from CEL expressions over the node object and associated ResourceSlices.
# Expected counts are learned per grouping partition unless an override matches.
#
# A class defines either a single currentExpression with groupingLabels, or an ordered list of
# sources. For each node, the labeler uses the first source that applies:
#   - A source with resourceSliceDriver applies when the node has ResourceSlices from that driver.
#     Its expressions see only the slices of that driver. An incomplete pool or a failed expression
#     skips the class for this reconcile; the labeler does not try the next source.
#   - A source without resourceSliceDriver applies when its currentExpression returns a count.
# Each source has its own groupingLabels and an optional groupingExpression. The groupingExpression
# returns a list of strings (for example GPU models) that the labeler adds to the partition key.
# All sources of a class must count the same unit, because they write the same labels.
# Overrides must match labels that exist in every mode, such as the instance type or a nodepool label.
expectedDeviceCounts:
  enabled: true
  classes:
    # Counts physical GPUs in both GPU Operator modes: from gpu.nvidia.com ResourceSlices in
    # GPUCluster (DRA) mode, and from the GFD nvidia.com/gpu.count label in ClusterPolicy mode.
    - name: gpu
      enabled: true
      labels:
        current: nvsentinel.dgxc.nvidia.com/gpu.count.current
        expected: nvsentinel.dgxc.nvidia.com/gpu.count.expected
      expectedCountOverrides: []
      sources:
        - name: dra
          resourceSliceDriver: gpu.nvidia.com
          groupingLabels:
            - node.kubernetes.io/instance-type
          currentExpression: |
            sum(resourceSlices
              .filter(rs, has(rs.spec.devices))
              .map(rs, rs.spec.devices
                .filter(d,
                  has(d.attributes) &&
                  'type' in d.attributes &&
                  has(d.attributes['type'].string) &&
                  d.attributes['type'].string == 'gpu'
                )
                .size()
              ))
          groupingExpression: |
            resourceSlices
              .map(rs, has(rs.spec.devices) ? rs.spec.devices : [])
              .flatten()
              .filter(d,
                has(d.attributes) &&
                'type' in d.attributes &&
                has(d.attributes['type'].string) &&
                d.attributes['type'].string == 'gpu' &&
                'productName' in d.attributes &&
                has(d.attributes['productName'].string)
              )
              .map(d, d.attributes['productName'].string)
        - name: gfd
          groupingLabels:
            - node.kubernetes.io/instance-type
            - nvidia.com/gpu.product
          currentExpression: |
            int(node.metadata.labels['nvidia.com/gpu.count'])
    - name: nic
      enabled: true
      labels:
        current: nvsentinel.dgxc.nvidia.com/nic.count.current
        expected: nvsentinel.dgxc.nvidia.com/nic.count.expected
      groupingLabels:
        - node.kubernetes.io/instance-type
      expectedCountOverrides: []
      currentExpression: |
        int(node.status.allocatable['nvidia.com/mlnxnics'])
    # Example AWS RoCE DRA NIC class. Uncomment and adapt per environment.
    # - name: nic
    #   enabled: false
    #   labels:
    #     current: nvsentinel.dgxc.nvidia.com/nic.count.current
    #     expected: nvsentinel.dgxc.nvidia.com/nic.count.expected
    #   groupingLabels:
    #     - node.kubernetes.io/instance-type
    #   expectedCountOverrides: []
    #   currentExpression: |
    #     sum(resourceSlices
    #       .filter(rs,
    #         has(rs.spec.driver) &&
    #         rs.spec.driver == 'dra.networking.k8s.aws' &&
    #         has(rs.spec.devices)
    #       )
    #       .map(rs, rs.spec.devices
    #         .filter(d,
    #           has(d.attributes) &&
    #           'dra.vpc.amazonaws.com/deviceType' in d.attributes &&
    #           has(d.attributes['dra.vpc.amazonaws.com/deviceType'].string) &&
    #           d.attributes['dra.vpc.amazonaws.com/deviceType'].string == 'roce'
    #         )
    #         .size()
    #       ))

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod priority for this component. Overridden by the matching global when that is set.
priorityClassName: ""

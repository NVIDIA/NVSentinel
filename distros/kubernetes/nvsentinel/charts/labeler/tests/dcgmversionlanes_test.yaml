suite: dcgmVersionLanes
templates:
  - templates/deployment.yaml
tests:
  # The labeler parses this JSON at startup, so the default lanes must render as valid JSON
  # with string labels that match the gpu-health-monitor DaemonSet nodeSelectors.
  - it: must pass the default lanes as JSON
    set:
      global.auditLogging.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--dcgm-version-lanes=[{"expression":"version.major == 3","label":"3.x"},{"expression":"version.major == 4 && version.minor < 8","label":"4.x"},{"expression":"version.major > 4 || (version.major == 4 && version.minor >= 8)","label":"48.x"}]'

  # CEL operators must not be HTML-escaped, so that the pod args stay readable.
  - it: must pass custom lanes in order without escaping CEL operators
    set:
      global.auditLogging.enabled: false
      dcgmVersionLanes:
        - label: "49.x"
          expression: "version.major > 4 || (version.major == 4 && version.minor >= 9)"
        - label: "4.x"
          expression: "version.major == 4"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--dcgm-version-lanes=[{"expression":"version.major > 4 || (version.major == 4 && version.minor >= 9)","label":"49.x"},{"expression":"version.major == 4","label":"4.x"}]'

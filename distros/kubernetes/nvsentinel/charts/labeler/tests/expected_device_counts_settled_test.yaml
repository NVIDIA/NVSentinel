suite: expected device count settled expression
templates:
  - templates/configmap.yaml
  - templates/clusterrole.yaml
tests:
  # The labeler reads settledExpression as a key of the class, so it has to come
  # before the class's [classes.labels] table.
  - it: renders the settledExpression of the GPU class by default
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["expected-device-counts.toml"]
          pattern: '\[\[classes\]\]\s+name = "gpu"\s+enabled = true\s+settledExpression = ''{3}\n!\(''nvidia\.com/mig\.config\.state'' in node\.metadata\.labels\) \|\|\nnode\.metadata\.labels\[''nvidia\.com/mig\.config\.state''\] == ''success''\n''{3}\s+\[classes\.labels\]'
      - notMatchRegex:
          path: data["expected-device-counts.toml"]
          pattern: '(?s)settledExpression.*settledExpression'

  - it: renders no settledExpression when it is empty
    template: templates/configmap.yaml
    set:
      expectedDeviceCounts:
        enabled: true
        classes:
          - name: gpu
            enabled: true
            settledExpression: ""
            labels:
              current: nvsentinel.dgxc.nvidia.com/gpu.count.current
              expected: nvsentinel.dgxc.nvidia.com/gpu.count.expected
            sources:
              - name: gfd
                groupingLabels:
                  - node.kubernetes.io/instance-type
                  - nvidia.com/gpu.product
                currentExpression: int(node.metadata.labels['nvidia.com/gpu.count'])
    asserts:
      - notMatchRegex:
          path: data["expected-device-counts.toml"]
          pattern: settledExpression

  - it: renders settledExpression after currentExpression on a class without sources
    template: templates/configmap.yaml
    set:
      expectedDeviceCounts:
        enabled: true
        classes:
          - name: nic
            enabled: true
            settledExpression: "!('example.com/nic.reconfiguring' in node.metadata.labels)"
            labels:
              current: nvsentinel.dgxc.nvidia.com/nic.count.current
              expected: nvsentinel.dgxc.nvidia.com/nic.count.expected
            groupingLabels:
              - node.kubernetes.io/instance-type
            currentExpression: int(node.status.allocatable['nvidia.com/mlnxnics'])
    asserts:
      - matchRegex:
          path: data["expected-device-counts.toml"]
          pattern: 'currentExpression = ''{3}\nint\(node\.status\.allocatable\[''nvidia\.com/mlnxnics''\]\)\n''{3}\nsettledExpression = ''{3}\n!\(''example\.com/nic\.reconfiguring'' in node\.metadata\.labels\)\n''{3}\s+\[classes\.labels\]'

  # The labeler watches ResourceSlices when any expression of a class reads
  # them, settledExpression included, so the ClusterRole has to allow it.
  - it: grants ResourceSlice access when only settledExpression reads ResourceSlices
    template: templates/clusterrole.yaml
    set:
      expectedDeviceCounts:
        enabled: true
        classes:
          - name: nic
            enabled: true
            settledExpression: resourceSlices.size() > 0
            labels:
              current: nvsentinel.dgxc.nvidia.com/nic.count.current
              expected: nvsentinel.dgxc.nvidia.com/nic.count.expected
            groupingLabels:
              - node.kubernetes.io/instance-type
            currentExpression: int(node.status.allocatable['nvidia.com/mlnxnics'])
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceslices
            verbs:
              - get
              - list
              - watch

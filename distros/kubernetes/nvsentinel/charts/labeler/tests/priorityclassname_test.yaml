suite: priorityClassName (control-plane component)
templates:
  - templates/deployment.yaml
tests:
  - it: must not emit priorityClassName when neither global nor local is set
    set:
      global.auditLogging.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: must take global.systemPriorityClassName
    set:
      global.auditLogging.enabled: false
      global.systemPriorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical

  - it: must fall back to the component value when no global is set
    set:
      global.auditLogging.enabled: false
      priorityClassName: labeler-only
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: labeler-only

  - it: must prefer the global over the component value, as systemNodeTolerations does
    set:
      global.auditLogging.enabled: false
      global.systemPriorityClassName: from-global
      priorityClassName: from-local
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: from-global

  # The control-plane components key off global.systemPriorityClassName, never the
  # node-agent value, so setting only the DaemonSet global must not reach them.
  - it: must ignore global.priorityClassName
    set:
      global.auditLogging.enabled: false
      global.priorityClassName: system-node-critical
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

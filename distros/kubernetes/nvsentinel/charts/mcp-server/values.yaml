replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/mcp-server
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# MCP transport listen port. Exposed by the Service.
mcpPort: 8080

# Bearer token Secret. If authToken.secretName is non-empty, the
# referenced Secret must contain a key matching authToken.secretKey
# with the token value. Empty disables authentication on /mcp (only
# appropriate behind a NetworkPolicy that restricts ingress).
authToken:
  secretName: ""
  secretKey: "token"

# MongoDB TLS client certificate mount path. Mirrors event-exporter:
# default points at the in-cluster CA-signed cert; override to "" when
# using a managed MongoDB without client certificates.
mongodbStore:
  clientCertMountPath: /etc/ssl/mongo-client

{{- if or .Values.gangCoordination.enabled (include "preflight.publish.caCopy" .) }}
# The controller needs the API for gang coordination and for copying the
# deployment platform connector's CA bundle into the tenant namespaces. The
# copy needs only namespaces and ConfigMaps; the gang pieces come with gang
# coordination.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "preflight.fullname" . }}
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
rules:
  {{- if .Values.gangCoordination.enabled }}
  # Core resources for gang discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- end }}

  # Namespaces for tracking which are preflight-enabled (ActiveNamespaces)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.gangCoordination.enabled }}

  # ConfigMaps for gang coordination
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Per-namespace preflight configuration (PreflightConfig CRD).
  - apiGroups: ["preflight.nvsentinel.nvidia.com"]
    resources: ["preflightconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["preflight.nvsentinel.nvidia.com"]
    resources: ["preflightconfigs/status"]
    verbs: ["get", "update", "patch"]
  {{- else }}

  # ConfigMaps for the CA bundle copies
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
  {{- end }}
{{- if .Values.gangCoordination.enabled }}
---
# Aggregate ClusterRole for scheduler PodGroup read access. The controller binds
# to this role; built-in scheduler permissions (below) plus any per-scheduler
# add-on ClusterRoles labeled for aggregation are merged in automatically, so a
# new scheduler can be granted access without editing or restarting preflight.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "preflight.fullname" . }}-gang-discovery
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        preflight.nvsentinel.nvidia.com/aggregate-to-gang-discovery: "true"
rules: [] # filled in by the cluster controller-manager via aggregation
---
# Built-in scheduler permissions contributed to the aggregate role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "preflight.fullname" . }}-gang-discovery-builtin
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
    preflight.nvsentinel.nvidia.com/aggregate-to-gang-discovery: "true"
rules:
  # K8s 1.36+ PodGroup API + 1.35 Workload API for native gang scheduling.
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["podgroups", "workloads"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.gangDiscovery.podGroupGVR }}
  # Default PodGroup-based scheduler ({{ .Values.gangDiscovery.name | default "custom" }}).
  - apiGroups: [{{ .Values.gangDiscovery.podGroupGVR.group | quote }}]
    resources: [{{ .Values.gangDiscovery.podGroupGVR.resource | quote }}]
    verbs: ["get", "list", "watch"]
  {{- end }}
{{- end }}

{{- end }}
---
# Read access to DRA claims, so the webhook can tell whether a pod gets its
# GPUs through DRA. Get only: the webhook reads single objects on admission and
# keeps no informer or cache. It reads claims only for pods that have
# spec.resourceClaims, so a cluster without DRA never uses this role. Kept
# outside the condition above, so it does not depend on gang coordination or
# the CA copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "preflight.fullname" . }}-dra
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceclaimtemplates"]
    verbs: ["get"]

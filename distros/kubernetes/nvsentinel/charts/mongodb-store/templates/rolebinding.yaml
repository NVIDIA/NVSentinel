apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Namespace }}-mongodb-rolebinding"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: "{{ .Values.mongodb.serviceAccount.name }}"
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: "{{ .Release.Namespace }}-mongodb-role"
  apiGroup: rbac.authorization.k8s.io

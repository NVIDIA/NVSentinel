apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-job-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-job-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
{{- if and .Values.usePerconaOperator .Values.validateDeployedCrVersion }}
# Paired with the validate-deployed-crversion init container: both appear only
# when that check is enabled, so no install carries the grant without the check.
- apiGroups: ["psmdb.percona.com"]
  resources: ["perconaservermongodbs"]
  verbs: ["list"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-job-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-job-role
subjects:
- kind: ServiceAccount
  name: mongodb-job-sa
  namespace: {{ .Release.Namespace }}
---
{{- $helperImages := .Values.mongodb.helperImages }}
{{- $rootUsername := "root" }}
{{- $issuerSecret := "mongo-root-ca-secret" }}
{{- $passwordSecretName := "mongodb" }}
{{- $passwordSecretKey := "mongodb-root-password" }}
{{- if .Values.usePerconaOperator }}
  {{- $helperImages = .Values.psmdb.helperImages }}
  {{- $rootUsername = "$MONGODB_ROOT_USER" }}
  {{- $issuerSecret = "mongodb-ca-cert" }}
  {{- $passwordSecretName = "internal-mongodb-users" }}
  {{- $passwordSecretKey = "MONGODB_DATABASE_ADMIN_PASSWORD" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Name is create-mongodb-database-<ttl>-<scriptHash>. Label: create-mongodb-database
  name: {{ include "mongodb-store.initJobName" . }}
  labels:
    app.kubernetes.io/name: create-mongodb-database
    app.kubernetes.io/component: mongodb-init
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Argo: recreate this immutable Job on sync if the first run Failed and the
    # name (TTL / oplog / script hash) did not change. Do not add helm.sh/hook.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: mongodb-job-sa
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{- if .Values.usePerconaOperator }}
      # Percona-specific init containers
      # Create MongoDB keyfile and encryption key secrets if they don't exist
      - name: create-mongodb-secrets
        image: "{{ $helperImages.kubectl.repository }}:{{ $helperImages.kubectl.tag }}"
        imagePullPolicy: {{ $helperImages.kubectl.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          
          NAMESPACE="{{ .Release.Namespace }}"
          
          echo "Initializing MongoDB secrets..."
          
          # Create MongoDB keyfile secret
          SECRET_NAME="mongodb-keyfile"
          if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "[INFO] Keyfile secret already exists. Reusing."
          else
            KEYFILE=$(head -c 768 /dev/urandom | base64 | tr -d '\n' | head -c 1024)
            if [ -z "$KEYFILE" ]; then
              echo "[ERROR] Failed to generate keyfile"
              exit 1
            fi
            
            if kubectl create secret generic "$SECRET_NAME" \
              -n "$NAMESPACE" \
              --from-literal=mongodb-key="$KEYFILE" \
              --dry-run=client -o yaml | \
              sed '/^metadata:/a\  annotations:\n    helm.sh/resource-policy: keep' | \
              kubectl apply -f -; then
              echo "[SUCCESS] Keyfile secret created."
            else
              echo "[ERROR] Failed to create keyfile secret"
              exit 1
            fi
          fi
          
          # Create MongoDB encryption key secret
          SECRET_NAME="mongodb-encryption-key"
          if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "[INFO] Encryption key secret already exists. Reusing."
          else
            # Generate 32 bytes and base64 encode (MongoDB accepts base64-encoded 32-byte keys)
            ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
            if [ -z "$ENCRYPTION_KEY" ]; then
              echo "[ERROR] Failed to generate encryption key"
              exit 1
            fi
            
            if kubectl create secret generic "$SECRET_NAME" \
              -n "$NAMESPACE" \
              --from-literal=encryption-key="$ENCRYPTION_KEY" \
              --dry-run=client -o yaml | \
              sed '/^metadata:/a\  annotations:\n    helm.sh/resource-policy: keep' | \
              kubectl apply -f -; then
              echo "[SUCCESS] Encryption key secret created."
            else
              echo "[ERROR] Failed to create encryption key secret"
              exit 1
            fi
          fi
          
          echo "MongoDB secrets initialization completed."
      
      # Check if client cert CA matches current issuer CA, delete secret if mismatched
      - name: validate-client-cert-ca
        image: "{{ $helperImages.kubectl.repository }}:{{ $helperImages.kubectl.tag }}"
        imagePullPolicy: {{ $helperImages.kubectl.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e
          
          NAMESPACE="{{ .Release.Namespace }}"
          CLIENT_CERT_SECRET="{{ include "nvsentinel.certificates.secretName" . }}"
          ISSUER_SECRET="{{ $issuerSecret }}"
          
          echo "Validating client certificate CA..."

          if ! kubectl get secret "$CLIENT_CERT_SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "[INFO] Client cert secret does not exist yet. Skipping validation."
            exit 0
          fi
          
          WAIT_COUNT=0
          MAX_WAIT=60  # Wait up to 5 minutes
          while ! kubectl get secret "$ISSUER_SECRET" -n "$NAMESPACE" >/dev/null 2>&1; do
            WAIT_COUNT=$((WAIT_COUNT + 1))
            if [ $WAIT_COUNT -ge $MAX_WAIT ]; then
              echo "[ERROR] Timeout waiting for issuer CA secret '$ISSUER_SECRET'"
              exit 1
            fi
            [ $((WAIT_COUNT % 12)) -eq 0 ] && echo "[INFO] Waiting for issuer CA secret..."
            sleep 5
          done
          
          # Extract and compare CAs
          CLIENT_CA=$(kubectl get secret "$CLIENT_CERT_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.ca\.crt}' | base64 -d | head -n 20)
          ISSUER_CA=$(kubectl get secret "$ISSUER_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.tls\.crt}' | base64 -d | head -n 20)
          
          if [ -z "$CLIENT_CA" ] || [ -z "$ISSUER_CA" ]; then
            echo "[ERROR] Failed to extract CA certificates"
            exit 1
          fi
          
          if [ "$CLIENT_CA" = "$ISSUER_CA" ]; then
            echo "[INFO] Client cert CA matches issuer CA. No action needed."
          else
            echo "[WARN] Client cert CA mismatch detected!"
            echo "[INFO] Deleting old client cert secret..."
            
            if kubectl delete secret "$CLIENT_CERT_SECRET" -n "$NAMESPACE" --ignore-not-found=true; then
              echo "[SUCCESS] Secret deleted. Cert-manager will reissue with current CA."
            else
              echo "[ERROR] Failed to delete secret"
              exit 1
            fi
          fi
          
          echo "Client cert CA validation completed."
      
      - name: wait-for-mongodb-users
        image: "{{ $helperImages.kubectl.repository }}:{{ $helperImages.kubectl.tag }}"
        imagePullPolicy: {{ $helperImages.kubectl.pullPolicy }}
        command:
        - sh
        - -c
        - |
          echo "Waiting for MongoDB operator-generated users secret..."
          while ! kubectl get secret internal-mongodb-users -n {{ .Release.Namespace }} >/dev/null 2>&1; do
            echo "Secret internal-mongodb-users not found yet, waiting..."
            sleep 5
          done
          echo "MongoDB users secret is available, proceeding..."
{{- if .Values.validateDeployedCrVersion }}

      # The render compares the values with each other. It cannot see the live
      # resource, because lookup returns empty under `helm template` and so is
      # blind for every ArgoCD user. Runs after the users secret exists, which
      # means the operator has already reconciled the CR, so a missing CR here
      # is a real error rather than a first install.
      - name: validate-deployed-crversion
        image: "{{ $helperImages.kubectl.repository }}:{{ $helperImages.kubectl.tag }}"
        imagePullPolicy: {{ $helperImages.kubectl.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -e

          NAMESPACE="{{ .Release.Namespace }}"
          OP_TAG="{{ (index (index .Values "psmdb-operator" | default dict) "image" | default dict).tag | default "" }}"
          DOC="See docs/configuration/mongodb-store.md#percona-versions"

          # Listed rather than fetched by name, so that an empty result means
          # "no resource" instead of "looked under the wrong name". Each line carries
          # the name too, so counting resources does not depend on crVersion being
          # set: a resource with no crVersion must still count as present.
          if ! FOUND=$(kubectl get perconaservermongodbs.psmdb.percona.com -n "$NAMESPACE" \
              -o jsonpath='{range .items[*]}{.metadata.name}={.spec.crVersion}{"\n"}{end}' 2>&1); then
            echo "[ERROR] Could not list PerconaServerMongoDB in '$NAMESPACE':"
            echo "[ERROR] $FOUND"
            exit 1
          fi

          COUNT=$(printf '%s' "$FOUND" | grep -c '=' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "[ERROR] No PerconaServerMongoDB found in '$NAMESPACE'."
            echo "[ERROR] The operator-generated users secret exists, so the resource should too. $DOC"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "[ERROR] Found $COUNT PerconaServerMongoDB resources in '$NAMESPACE'."
            echo "[ERROR] Cannot tell which one belongs to this release, so refusing to guess. $DOC"
            exit 1
          fi
          DEPLOYED=$(printf '%s' "$FOUND" | grep '=' | head -1 | cut -d= -f2-)

          echo "[INFO] chart operator $OP_TAG, deployed crVersion ${DEPLOYED:-<unset>}"

          # Deliberately not anchored at the end: Percona ships pre-release tags
          # such as 1.23.0-rc1, and only major.minor is compared, so the trailing
          # part is irrelevant. Anchoring would skip those instead of checking them.
          is_semver() { echo "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; }
          if ! is_semver "$OP_TAG" || ! is_semver "$DEPLOYED"; then
            echo "[INFO] Not both semver, skipping the comparison."
            exit 0
          fi

          # A leading zero makes POSIX arithmetic read the value as octal, so 010
          # would compare as 8 and 08 would abort the shell. Normalize first.
          strip_zeros() { n=${1#"${1%%[!0]*}"}; echo "${n:-0}"; }
          OP_MAJOR=$(strip_zeros "$(echo "$OP_TAG" | cut -d. -f1)")
          OP_MINOR=$(strip_zeros "$(echo "$OP_TAG" | cut -d. -f2)")
          CR_MAJOR=$(strip_zeros "$(echo "$DEPLOYED" | cut -d. -f1)")
          CR_MINOR=$(strip_zeros "$(echo "$DEPLOYED" | cut -d. -f2)")

          if [ "$OP_MAJOR" -ne "$CR_MAJOR" ]; then
            echo "[ERROR] The operator is $OP_TAG and the deployed crVersion is $DEPLOYED, which differ by a major version."
            echo "[ERROR] Percona permits upgrading only to the nearest major.minor. $DOC"
            exit 1
          fi

          SKEW=$((OP_MINOR - CR_MINOR))
          if [ "$SKEW" -lt 0 ]; then
            echo "[ERROR] The deployed crVersion is $DEPLOYED but the operator is only $OP_TAG."
            echo "[ERROR] The custom resource cannot be ahead of the operator that reconciles it. $DOC"
            exit 1
          fi
          if [ "$SKEW" -gt 1 ]; then
            echo "[ERROR] The operator is $OP_TAG but the deployed crVersion is still $DEPLOYED, $SKEW minor versions behind."
            echo "[ERROR] Percona permits upgrading only to the nearest major.minor, so raise crVersion one"
            echo "[ERROR] minor at a time. Your values may already agree with each other while the live"
            echo "[ERROR] resource was never upgraded, which is what this check exists to catch. $DOC"
            exit 1
          fi

          echo "[INFO] Deployed crVersion is $SKEW minor behind the operator, which Percona permits."
{{- end }}
{{- else }}
      - name: wait-for-mongodb-secret
        image: "{{ $helperImages.kubectl.repository }}:{{ $helperImages.kubectl.tag }}"
        imagePullPolicy: {{ $helperImages.kubectl.pullPolicy }}
        command:
        - sh
        - -c
        - |
          echo "Waiting for MongoDB secret to be available..."
          while ! kubectl get secret mongodb -n {{ .Release.Namespace }} >/dev/null 2>&1; do
            echo "Secret mongodb not found yet, waiting..."
            sleep 5
          done
          echo "Secret mongodb is available, proceeding..."
{{- end }}
      containers:
      - name: mongo-client
        image: "{{ $helperImages.mongosh.repository }}:{{ $helperImages.mongosh.tag }}"
        imagePullPolicy: {{ $helperImages.mongosh.pullPolicy }}
        command:
          - sh
          - -c
          - |
            set -e

            echo "=============================="
            echo "Starting mongodb client job..."
            echo "=============================="

            echo "MONGODB_URI: $MONGODB_URI"
            echo "MONGODB_APPLICATION_USER_DN: $MONGODB_APPLICATION_USER_DN"
            echo "MONGODB_DATABASE_NAME: $MONGODB_DATABASE_NAME"
            echo "MONGODB_COLLECTION_NAME: $MONGODB_COLLECTION_NAME"
            echo "MONGODB_TOKEN_COLLECTION_NAME: $MONGODB_TOKEN_COLLECTION_NAME"
            echo "MONGODB_OPLOG_SIZE_MB: $MONGODB_OPLOG_SIZE_MB"

            {{- if .Values.mongodb.tls.enabled }}
            cat /certs/tls.crt /certs/tls.key > /tmp/tls.pem
            {{- end }}

            echo "=============================="
            echo "Connecting to mongodb..."
            echo "=============================="

            until mongosh "$MONGODB_URI" \
              {{- if .Values.mongodb.auth.enabled }}
              --authenticationMechanism SCRAM-SHA-256 \
              --username {{ $rootUsername }} --password "$MONGODB_ROOT_PASSWORD" --authenticationDatabase admin \
              {{- end }}
              {{- if .Values.mongodb.tls.enabled }}
              --tls \
              --tlsCAFile /certs/ca.crt \
              --tlsCertificateKeyFile /tmp/tls.pem \
              {{- end }}
              --eval "
{{ include "mongodb-store.initEval" . | indent 18 }}
              "
            do
              echo "Waiting for mongodb to be ready...";
              sleep 5;
            done

            echo "=============================="
            echo "Resizing oplog on each replica..."
            echo "=============================="

            # replSetResizeOplog is per-member; replica-set URI would only hit primary.
            # Percona databaseAdmin cannot run this; clusterAdmin can. Bitnami uses root.
            # Bound retries so a down member cannot eat the 600s deadline (TTL still
            # applies). Skip at most one unreachable member; never shrink unless
            # MONGODB_OPLOG_ALLOW_SHRINK=true (see oplogEval).
{{- if eq (include "mongodb-store.oplogResizeEnabled" . | trim) "true" }}
            skipped=0
            member_count=0
            for host in {{ include "mongodb-store.oplogMemberHosts" . }}; do
              member_count=$((member_count + 1))
              echo "Oplog resize: $host -> ${MONGODB_OPLOG_SIZE_MB} MB"
              ok=0
              tries=0
              max_tries=12
              while [ "$tries" -lt "$max_tries" ]; do
                tries=$((tries + 1))
                if mongosh "mongodb://${host}:27017/?directConnection=true" \
                  {{- if .Values.mongodb.auth.enabled }}
                  --authenticationMechanism SCRAM-SHA-256 \
                  {{- if .Values.usePerconaOperator }}
                  --username "$MONGODB_CLUSTER_ADMIN_USER" --password "$MONGODB_CLUSTER_ADMIN_PASSWORD" --authenticationDatabase admin \
                  {{- else }}
                  --username {{ $rootUsername }} --password "$MONGODB_ROOT_PASSWORD" --authenticationDatabase admin \
                  {{- end }}
                  {{- end }}
                  {{- if .Values.mongodb.tls.enabled }}
                  --tls \
                  --tlsCAFile /certs/ca.crt \
                  --tlsCertificateKeyFile /tmp/tls.pem \
                  {{- end }}
                  --eval "
{{ include "mongodb-store.oplogEval" . | indent 18 }}
                  "
                then
                  ok=1
                  break
                fi
                echo "Waiting for mongodb member $host (try ${tries}/${max_tries})..."
                sleep 5
              done
              if [ "$ok" -ne 1 ]; then
                echo "WARN: skip oplog resize on unreachable $host after ${max_tries} tries"
                skipped=$((skipped + 1))
              fi
            done
            if [ "$skipped" -ge "$member_count" ] || [ "$skipped" -gt 1 ]; then
              echo "ERROR: oplog resize skipped on ${skipped}/${member_count} members"
              exit 1
            fi
{{- else }}
            echo "Skip oplog resize: data volume is not a PVC (emptyDir/hostPath or persistence.enabled=false)."
{{- end }}

            echo "=============================="
            echo "mongodb user creation completed."
            echo "=============================="
        env:
{{- if .Values.usePerconaOperator }}
          - name: MONGODB_CLUSTER_MONITOR_USER
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_CLUSTER_MONITOR_USER
          - name: MONGODB_CLUSTER_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_CLUSTER_ADMIN_USER
          - name: MONGODB_CLUSTER_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_CLUSTER_ADMIN_PASSWORD
          - name: MONGODB_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: internal-mongodb-users
                key: MONGODB_DATABASE_ADMIN_USER
{{- end }}
          - name: MONGODB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $passwordSecretName }}
                key: {{ $passwordSecretKey }}
          - name: MONGODB_APPLICATION_USER_DN
            value: "CN=mongo-user-client,OU=DGXC,O=Nvidia,L=SantaClara,ST=California,C=US"
          - name: MONGODB_DGXCOPS_USER_DN
            value: "CN=mongo-dgxcops-client,OU=DGXC,O=Nvidia,L=SantaClara,ST=California,C=US"
          {{- if not .Values.mongodb.tls.enabled }}
          - name: MONGODB_SCRAM_APP_USERNAME
            value: {{ .Values.scramAppUser.username | default "nvsentinel" | quote }}
          - name: MONGODB_SCRAM_APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.scramAppUser.existingSecret | default $passwordSecretName }}
                key: {{ .Values.scramAppUser.passwordKey | default "mongodb-app-password" }}
                optional: true
          {{- end }}
        envFrom:
          - configMapRef:
              name: mongodb-config
        {{- if .Values.mongodb.tls.enabled }}
        volumeMounts:
          - name: mongo-certificates
            mountPath: /certs
            readOnly: true
        {{- end }}
      {{- if .Values.mongodb.tls.enabled }}
      volumes:
        - name: mongo-certificates
          secret:
            secretName: {{ include "nvsentinel.certificates.secretName" . }}
            {{- include "nvsentinel.certificates.volumeItems" . | nindent 12 }}
      {{- end }}
      # Job scheduling configuration with backward-compatible fallback
      # Prefers: job.nodeSelector -> Falls back to: mongodb.nodeSelector
      {{- $jobNodeSelector := .Values.mongodb.nodeSelector }}
      {{- if .Values.job }}
        {{- $jobNodeSelector = .Values.job.nodeSelector | default .Values.mongodb.nodeSelector }}
      {{- end }}
      {{- with $jobNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Prefers: job.tolerations -> Falls back to: mongodb.jobTolerations
      {{- $jobTolerations := .Values.mongodb.jobTolerations }}
      {{- if .Values.job }}
        {{- $jobTolerations = .Values.job.tolerations | default .Values.mongodb.jobTolerations }}
      {{- end }}
      {{- with $jobTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
      restartPolicy: OnFailure

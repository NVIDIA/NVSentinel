{{ $replset.hidden.env | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.envFrom }}
      envFrom:
{{ $replset.hidden.envFrom | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.nodeSelector }}
      nodeSelector:
{{ $replset.hidden.nodeSelector | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.tolerations }}
      tolerations:
{{ $replset.hidden.tolerations | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.podDisruptionBudget }}
      podDisruptionBudget:
        {{- if $replset.hidden.podDisruptionBudget.maxUnavailable }}
        maxUnavailable: {{ $replset.hidden.podDisruptionBudget.maxUnavailable }}
        {{- else }}
        minAvailable: {{ $replset.hidden.podDisruptionBudget.minAvailable }}
        {{- end }}
      {{- end }}
      {{- if $replset.hidden.resources }}
      resources:
{{ $replset.hidden.resources | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.volumeSpec }}
      volumeSpec:
        {{- if $replset.hidden.volumeSpec.hostPath }}
        hostPath:
          path: {{ $replset.hidden.volumeSpec.hostPath.path }}
          {{- if $replset.hidden.volumeSpec.hostPath.type }}
          type: {{ $replset.hidden.volumeSpec.hostPath.type }}
          {{- else }}
          type: Directory
          {{- end }}
        {{- else if $replset.hidden.volumeSpec.pvc }}
        persistentVolumeClaim:
{{ $replset.hidden.volumeSpec.pvc | toYaml | indent 10 }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if $replset.nonvoting }}
    nonvoting:
      enabled: {{ $replset.nonvoting.enabled }}
      size: {{ $replset.nonvoting.size }}
      {{- if $replset.nonvoting.configuration }}
      configuration: |
{{ tpl $replset.nonvoting.configuration $ | trimSuffix "\n" | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.hookScript }}
      hookScript:
        {{- if $replset.nonvoting.hookScript.configMapRef }}
        configMapRef:
          {{- if $replset.nonvoting.hookScript.configMapRef.name }}
          name: {{ $replset.nonvoting.hookScript.configMapRef.name }}
          {{- end }}
        {{- end }}
        {{- if $replset.nonvoting.hookScript.script }}
        script: |
{{ $replset.nonvoting.hookScript.script | indent 10 }}
        {{- end }}
      {{- end }}
      {{- if $replset.nonvoting.serviceAccountName }}
      serviceAccountName: {{ $replset.nonvoting.serviceAccountName }}
      {{- end }}
      affinity:
      {{- if $replset.nonvoting.affinity }}
{{ $replset.nonvoting.affinity | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.priorityClass }}
      priorityClassName: {{ $replset.nonvoting.priorityClass }}
      {{- end }}
      {{- if $replset.nonvoting.annotations }}
      annotations:
{{ $replset.nonvoting.annotations | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.labels }}
      labels:
{{ $replset.nonvoting.labels | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.podSecurityContext }}
      podSecurityContext:
{{ $replset.nonvoting.podSecurityContext | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.containerSecurityContext }}
      containerSecurityContext:
{{ $replset.nonvoting.containerSecurityContext | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.env }}
      env:
{{ $replset.nonvoting.env | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.envFrom }}
      envFrom:
{{ $replset.nonvoting.envFrom | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.nodeSelector }}
      nodeSelector:
{{ $replset.nonvoting.nodeSelector | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.tolerations }}
      tolerations:
{{ $replset.nonvoting.tolerations | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.podDisruptionBudget }}
      podDisruptionBudget:
        {{- if $replset.nonvoting.podDisruptionBudget.maxUnavailable }}
        maxUnavailable: {{ $replset.nonvoting.podDisruptionBudget.maxUnavailable }}
        {{- else }}
        minAvailable: {{ $replset.nonvoting.podDisruptionBudget.minAvailable }}
        {{- end }}
      {{- end }}
      {{- if $replset.nonvoting.resources }}
      resources:
{{ $replset.nonvoting.resources | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.nonvoting.volumeSpec }}
      volumeSpec:
        {{- if $replset.nonvoting.volumeSpec.hostPath }}
        hostPath:
          path: {{ $replset.nonvoting.volumeSpec.hostPath.path }}
          {{- if $replset.nonvoting.volumeSpec.hostPath.type }}

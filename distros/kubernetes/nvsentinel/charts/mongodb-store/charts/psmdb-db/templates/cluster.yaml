apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  {{- if .Values.annotations }}
  annotations:
{{ .Values.annotations | toYaml | indent 4 }}
  {{- end }}
  name: {{ include "psmdb-database.fullname" . }}
  namespace: {{ include "psmdb-database.namespace" . }}
  labels:
{{ include "psmdb-database.labels" . | indent 4 }}
  {{- /* NVSentinel local patch (PR #1230), not present upstream: keep this guard when
         re-vendoring the chart. We set `finalizers: []`, which renders an empty list that
         the apiserver strips, leaving the PerconaServerMongoDB CR perpetually OutOfSync in
         ArgoCD. Setting `finalizers: null` instead is not a safe substitute: on Helm 3.16
         (bundled with ArgoCD 2.14) it silently restores Percona's default finalizer. */}}
  {{- if .Values.finalizers }}
  finalizers:
{{ .Values.finalizers | toYaml | indent 4 }}
  {{- end }}
spec:
  crVersion: {{ .Values.crVersion }}
  pause: {{ .Values.pause }}
  unmanaged: {{ .Values.unmanaged }}
  {{- if .Values.platform }}
  platform: {{ .Values.platform }}
  {{- end }}
  {{- if .Values.vault }}
  vault:
    {{- if .Values.vault.endpointURL }}
    endpointURL: {{ .Values.vault.endpointURL }}
    {{- end }}
    {{- if .Values.vault.tlsSecret }}
    tlsSecret: {{ .Values.vault.tlsSecret }}
    {{- end }}
    {{- if .Values.vault.syncUsers }}
    syncUsers:
      {{- if .Values.vault.syncUsers.role }}
      role: {{ .Values.vault.syncUsers.role }}
      {{- end }}
      {{- if .Values.vault.syncUsers.mountPath }}
      mountPath: {{ .Values.vault.syncUsers.mountPath }}
      {{- end }}
      {{- if .Values.vault.syncUsers.keyPath }}
      keyPath: {{ .Values.vault.syncUsers.keyPath }}
      {{- end }}
      {{- if .Values.vault.syncUsers.tokenSecret }}
      tokenSecret: {{ .Values.vault.syncUsers.tokenSecret }}
      {{- end }}
    {{- end }}
  {{- end }}
  enableVolumeExpansion: {{ .Values.enableVolumeExpansion }}
  {{- if hasKey .Values "enableExternalVolumeAutoscaling" }}
  enableExternalVolumeAutoscaling: {{ .Values.enableExternalVolumeAutoscaling }}
  {{- end }}
  {{- if .Values.defaultRWConcern }}
  defaultRWConcern:
    {{- if .Values.defaultRWConcern.readConcern }}
    readConcern: {{ .Values.defaultRWConcern.readConcern }}
    {{- end }}
    {{- with .Values.defaultRWConcern.writeConcern }}
    writeConcern:
      {{- if .w }}
      w: {{ .w | quote }}
      {{- end }}
      {{- if hasKey . "wtimeout" }}
      wtimeout: {{ .wtimeout }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.clusterServiceDNSSuffix }}
  clusterServiceDNSSuffix: {{ .Values.clusterServiceDNSSuffix }}
  {{- end }}
  {{- if .Values.clusterServiceDNSMode }}
  clusterServiceDNSMode: {{ .Values.clusterServiceDNSMode }}
  {{- end }}
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  imagePullPolicy: "{{ .Values.imagePullPolicy }}"
  {{- if .Values.unsafeFlags }}
  unsafeFlags:
{{ .Values.unsafeFlags | toYaml | indent 4 }}
  {{- end }}
  {{- if .Values.ignoreAnnotations }}
  ignoreAnnotations:
{{ .Values.ignoreAnnotations | toYaml | indent 4 }}
  {{- end }}
  {{- if .Values.ignoreLabels }}
  ignoreLabels:
{{ .Values.ignoreLabels | toYaml | indent 4 }}
  {{- end }}
  multiCluster:
    enabled: {{ .Values.multiCluster.enabled }}
    {{- if .Values.multiCluster.DNSSuffix }}
    DNSSuffix: {{ .Values.multiCluster.DNSSuffix }}
    {{- end }}
  {{- if .Values.imagePullSecrets }}
  imagePullSecrets:
{{ .Values.imagePullSecrets | toYaml | indent 4 }}
  {{- end }}
  {{- if .Values.initImage }}
  initImage: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
  {{- end }}
  {{- if .Values.initContainerSecurityContext }}
  initContainerSecurityContext:
{{ .Values.initContainerSecurityContext | toYaml | indent 4 }}
  {{- end }}
  {{- if .Values.tls }}
  tls:
{{ .Values.tls | toYaml | indent 4 }}
  {{- end }}
  {{- if .Values.secrets }}
  secrets:
{{ tpl (.Values.secrets | toYaml) . | indent 4 }}
  {{- else }}
  secrets:
    users: {{ include "psmdb-database.fullname" . }}-secrets
  {{- end }}
  {{- if .Values.updateStrategy }}
  updateStrategy: {{ .Values.updateStrategy }}
  upgradeOptions:
    versionServiceEndpoint: {{ .Values.upgradeOptions.versionServiceEndpoint }}
    apply: {{ .Values.upgradeOptions.apply }}
    schedule: {{ .Values.upgradeOptions.schedule }}
    setFCV: {{ .Values.upgradeOptions.setFCV }}
  {{- end }}
  {{- if .Values.storageScaling }}
  storageScaling:
    {{- if hasKey .Values.storageScaling "enableVolumeScaling" }}
    enableVolumeScaling: {{ .Values.storageScaling.enableVolumeScaling }}
    {{- end }}
    {{- if hasKey .Values.storageScaling "enableExternalAutoscaling" }}
    enableExternalAutoscaling: {{ .Values.storageScaling.enableExternalAutoscaling }}
    {{- end }}
    {{- if .Values.storageScaling.autoscaling }}
    autoscaling:
      enabled: {{ .Values.storageScaling.autoscaling.enabled }}
      {{- if .Values.storageScaling.autoscaling.triggerThresholdPercent }}
      triggerThresholdPercent: {{ .Values.storageScaling.autoscaling.triggerThresholdPercent }}
      {{- end }}
      {{- if .Values.storageScaling.autoscaling.growthStep }}
      growthStep: {{ .Values.storageScaling.autoscaling.growthStep }}
      {{- end }}
      {{- if .Values.storageScaling.autoscaling.maxSize }}
      maxSize: {{ .Values.storageScaling.autoscaling.maxSize }}
      {{- end }}
    {{- end }}
  {{- end }}
  pmm:
    enabled: {{ .Values.pmm.enabled }}
    image: "{{ .Values.pmm.image.repository }}:{{ .Values.pmm.image.tag }}"
    serverHost: {{ .Values.pmm.serverHost }}
    {{- if .Values.pmm.mongodParams }}
    mongodParams: {{ tpl .Values.pmm.mongodParams $ }}
    {{- end }}
    {{- if .Values.pmm.mongosParams }}
    mongosParams: {{ tpl .Values.pmm.mongosParams $ }}
    {{- end }}
    {{- if .Values.pmm.resources }}
    resources:
{{ .Values.pmm.resources | toYaml | indent 6 }}
    {{- end }}
    {{- if .Values.pmm.containerSecurityContext }}
    containerSecurityContext:
{{ .Values.pmm.containerSecurityContext | toYaml | indent 6 }}
    {{- end }}
    {{- if .Values.pmm.customClusterName }}
    customClusterName: {{ .Values.pmm.customClusterName }}
    {{- end }}
    {{- if .Values.pmm.authenticationMechanism }}
    authenticationMechanism: {{ .Values.pmm.authenticationMechanism }}
    {{- end }}
    {{- if .Values.pmm.livenessProbe }}
    livenessProbe:
{{ .Values.pmm.livenessProbe | toYaml | indent 6 }}
    {{- end }}
    {{- if .Values.pmm.readinessProbe }}
    readinessProbe:
{{ .Values.pmm.readinessProbe | toYaml | indent 6 }}
    {{- end }}

  replsets:
  {{- range $k,$replset := .Values.replsets }}
  {{- if $replset.name }}
  - name: {{ $replset.name }}
  {{- else }}
  - name: {{ $k }}
  {{- end }}
    size: {{ $replset.size }}
    {{- if $replset.terminationGracePeriodSeconds }}
    terminationGracePeriodSeconds: {{ $replset.terminationGracePeriodSeconds }}
    {{- end }}
    {{- if $replset.externalNodes }}
    externalNodes:
{{ $replset.externalNodes | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.configuration }}
    configuration: |
{{ tpl $replset.configuration $ | trimSuffix "\n" | indent 6 }}
    {{- end }}
    {{- if $replset.hookScript }}
    hookScript:
      {{- if $replset.hookScript.configMapRef }}
      configMapRef:
        {{- if $replset.hookScript.configMapRef.name }}
        name: {{ $replset.hookScript.configMapRef.name }}
        {{- end }}
      {{- end }}
      {{- if $replset.hookScript.script }}
      script: |
{{ $replset.hookScript.script | indent 8 }}
      {{- end }}
    {{- end }}
    {{- if $replset.topologySpreadConstraints }}
    topologySpreadConstraints:
{{ $replset.topologySpreadConstraints | toYaml | indent 6 }}
    {{- end }}
{{- if $replset.replsetOverrides }}
    replsetOverrides:
{{ $replset.replsetOverrides | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.serviceAccountName }}
    serviceAccountName: {{ $replset.serviceAccountName }}
    {{- end }}
    {{- if $replset.affinity }}
    affinity:
{{ $replset.affinity | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.priorityClass }}
    priorityClassName: {{ $replset.priorityClass }}
    {{- end }}
    {{- if $replset.primaryPreferTagSelector }}
    primaryPreferTagSelector:
{{ $replset.primaryPreferTagSelector | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.annotations }}
    annotations:
{{ $replset.annotations | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.labels }}
    labels:
{{ $replset.labels | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.nodeSelector }}
    nodeSelector:
{{ $replset.nodeSelector | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.tolerations }}
    tolerations:
{{ $replset.tolerations | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.livenessProbe }}
    livenessProbe:
{{ $replset.livenessProbe | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.readinessProbe }}
    readinessProbe:
{{ $replset.readinessProbe | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.storage }}
    storage:
{{ $replset.storage | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.podSecurityContext }}
    podSecurityContext:
{{ $replset.podSecurityContext | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.containerSecurityContext }}
    containerSecurityContext:
{{ $replset.containerSecurityContext | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.env }}
    env:
{{ $replset.env | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.envFrom }}
    envFrom:
{{ $replset.envFrom | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.runtimeClass }}
    runtimeClassName: {{ $replset.runtimeClass }}
    {{- end }}
    {{- if $replset.sidecars }}
    sidecars:
{{ $replset.sidecars | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.sidecarVolumes }}
    sidecarVolumes:
{{ $replset.sidecarVolumes | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.sidecarPVCs }}
    sidecarPVCs:
{{ $replset.sidecarPVCs | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.podDisruptionBudget }}
    podDisruptionBudget:
      {{- if $replset.podDisruptionBudget.maxUnavailable }}
      maxUnavailable: {{ $replset.podDisruptionBudget.maxUnavailable }}
      {{- else }}
      minAvailable: {{ $replset.podDisruptionBudget.minAvailable }}
      {{- end }}
    {{- end }}
    {{- if $replset.splitHorizons }}
    splitHorizons:
{{ $replset.splitHorizons | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.expose }}
    expose:
      enabled: {{ $replset.expose.enabled }}
      type: {{ $replset.expose.type }}
      {{- if $replset.expose.loadBalancerClass }}
      loadBalancerClass: {{ $replset.expose.loadBalancerClass }}
      {{- end }}
      {{- if $replset.expose.loadBalancerIP }}
      loadBalancerIP: {{ $replset.expose.loadBalancerIP }}
      {{- end }}
      {{- if $replset.expose.loadBalancerSourceRanges }}
      loadBalancerSourceRanges:
{{ $replset.expose.loadBalancerSourceRanges | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.expose.annotations }}
      annotations:
{{ $replset.expose.annotations | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.expose.labels }}
      labels:
{{ $replset.expose.labels | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.expose.internalTrafficPolicy }}
      internalTrafficPolicy: {{ $replset.expose.internalTrafficPolicy }}
      {{- end }}
      {{- if $replset.expose.externalTrafficPolicy }}
      externalTrafficPolicy: {{ $replset.expose.externalTrafficPolicy }}
      {{- end }}
    {{- end }}
    {{- if $replset.schedulerName }}
    schedulerName: {{ $replset.schedulerName }}
    {{- end }}
    resources:
    {{- if $replset.resources }}
{{ $replset.resources | toYaml | indent 6 }}
    {{- end }}
    volumeSpec:
    {{- if $replset.volumeSpec }}
      {{- if $replset.volumeSpec.hostPath }}
      hostPath:
        path: {{ $replset.volumeSpec.hostPath.path }}
        {{- if $replset.volumeSpec.hostPath.type }}
        type: {{ $replset.volumeSpec.hostPath.type }}
        {{- else }}
        type: Directory
        {{- end }}
      {{- else if $replset.volumeSpec.pvc }}
      persistentVolumeClaim:
{{ $replset.volumeSpec.pvc | toYaml | indent 8 }}
      {{- else }}
      emptyDir: {}
      {{- end }}
    {{- end }}
    {{- if $replset.hostAliases }}
    hostAliases:
{{ $replset.hostAliases | toYaml | indent 6 }}
    {{- end }}
    {{- if $replset.search }}
    search:
{{ $replset.search | toYaml | indent 6 }}
    {{- end }}

{{- if $replset.hidden }}
    hidden:
      enabled: {{ $replset.hidden.enabled }}
      size: {{ $replset.hidden.size }}
      {{- if $replset.hidden.configuration }}
      configuration: |
{{ tpl $replset.hidden.configuration $ | trimSuffix "\n" | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.serviceAccountName }}
      serviceAccountName: {{ $replset.hidden.serviceAccountName }}
      {{- end }}
      {{- if $replset.hidden.hookScript }}
      hookScript:
        {{- if $replset.hidden.hookScript.configMapRef }}
        configMapRef:
          {{- if $replset.hidden.hookScript.configMapRef.name }}
          name: {{ $replset.hidden.hookScript.configMapRef.name }}
          {{- end }}
        {{- end }}
        {{- if $replset.hidden.hookScript.script }}
        script: |
{{ $replset.hidden.hookScript.script | indent 10 }}
        {{- end }}
      {{- end }}
      affinity:
      {{- if $replset.hidden.affinity }}
{{ $replset.hidden.affinity | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.priorityClassName }}
      priorityClassName: {{ $replset.hidden.priorityClassName }}
      {{- end }}
      {{- if $replset.hidden.annotations }}

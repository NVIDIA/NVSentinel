{{ $replset.hidden.labels | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.hidden.podSecurityContext }}
      podSecurityContext:
{{ $replset.hidden.podSecurityContext | toYaml | indent 8 }}

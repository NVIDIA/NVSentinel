{{ $replset.arbiter.annotations | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.arbiter.labels }}
      labels:
{{ $replset.arbiter.labels | toYaml | indent 8 }}
      {{- end }}
      {{- if $replset.arbiter.nodeSelector }}

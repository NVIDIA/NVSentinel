mongodb:
  global:
    imagePullSecrets:
      - nvidia-ngcuser-pull-secret
  image:
    registry: nvcr.io
    repository: nv-ngc-devops/bitnami-mongodb
    tag: 8.0.3-debian-12-r0
    pullPolicy: IfNotPresent

  architecture: replicaset
  replicaCount: 3

  serviceAccount: 
    name: "mongodb-sa"

  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Delete
    whenScaled: Delete

  auth:
    enabled: true
    rootUser: root

  tls:
    enabled: true
    mTLS:
      enabled: true
    mode: requireTLS
    autoGenerated: false
    existingSecret: "mongo-ca-secret"
    replicaset:
      existingSecrets:
        - "mongo-server-cert-0"
        - "mongo-server-cert-1"
        - "mongo-server-cert-2"
    arbiter:
      existingSecret: "mongo-arbiter-cert-secret"
    
    image:
      registry: nvcr.io
      repository: nv-ngc-devops/bitnami-nginx
      tag: 1.27.2-debian-12-r2
      pullPolicy: IfNotPresent

  replicaSetHostnames: true

  extraFlags:
    - "--setParameter"
    - "authenticationMechanisms=MONGODB-X509,SCRAM-SHA-256"

  nodeSelector:
    nodeGroup: "system-cpu"

  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists

  arbiter:
    automountServiceAccountToken: true

    initContainers:
        - name: create-certmanager-resources
          image: nvcr.io/nv-ngc-devops/bitnami-kubectl:1.30.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for CA certificate to be ready..."
              kubectl wait --for=condition=Ready certificate/mongo-root-ca -n {{ .Release.Namespace }} --timeout=300s

              echo "extracting CA certificate and key..."
              kubectl get secret mongo-root-ca-secret -n {{ .Release.Namespace }} -o jsonpath="{.data.tls\.crt}" | base64 -d > /tmp/mongodb-ca-cert
              kubectl get secret mongo-root-ca-secret -n {{ .Release.Namespace }} -o jsonpath="{.data.tls\.key}" | base64 -d > /tmp/mongodb-ca-key

              echo "creating mongo-ca-secret..."
              kubectl create secret generic mongo-ca-secret -n {{ .Release.Namespace }} \
                --from-file=mongodb-ca-cert=/tmp/mongodb-ca-cert \
                --from-file=mongodb-ca-key=/tmp/mongodb-ca-key \
                --dry-run=client -o yaml | kubectl apply -f -
              
              echo "waiting for mongo client cert to be ready..."
              kubectl wait --for=condition=Ready certificate/mongo-app-client-cert -n {{ .Release.Namespace }} --timeout=300s

              echo "=============================="
              echo "cert-manager resources creation completed."
              echo "=============================="

    extraFlags:
      - "--setParameter"
      - "authenticationMechanisms=MONGODB-X509,SCRAM-SHA-256"

    nodeSelector:
      nodeGroup: "system-cpu"

    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
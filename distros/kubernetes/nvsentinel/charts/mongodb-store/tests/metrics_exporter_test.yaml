suite: mongodb metrics exporter
templates:
  - charts/mongodb/templates/replicaset/statefulset.yaml
  - charts/psmdb-db/templates/cluster.yaml
release:
  name: nvsentinel
  namespace: othns
tests:
  - it: connects the exporter to the member in the release namespace with TLS
    template: charts/mongodb/templates/replicaset/statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '@\$\{HOSTNAME\}\.mongodb-headless\.othns\.svc\.cluster\.local:27017/admin\?tls=true'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '\.nvsentinel\.svc'

  - it: connects the exporter to the member in the release namespace without TLS
    template: charts/mongodb/templates/replicaset/statefulset.yaml
    set:
      mongodb.tls.enabled: false
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '@\$\{HOSTNAME\}\.mongodb-headless\.othns\.svc\.cluster\.local:27017/admin\?authMechanism='
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '\.nvsentinel\.svc'

  # mongod runs with tls.mode requireTLS, so the Percona sidecar must present a
  # client certificate or every connection is rejected (#2488).
  - it: Percona exporter presents the member certificate from the ssl volume
    template: charts/psmdb-db/templates/cluster.yaml
    set:
      useBitnami: false
      usePerconaOperator: true
    asserts:
      - contains:
          path: spec.replsets[0].sidecars[?(@.name == "mongodb-exporter")].volumeMounts
          content:
            name: ssl
            mountPath: /etc/mongodb-ssl
            readOnly: true
      - matchRegex:
          path: spec.replsets[0].sidecars[?(@.name == "mongodb-exporter")].env[?(@.name == "MONGODB_URI")].value
          pattern: 'tls=true&.*tlsCertificateFile=/etc/mongodb-ssl/tls\.crt&tlsPrivateKeyFile=/etc/mongodb-ssl/tls\.key'

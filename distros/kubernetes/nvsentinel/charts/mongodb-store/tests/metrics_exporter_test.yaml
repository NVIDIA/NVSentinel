suite: mongodb metrics exporter
templates:
  - charts/mongodb/templates/replicaset/statefulset.yaml
release:
  name: nvsentinel
  namespace: othns
tests:
  - it: connects the exporter to the member in the release namespace with TLS
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '@\$\{HOSTNAME\}\.mongodb-headless\.othns\.svc\.cluster\.local:27017/admin\?tls=true'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '\.nvsentinel\.svc'

  - it: connects the exporter to the member in the release namespace without TLS
    set:
      mongodb.tls.enabled: false
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '@\$\{HOSTNAME\}\.mongodb-headless\.othns\.svc\.cluster\.local:27017/admin\?authMechanism='
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "metrics")].args[0]
          pattern: '\.nvsentinel\.svc'

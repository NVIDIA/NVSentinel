suite: mongodb cluster domain
templates:
  - templates/configmap.yaml
release:
  name: nvsentinel
  namespace: nvsentinel
tests:
  - it: keeps cluster.local in the datastore URI by default
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.MONGODB_URI
          value: "mongodb://mongodb-headless.nvsentinel.svc.cluster.local:27017/?replicaSet=rs0&tls=true"

  - it: builds the datastore URI with global.clusterDomain
    template: templates/configmap.yaml
    set:
      global.clusterDomain: example.local
    asserts:
      - equal:
          path: data.MONGODB_URI
          value: "mongodb://mongodb-headless.nvsentinel.svc.example.local:27017/?replicaSet=rs0&tls=true"

  - it: builds the Percona datastore URI with global.clusterDomain
    template: templates/configmap.yaml
    set:
      useBitnami: false
      usePerconaOperator: true
      global.clusterDomain: example.local
    asserts:
      - equal:
          path: data.MONGODB_URI
          value: "mongodb://mongodb-rs0.nvsentinel.svc.example.local:27017/?replicaSet=rs0&tls=true"


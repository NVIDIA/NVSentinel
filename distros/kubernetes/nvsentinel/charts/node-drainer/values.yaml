replicaCount: 1

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

resources: 
  limits:
    cpu: "200m"
    memory: "300Mi"
  requests:
    cpu: "200m"
    memory: "300Mi"

image:
  repository: nodedrainer
  tag: main

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}

tolerations: []

metricsPort: 2112

clientCertMountPath: "/etc/ssl/mongo-client"

configPath: "/etc/config/config.toml"

config: |
  evictionTimeoutInSeconds = "60"
  systemNamespaces = "^(nvsentinel|kube-system|gpu-operator|prometheus|observability|gmp-system|nv-storage)$"
  
  # Time after which a pod in NotReady state is considered stuck (in minutes)
  notReadyTimeoutMinutes = 5
  
  # User namespace configuration with eviction modes
  [[userNamespaces]]
  name = "runai*"
  mode = "AllowCompletion"
suite: cluster role
templates:
  - templates/clusterrole.yaml
set:
  global.partialRemediationEntityTypes: {}
tests:
  # node-drainer reads the DRA claims of pods from a ResourceClaim informer, which lists and watches them.
  - it: lets node-drainer get, list and watch ResourceClaims
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - resource.k8s.io
            resources:
              - resourceclaims
            verbs:
              - get
              - list
              - watch

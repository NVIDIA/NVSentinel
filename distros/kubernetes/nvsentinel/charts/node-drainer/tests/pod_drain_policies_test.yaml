suite: pod drain policies
templates:
  - templates/configmap.yaml
tests:
  - it: preserves namespace-only configuration by default
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?s)\[\[userNamespaces\]\].*name = "\*".*mode = "AllowCompletion"'
      - notMatchRegex:
          path: data["config.toml"]
          pattern: '\[\[podDrainPolicies\]\]'

  - it: renders ordered policies and defaults an omitted namespace to all namespaces
    set:
      podDrainPolicies:
        - name: protected
          namespace: training-*
          podSelector: 'app in (trainer,worker),!disposable'
          mode: AllowCompletion
        - name: workers
          podSelector: 'app=worker'
          mode: Immediate
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '(?s)\[\[podDrainPolicies\]\]\s+name = "protected"\s+namespace = "training-\*"\s+podSelector = "app in \(trainer,worker\),!disposable"\s+mode = "AllowCompletion"\s+\[\[podDrainPolicies\]\]\s+name = "workers"\s+namespace = "\*"\s+podSelector = "app=worker"\s+mode = "Immediate"'

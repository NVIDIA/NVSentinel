apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nic-health-monitor.fullname" . }}-config
  labels:
    {{- include "nic-health-monitor.labels" . | nindent 4 }}
data:
  config.yaml: |
    # NIC Health Monitor Configuration
    # Generated from Helm values

    # NIC exclusion regex patterns
    nicExclusionRegex: {{ .Values.nicExclusionRegex | quote }}

    # Override: monitor only NICs matching these patterns (bypasses auto-discovery)
    nicInclusionRegexOverride: {{ .Values.nicInclusionRegexOverride | quote }}

    # sysfs paths (container mount points)
    sysClassNetPath: {{ .Values.sysClassNetPath | quote }}
    sysClassInfinibandPath: {{ .Values.sysClassInfinibandPath | quote }}

    # Counter detection configuration
    counterDetection:
      enabled: {{ .Values.counterDetection.enabled }}
      counters:
        {{- range .Values.counterDetection.counters }}
        - name: {{ .name | quote }}
          path: {{ .path | quote }}
          enabled: {{ .enabled }}
          isFatal: {{ .isFatal }}
          thresholdType: {{ .thresholdType | quote }}
          threshold: {{ .threshold }}
          {{- if .velocityUnit }}
          velocityUnit: {{ .velocityUnit | quote }}
          {{- end }}
          description: {{ .description | quote }}
          recommendedAction: {{ .recommendedAction | quote }}
        {{- end }}

suite: platform-connector auth strictness
templates:
  - templates/daemonset.yaml
set:
  global.initContainerImage.repository: busybox
  global.initContainerImage.tag: 1.37.0
  global.platformConnectorAuth.audience: test-audience
tests:
  # This chart keeps its own copy of the umbrella's pcAuth helpers, because a
  # subchart definition of an nvsentinel.* name would override the parent's for
  # every other chart. The copy must apply the same strictness: an earlier one
  # skipped the boolean check, so a quoted "false" was refused by the umbrella
  # and silently ENABLED token injection here.
  - it: refuses a quoted "false" rather than reading it as enabled
    template: templates/daemonset.yaml
    set:
      global.platformConnectorAuth.enabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: must be a boolean

  - it: refuses a null rather than silently disabling authentication
    template: templates/daemonset.yaml
    set:
      global.platformConnectorAuth.enabled: null
    asserts:
      - failedTemplate:
          errorPattern: must be a boolean

  - it: refuses a number rather than reading it as a boolean
    template: templates/daemonset.yaml
    set:
      global.platformConnectorAuth.enabled: 0
    asserts:
      - failedTemplate:
          errorPattern: must be a boolean

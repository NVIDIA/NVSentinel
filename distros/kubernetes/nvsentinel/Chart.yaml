apiVersion: v2
name: nvsentinel
description: Helm chart for NVSentinel
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: gpu-health-monitor
    version: "0.1.0"
    condition: global.gpuHealthMonitor.enabled
  - name: nic-health-monitor
    version: "0.1.0"
    condition: global.nicHealthMonitor.enabled
  - name: nvswitch-health-monitor
    version: "0.1.0"
    condition: global.nvSwitchHealthMonitor.enabled
  - name: mongodb-store
    version: "0.1.0"
    condition: platformConnector.mongodbStore.enabled
  - name: fault-quarantine
    version: "0.1.0"
    condition: global.faultQuarantineModule.enabled
  - name: fault-notification
    version: "0.1.0"
    condition: global.faultNotificationModule.enabled
  - name: shoreline-agent
    version: v27.5.0
    repository: https://helm.ngc.nvidia.com/nv-ngc-devops
    condition: shoreline-agent.global.enabled

# Renders nothing; only validates global.partialRemediationEntityTypes, which
# the components that run partial drains read. Each component also validates the
# map when it starts, but an install fails earlier here, with the value path.
{{- $types := (.Values.global | default dict).partialRemediationEntityTypes | default dict }}
{{- if not (kindIs "map" $types) }}
{{- fail "global.partialRemediationEntityTypes must be a map from entity type to its devices and scopedActions" }}
{{- end }}
{{- $actionOwner := dict }}
{{- range $name := keys $types | sortAlpha }}
{{- $path := printf "global.partialRemediationEntityTypes.%s" $name }}
{{- $entityType := index $types $name | default dict }}
{{- if not $entityType.devices }}
{{- fail (printf "%s has no devices. Add a device-plugin entry with resourceNames, or a DRA entry with driver, deviceClasses and entityValueAttribute." $path) }}
{{- end }}
{{- range $i, $device := $entityType.devices }}
{{- $isDevicePlugin := not (empty $device.resourceNames) }}
{{- $isDRA := or $device.driver $device.deviceClasses $device.entityValueAttribute }}
{{- if and $isDevicePlugin $isDRA }}
{{- fail (printf "%s.devices[%d] sets resourceNames and DRA fields. An entry is either a device-plugin entry with resourceNames, or a DRA entry with driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- if not (or $isDevicePlugin $isDRA) }}
{{- fail (printf "%s.devices[%d] is empty. Set resourceNames, or driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- if and $isDRA (not (and $device.driver $device.deviceClasses $device.entityValueAttribute)) }}
{{- fail (printf "%s.devices[%d] is a DRA entry, so it needs driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- end }}
{{- range $action := $entityType.scopedActions | default list }}
{{- if and (hasKey $actionOwner $action) (ne (index $actionOwner $action) $name) }}
{{- fail (printf "Action %s is in the scopedActions of both %s and %s. An action can be scoped to only one entity type." $action (index $actionOwner $action) $name) }}
{{- end }}
{{- $_ := set $actionOwner $action $name }}
{{- end }}
{{- end }}

# Renders nothing; only validates global.partialRemediationEntityTypes, which
# the components that run partial drains read. Each component also validates the
# map when it starts, but an install fails earlier here, with the value path.
{{- $types := (.Values.global | default dict).partialRemediationEntityTypes | default dict }}
{{- if not (kindIs "map" $types) }}
{{- fail "global.partialRemediationEntityTypes must be a map from entity type to its devices and scopedActions" }}
{{- end }}
{{- $actionOwner := dict }}
{{- /* The pod device annotation lists devices under resource names and driver names, without the entity
type, so a device name or DeviceClass can belong to only one entity type. */}}
{{- $nameOwner := dict }}
{{- $deviceClassOwner := dict }}
{{- range $name := keys $types | sortAlpha }}
{{- if eq $name "" }}
{{- fail "global.partialRemediationEntityTypes has an entity type with an empty name" }}
{{- end }}
{{- $path := printf "global.partialRemediationEntityTypes.%s" $name }}
{{- $entityType := index $types $name | default dict }}
{{- if not $entityType.devices }}
{{- fail (printf "%s has no devices. Add a device-plugin entry with resourceNames, or a DRA entry with driver, deviceClasses and entityValueAttribute." $path) }}
{{- end }}
{{- /* The annotation lists the devices of a driver under the driver name only, so the pod device mapper records
one attribute for each driver. */}}
{{- $driverAttribute := dict }}
{{- range $i, $device := $entityType.devices }}
{{- if and $device.driver $device.entityValueAttribute }}
{{- if and (hasKey $driverAttribute $device.driver) (ne (index $driverAttribute $device.driver) $device.entityValueAttribute) }}
{{- fail (printf "%s lists driver %s with entityValueAttribute %s and %s. A driver can have only one." $path $device.driver (index $driverAttribute $device.driver) $device.entityValueAttribute) }}
{{- end }}
{{- $_ := set $driverAttribute $device.driver $device.entityValueAttribute }}
{{- end }}
{{- $isDevicePlugin := not (empty $device.resourceNames) }}
{{- $isDRA := or $device.driver $device.deviceClasses $device.entityValueAttribute }}
{{- if and $isDevicePlugin $isDRA }}
{{- fail (printf "%s.devices[%d] sets resourceNames and DRA fields. An entry is either a device-plugin entry with resourceNames, or a DRA entry with driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- if not (or $isDevicePlugin $isDRA) }}
{{- fail (printf "%s.devices[%d] is empty. Set resourceNames, or driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- if and $isDRA (not (and $device.driver $device.deviceClasses $device.entityValueAttribute)) }}
{{- fail (printf "%s.devices[%d] is a DRA entry, so it needs driver, deviceClasses and entityValueAttribute." $path $i) }}
{{- end }}
{{- range $field := list "resourceNames" "deviceClasses" }}
{{- if has "" (index $device $field | default list) }}
{{- fail (printf "%s.devices[%d].%s has an empty name." $path $i $field) }}
{{- end }}
{{- end }}
{{- $deviceNames := $device.resourceNames | default list }}
{{- if $device.driver }}
{{- $deviceNames = append $deviceNames $device.driver }}
{{- end }}
{{- range $deviceName := $deviceNames }}
{{- if and (hasKey $nameOwner $deviceName) (ne (index $nameOwner $deviceName) $name) }}
{{- fail (printf "Device name %s is listed under both %s and %s. The pod device annotation does not record the entity type, so a device name can belong to only one entity type." $deviceName (index $nameOwner $deviceName) $name) }}
{{- end }}
{{- $_ := set $nameOwner $deviceName $name }}
{{- end }}
{{- range $deviceClass := $device.deviceClasses | default list }}
{{- if and (hasKey $deviceClassOwner $deviceClass) (ne (index $deviceClassOwner $deviceClass) $name) }}
{{- fail (printf "DeviceClass %s is listed under both %s and %s. The pod device annotation does not record the entity type, so a DeviceClass can belong to only one entity type." $deviceClass (index $deviceClassOwner $deviceClass) $name) }}
{{- end }}
{{- $_ := set $deviceClassOwner $deviceClass $name }}
{{- end }}
{{- end }}
{{- range $action := $entityType.scopedActions | default list }}
{{- if eq $action "" }}
{{- fail (printf "%s.scopedActions has an empty action. An empty list turns partial drains off for the entity type." $path) }}
{{- end }}
{{- if and (hasKey $actionOwner $action) (ne (index $actionOwner $action) $name) }}
{{- fail (printf "Action %s is in the scopedActions of both %s and %s. An action can be scoped to only one entity type." $action (index $actionOwner $action) $name) }}
{{- end }}
{{- $_ := set $actionOwner $action $name }}
{{- end }}
{{- end }}
{{- /* Scope check at install (ADR-071). fault-remediation must repair only the device that a partial drain
covers. An impactedEntityScope must name a configured entity type. When node-drainer and fault-remediation are
deployed and partial drains are on, each scoped action needs a maintenance.actions entry with the same
impactedEntityScope; an entry without it acts on the full node, which stops pods that were not drained.
partialDrainEnabled resolves the same way node-drainer's configmap does: global overrides the subchart value. */}}
{{- $scopeGlobal := .Values.global | default dict }}
{{- $faultRemediationOn := ($scopeGlobal.faultRemediation | default dict).enabled }}
{{- $nodeDrainerOn := ($scopeGlobal.nodeDrainer | default dict).enabled }}
{{- $nodeDrainerValues := index .Values "node-drainer" | default dict }}
{{- $globalPartialDrain := $scopeGlobal.partialDrainEnabled }}
{{- $partialDrainRaw := ternary $globalPartialDrain $nodeDrainerValues.partialDrainEnabled (not (kindIs "invalid" $globalPartialDrain)) }}
{{- $partialDrainOn := eq (lower (printf "%v" $partialDrainRaw)) "true" }}
{{- $maintenanceActions := ((index .Values "fault-remediation" | default dict).maintenance | default dict).actions | default dict }}
{{- if $faultRemediationOn }}
{{- range $action := keys $maintenanceActions | sortAlpha }}
{{- $scope := (index $maintenanceActions $action | default dict).impactedEntityScope }}
{{- if and $scope (not (hasKey $types $scope)) }}
{{- fail (printf "fault-remediation.maintenance.actions.%s.impactedEntityScope is %s, which is not an entity type in global.partialRemediationEntityTypes." $action $scope) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $faultRemediationOn $nodeDrainerOn $partialDrainOn }}
{{- range $action := keys $actionOwner | sortAlpha }}
{{- $entityTypeName := index $actionOwner $action }}
{{- if not (hasKey $maintenanceActions $action) }}
{{- fail (printf "Partial drains are on and %s is in the scopedActions of %s, but fault-remediation.maintenance.actions has no entry for it. Add an entry with impactedEntityScope: %s, or remove the action from scopedActions." $action $entityTypeName $entityTypeName) }}
{{- end }}
{{- $scope := (index $maintenanceActions $action | default dict).impactedEntityScope | default "" }}
{{- if ne $scope $entityTypeName }}
{{- fail (printf "Partial drains are on and %s is in the scopedActions of %s, so its partial drain evicts only the pods that use one device. fault-remediation.maintenance.actions.%s must set impactedEntityScope: %s, so that the repair acts on that device only. Change the action, or remove it from scopedActions." $action $entityTypeName $action $entityTypeName) }}
{{- end }}
{{- end }}
{{- end }}

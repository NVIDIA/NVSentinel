---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.kata.tls.caSecretName | trimSuffix "-secret" }}
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ .Values.global.kata.tls.caSecretName | trimSuffix "-secret" }}
  secretName: {{ .Values.global.kata.tls.caSecretName }}
  duration: 87600h   # 10 years
  renewBefore: 720h  # 30 days before expiration
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned-ca-issuer
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mongo-ca-issuer
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ .Values.global.kata.tls.caSecretName }}

---
# Platform Connector Certificate (for kata mode)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.global.kata.tls.secretName | trimSuffix "-secret" }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.global.kata.tls.secretName }}
  duration: 8760h   # 1 year
  renewBefore: 360h # 15 days before expiration
  commonName: platform-connector
  dnsNames:
    - {{ printf "%s-platform-connector.%s.svc.cluster.local" .Release.Name .Release.Namespace }}
    - {{ printf "%s-platform-connector.%s.svc" .Release.Name .Release.Namespace }}
    - platform-connector
  issuerRef:
    name: mongo-ca-issuer
    kind: Issuer



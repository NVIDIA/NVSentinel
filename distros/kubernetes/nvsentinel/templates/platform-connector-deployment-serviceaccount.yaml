{{- if include "nvsentinel.pcDeployment.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
---
# Exactly the calls the server makes: TokenReview for every caller token, the
# node read and status write of the pipeline, and its node Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - update
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nvsentinel.pcDeployment.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvsentinel.pcDeployment.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

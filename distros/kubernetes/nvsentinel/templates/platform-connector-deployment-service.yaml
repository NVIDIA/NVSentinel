{{- if include "nvsentinel.pcDeployment.enabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nvsentinel.pcDeployment.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ include "nvsentinel.pcDeployment.grpcPort" . }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.global.metricsPort }}
      targetPort: metrics
{{- end }}

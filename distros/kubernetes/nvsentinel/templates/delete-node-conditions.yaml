apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
  name: {{ include "nvsentinel.fullname" . }}-pre-install
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "-10"
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/status
    verbs:
      - get
      - patch
      - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nvsentinel.serviceAccountName" . }}-pre-install
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "-7"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nvsentinel.fullname" . }}-pre-install
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
    "helm.sh/hook-weight": "-4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nvsentinel.fullname" . }}-pre-install
subjects:
  - kind: ServiceAccount
    name: {{ include "nvsentinel.serviceAccountName" . }}-pre-install
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
  name: "delete-node-conditions-pre-install-job"
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": "hook-succeeded"
spec:
  template:
    spec:
      serviceAccountName: {{ include "nvsentinel.serviceAccountName" . }}-pre-install
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: delete-node-condition-pre-install-job
          image: {{ .Values.platformConnector.kubectlImage }}
          command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              echo "Deleting node conditions..."
              nodeConditions=("XidError" "GpuDbeMsbeProblem" "GpuHWSlowDown")
              nodes=$(kubectl get nodes -o name)
              for node in $nodes; do
                for condition in "${nodeConditions[@]}"; do
                  conditionIndex=$(kubectl get $node -o json | jq --arg condition "$condition" '.status.conditions | map(.type == $condition) | index(true)')
                  if [[ $conditionIndex != "null" ]]; then
                    kubectl patch $node --type='json' -p="[{\"op\": \"remove\", \"path\": \"/status/conditions/$conditionIndex\"}]" --subresource=status
                    if [[ $? -eq 0 ]]; then
                      echo "Removed $condition from $node"
                    else
                      echo "Failed to remove $condition from $node"
                    fi
                  else
                    echo "$condition condition not found on $node, nothing to delete."
                  fi
                done
              done
      restartPolicy: Never
  backoffLimit: 4
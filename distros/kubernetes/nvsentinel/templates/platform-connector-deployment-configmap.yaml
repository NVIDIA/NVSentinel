{{- if include "nvsentinel.pcDeployment.enabled" . }}
{{- $d := .Values.platformConnector.deployment }}
{{- $int := "nvsentinel.positiveInt" }}
# Fleet-sized; every tunable the server reads is in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
data:
  {{- $files := dict "context" .
        "k8sQps" (include $int (list "platformConnector.deployment.kubernetes.qps" $d.kubernetes.qps))
        "k8sBurst" (include $int (list "platformConnector.deployment.kubernetes.burst" $d.kubernetes.burst))
        "cacheSize" (include $int (list "platformConnector.deployment.kubernetes.nodeMetadataCacheSize" $d.kubernetes.nodeMetadataCacheSize))
        "cacheTTL" $d.kubernetes.nodeMetadataCacheTtl
        "deployment" (dict
          "TokenReviewQps" (include $int (list "platformConnector.deployment.auth.tokenReviewQps" $d.auth.tokenReviewQps))
          "TokenReviewBurst" (include $int (list "platformConnector.deployment.auth.tokenReviewBurst" $d.auth.tokenReviewBurst))
          "TokenCacheSize" (include $int (list "platformConnector.deployment.auth.tokenCacheSize" $d.auth.tokenCacheSize))
          "ConditionUpdateTimeout" $d.conditionUpdateTimeout
          "MaxConnectionAge" $d.connections.maxAge
          "MaxConnectionIdle" $d.connections.maxIdle
          "GrpcReadBufferBytes" (include $int (list "platformConnector.deployment.connections.readBufferBytes" $d.connections.readBufferBytes))
          "GrpcWriteBufferBytes" (include $int (list "platformConnector.deployment.connections.writeBufferBytes" $d.connections.writeBufferBytes))) }}
  {{- include "nvsentinel.platformConnector.configFiles" $files | nindent 2 }}
{{- end }}

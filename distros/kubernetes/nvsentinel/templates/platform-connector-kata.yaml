{{- if .Values.global.kata.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvsentinel.fullname" . }}-platform-connector
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nvsentinel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform-connector
  template:
    metadata:
      labels:
        {{- include "nvsentinel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform-connector
    spec:
      {{- with .Values.platformConnector.kataModeDeployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.platformConnector.kataModeDeployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nvsentinel.fullname" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform-connector
          image: "{{ .Values.platformConnector.image.repository }}:{{ .Values.global.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.platformConnector.image.pullPolicy }}
          args:
            - "--listen-addr=:{{ .Values.global.kata.port.servicePort }}"
            - "--config=/etc/config/config.json"
            - "--metrics-port={{ .Values.global.kata.port.metricsPort }}"
            - "--transport=tcp"
            - "--server-cert={{ .Values.global.kata.tls.mountPath }}/tls.crt"
            - "--server-key={{ .Values.global.kata.tls.mountPath }}/tls.key"
            - "--ca-cert={{ .Values.global.kata.tls.mountPath }}/ca.crt"
            - "--mongo-client-cert-mount-path={{ .Values.platformConnector.mongodbStore.clientCertMountPath }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          ports:
            - containerPort: {{ .Values.global.kata.port.servicePort }}
              name: grpc
              protocol: TCP
            - containerPort: {{ .Values.global.kata.port.metricsPort }}
              name: metrics
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platformConnector.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.platformConnector.securityContext | nindent 12 }}
          volumeMounts:
            - name: platform-connector-cert
              mountPath: {{ .Values.platformConnector.mongodbStore.clientCertMountPath }}
              readOnly: true
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: pc-tls
              mountPath: {{ .Values.global.kata.tls.mountPath }}/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: pc-tls
              mountPath: {{ .Values.global.kata.tls.mountPath }}/tls.key
              subPath: tls.key
              readOnly: true
            - name: pc-root-ca
              mountPath: {{ .Values.global.kata.tls.mountPath }}/ca.crt
              subPath: ca.crt
              readOnly: true
          envFrom:
            - configMapRef:
                name: mongodb-config
                optional: true
      volumes:
        - name: platform-connector-cert
          secret:
            secretName: mongo-app-client-cert-secret
            optional: true
        - name: config-volume
          configMap:
            name: platform-connector-configmap
        - name: tmp
          emptyDir: {}
        - name: pc-tls
          secret:
            secretName: {{ .Values.global.kata.tls.secretName }}
        - name: pc-root-ca
          secret:
            secretName: {{ .Values.global.kata.tls.caSecretName }}
      {{- with .Values.platformConnector.kataModeDeployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvsentinel.fullname" . }}-platform-connector
  labels:
    {{- include "nvsentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-connector
spec:
  selector:
    {{- include "nvsentinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-connector
  ports:
    - name: grpc
      port: {{ .Values.global.kata.port.servicePort }}
      targetPort: {{ .Values.global.kata.port.servicePort }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.global.kata.port.metricsPort }}
      targetPort: {{ .Values.global.kata.port.metricsPort }}
      protocol: TCP
  type: ClusterIP
{{- end }}
# Renders nothing; only validates. nvidia-labeler writes the dcgm.version and
# driver.installed labels, and removes them from a node that is opted out
# (managed: "false"). The GPU, syslog and NIC health monitors and metadata-collector
# select nodes on these labels. With nvidia-labeler off, nothing removes the labels,
# so those pods would stay on an opted-out node. Subcharts cannot read each other's
# values, so it is checked here. Values are compared as rendered strings, so a
# quoted "false" still counts as off.
{{- $global := .Values.global | default dict }}
{{- if ($global.labeler | default dict).enabled }}
{{- $nvidiaLabelerEnabled := ((.Values.labeler | default dict).nvidiaLabeler | default dict).enabled }}
{{- if and (not (kindIs "invalid" $nvidiaLabelerEnabled)) (eq (lower (printf "%v" $nvidiaLabelerEnabled)) "false") }}
{{- $readers := list }}
{{- range $toggle := list "gpuHealthMonitor" "syslogHealthMonitor" "nicHealthMonitor" "metadataCollector" }}
{{- if (index $global $toggle | default dict).enabled }}
{{- $readers = append $readers (printf "global.%s.enabled" $toggle) }}
{{- end }}
{{- end }}
{{- if $readers }}
{{- fail (printf "labeler.nvidiaLabeler.enabled is false, but these components are enabled: %s. They select nodes on the dcgm.version and driver.installed labels that nvidia-labeler writes. Without nvidia-labeler, nothing removes these labels from an opted-out node, so their pods stay on it. Disable these components too, or enable labeler.nvidiaLabeler." (join ", " $readers)) }}
{{- end }}
{{- end }}
{{- end }}

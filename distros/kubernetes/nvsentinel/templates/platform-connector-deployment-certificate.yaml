{{- if and (include "nvsentinel.pcDeployment.enabled" .) (eq (include "nvsentinel.pcDeployment.tlsMode" .) "required") }}
# TLS for the deployment platform connector gRPC listener. A long-lived CA is
# bootstrapped from the self-signed issuer and signs the short-lived server
# certificate through a CA issuer. cert-manager writes that CA into ca.crt of
# the server secret, and publisher pods mount this key as their trust bundle,
# so a routine renewal of the server certificate changes nothing they trust.
# Renewing the CA itself is rare (once a decade by default) and is felt once:
# the server takes the new CA with its next certificate, and each publisher
# picks it up when its mounted secret refreshes, inside its retry window.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}-selfsigned-issuer
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}-ca
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
spec:
  isCA: true
  secretName: {{ include "nvsentinel.pcDeployment.name" . }}-ca
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year
  subject:
    organizations:
      - NVIDIA
  commonName: {{ include "nvsentinel.pcDeployment.name" . }}-ca
  issuerRef:
    name: {{ include "nvsentinel.pcDeployment.name" . }}-selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "nvsentinel.pcDeployment.name" . }}-ca-issuer
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "nvsentinel.pcDeployment.name" . }}-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "nvsentinel.pcDeployment.certSecretName" . }}
  labels:
    {{- include "nvsentinel.pcDeployment.labels" . | nindent 4 }}
spec:
  secretName: {{ include "nvsentinel.pcDeployment.certSecretName" . }}
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  # No commonName: the Service names below carry the identity (clients verify
  # the SANs), and a long namespace would push a commonName past the 64
  # character limit and fail issuance.
  subject:
    organizations:
      - NVIDIA
  dnsNames:
    - {{ include "nvsentinel.pcDeployment.name" . }}
    - {{ include "nvsentinel.pcDeployment.name" . }}.{{ .Release.Namespace }}.svc
    - {{ include "nvsentinel.pcDeployment.name" . }}.{{ .Release.Namespace }}.svc.{{ (.Values.global).clusterDomain | default "cluster.local" }}
  issuerRef:
    name: {{ include "nvsentinel.pcDeployment.name" . }}-ca-issuer
    kind: Issuer
  usages:
    - digital signature
    - key encipherment
    - server auth
{{- end }}

global:
  image:
    tag: "main"

  dcgm:
    dcgmK8sServiceEnabled: true

  gpuHealthMonitor:
    enabled: true

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-gpu-health-monitor
      pullPolicy: IfNotPresent
    
    busybox:
      image:
        repository: nvcr.io/nv-ngc-devops/busybox
        tag: "1.31.1"
        pullPolicy: IfNotPresent

  nicHealthMonitor:
    enabled: true
    nicExclusionRegexesForInjectedContainer: "^eth0$" #This is the default nic already being monitored from the daemonset monitor
    nicExclusionRegexes: "^gketmp.*" 
    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-nic-health-monitor
      pullPolicy: IfNotPresent

  nvSwitchHealthMonitor:
    enabled: true

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-nvswitch-health-monitor
      pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: nvidia-ngcuser-pull-secret

  enableSidecarNICMonitoringForGKE: false

platformConnector:
  image:
    repository: nvcr.io/nv-ngc-devops/nvsentinel-platform-connectors
    pullPolicy: IfNotPresent

  resources: 
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

  securityContext:
    runAsUser: 0
    capabilities:
      drop:
      - ALL
      
  metricsPort: 2112

  mongodbStore:
    enabled: false
    clientCertMountPath: "/etc/ssl/mongo-client"

  kubectlImage: "nvcr.io/nv-ngc-devops/kubectl:1.28.5"

  podSecurityContext: {}

  updateStrategy: RollingUpdate
  maxUnavailable: 1

  k8sConnector:
    enabled: true
    qps: 5.0
    burst: 10

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

socketPath: "/var/run/nvsentinel.sock"
nodeHealthEventsSocketPath: "/var/run/nodeHealthEvents.sock"

shoreline-agent:
  global:
    enabled: true
    name: "shoreline"
    customer_id: "nvidiadev3"
    customer_endpoint: "nvidiadev3.agent-gateway.shoreline-prod1.io:443"
    imagePullSecret: "nvidia-ngcuser-pull-secret"
    caPemstoreVolumeType: "secret"

  agent:
    serviceaccount:
      irsa: false
    resource:
      kind: "DaemonSet"
      image: "nvcr.io/nv-ngc-devops/shoreline-agent"
      tag: "release-27.0.43-multiarch"
      imageCredentialK8sSecret: "nvidia-ngcuser-pull-secret"
      hostAction: "enable"
      volumeMounts:
        caPemstoreReadOnly: true
      resources:
        limits:
          cpu: "350m"
          memory: "400Mi"
        requests:
          cpu: "350m"
          memory: "400Mi"
      environmentVariables:
        - name: INGESTION_MODE
          value: "OFF"
        - name: PUSH_METRICS_ENABLED
          value: "false"
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

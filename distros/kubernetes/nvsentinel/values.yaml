global:
  image:
    tag: "main"

  dcgm:
    dcgmK8sServiceEnabled: true

  dryRun: false

  gpuHealthMonitor:
    enabled: true

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-gpu-health-monitor
      pullPolicy: IfNotPresent
    
    useHostNetworking: false
    
    busybox:
      image:
        repository: nvcr.io/nv-ngc-devops/busybox
        tag: "1.31.1"
        pullPolicy: IfNotPresent

  nicHealthMonitor:
    enabled: true
    nicExclusionRegexesForInjectedContainer: "^eth0$" #This is the default nic already being monitored from the daemonset monitor
    nicExclusionRegexes: "^gketmp.*" 
    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-nic-health-monitor
      pullPolicy: IfNotPresent

  faultQuarantineModule:
    enabled: false

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-fault-quarantine-module
      pullPolicy: IfNotPresent

  nodeDrainerModule:
    enabled: false

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-node-drainer-module
      pullPolicy: IfNotPresent

  faultRemediationModule:
    enabled: false

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-fault-remediation-module
      pullPolicy: IfNotPresent

  nvSwitchHealthMonitor:
    enabled: true

    image:
      repository: nvcr.io/nv-ngc-devops/nvsentinel-nvswitch-health-monitor
      pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: nvidia-ngcuser-pull-secret

  enableSidecarNICMonitoringForGKE: false

  mongodbStore:
    images:
      mongosh:
        repository: nvcr.io/nv-ngc-devops/rtsp-mongosh
        tag: "2.3.3"
        pullPolicy: IfNotPresent


platformConnector:
  image:
    repository: nvcr.io/nv-ngc-devops/nvsentinel-platform-connectors
    pullPolicy: IfNotPresent

  resources: 
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

  securityContext:
    runAsUser: 0
    capabilities:
      drop:
      - ALL
      
  metricsPort: 2112

  mongodbStore:
    enabled: false
    clientCertMountPath: "/etc/ssl/mongo-client"

  kubectlImage: "nvcr.io/nv-ngc-devops/kubectl:1.28.5"

  podSecurityContext: {}

  updateStrategy: RollingUpdate
  maxUnavailable: 1

  k8sConnector:
    enabled: true
    qps: 5.0
    burst: 10
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

socketPath: "/var/run/nvsentinel.sock"
nodeHealthEventsSocketPath: "/var/run/nodeHealthEvents.sock"

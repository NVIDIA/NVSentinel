# Centralized Tool Versions
# 
# This file defines the canonical versions for all tools, languages, and dependencies
# used across the NVSentinel project. All installation scripts, CI/CD workflows, and
# Makefiles should reference this file as the single source of truth.
#
# Usage:
#   - GitHub Actions: Read and parse this file in versions.yaml
#   - Makefiles: Source versions using yq or similar YAML parser
#   - Documentation: Reference this file for version requirements
#
# When updating versions:
#   1. Update the version here
#   2. Test locally with: make install-lint-tools, make install-go-ci
#   3. Verify CI/CD workflows still pass
#   4. Update DEVELOPMENT.md if there are breaking changes

# Language Versions
languages:
  go: '1.27.0'
  python: '3.13'

# Build & Package Management
build_tools:
  poetry: '2.3.3'
  poetry_plugin_export: '1.10.0'
  native_sbom_syft: 'v1.51.1'

# Private runtime for the native GPU monitor release (not the host Python).
# Pin both the upstream asset URL and its published digest. Qualify each update.
native_gpu_monitor:
  python_version: '3.13.15'
  linux_amd64:
    url: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
    sha256: '8a689a077337bea6d1c4bc0b7df1d52fcaa28f5f67e50df8bf417c1e3f9d8874'

# Go Development Tools
go_tools:
  golangci_lint: 'v2.13.1'
  gotestsum: 'v1.13.0'
  gocover_cobertura: 'v1.4.0'
  setup_envtest: 'v0.0.0-20260119123727-a2de7e94d2dd'
  goimports: 'v0.30.0'
  crane: 'v0.20.2'
  controller_gen: 'v0.19.0'

# Protocol Buffers / gRPC
protobuf:
  protobuf: 'v33.4'
  protoc_gen_go: 'v1.36.10'
  protoc_gen_go_grpc: 'v1.5.1'
  grpcio_tools: '1.75.1'
  # CRD/Protoc-gen-crd
  protoc_gen_crd: 'v1.1.0'


# Linting & Validation
linting:
  shellcheck: 'v0.11.0'
  addlicense: 'v1.2.0'
  black: '26.3.1'

# Container Tools
container_tools:
  docker_buildx: 'latest'
  ko: 'v0.18.0'

# Testing & E2E Tools
testing_tools:
  kind: '0.30.0'
  helm: 'v3.19.2'
  # Official Helm archive digest. Update together with the Helm version.
  helm_linux_amd64_sha256: '2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e'
  helm_unittest: 'v1.0.3'
  kwok: 'v0.8.0'
  kwok_chart: '0.3.0'  # KWOK Helm chart version (different from app version); tilt/Tiltfile pins this
  ctlptl: '0.8.43'
  tilt: '0.35.2'

# Cluster Dependencies
cluster:
  prometheus_operator: '78.5.0'
  gpu_operator: 'v25.10.0'
  cert_manager: '1.21.1'
  policy_controller: '0.10.5'  # Sigstore Policy Controller Helm chart version

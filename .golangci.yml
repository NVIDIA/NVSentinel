version: "2"
run:
  go: "1.27"
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: false
  allow-parallel-runners: false
output:
  formats:
    text:
      path: stdout
      print-linter-name: false
      print-issued-lines: false
    code-climate:
      path: code-quality-report.json
  path-prefix: ""
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gosec
    - lll
    - misspell
    - nestif
    - nilerr
    - noctx
    - whitespace
    - wsl_v5
    - gosec
    - depguard
  settings:
    depguard:
      # Each rule checks only the files that it lists.
      rules:
        # ADR-070 and ADR-072: the pod device mapper is core code, and metadata-collector holds the NVIDIA discovery.
        pod-device-mapper:
          files:
            - "**/pod-device-mapper/**"
          deny:
            - pkg: github.com/nvidia/nvsentinel/metadata-collector
              desc: core code must not import the NVIDIA discovery (ADR-070, ADR-072)
        # ADR-070 and ADR-077: the labeler is core code, and nvidia-labeler holds the NVIDIA detection.
        labeler:
          files:
            - "**/labeler/**"
            # nvidia-labeler/pkg/labeler matches the line above.
            - "!**/nvidia-labeler/**"
          deny:
            - pkg: github.com/nvidia/nvsentinel/nvidia-labeler
              desc: core code must not import the NVIDIA detection (ADR-070, ADR-077)
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  uniq-by-line: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

apiVersion: v1
kind: ConfigMap
metadata:
  name: event-generator-config
  namespace: nvsentinel
  labels:
    app: event-generator
    load-type: heavy
data:
  # Heavy Load: High stress test (34× production peak)
  # 0.2 events/sec/node = 12.0 events/minute/node
  # For a 1500-node cluster: 300 events/sec total
  EVENT_RATE: "0.2"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  
  # Retry and stats configuration
  RETRY_ATTEMPTS: "5"  # Increased retries for heavy load
  STATS_INTERVAL: "50"  # More frequent stats reporting


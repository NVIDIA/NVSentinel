# The E2E tests that each CI job runs, so that the jobs do not all run the same tests.
#
# Each key is the E2E_JOB_ID of a job in .github/workflows/e2e-test.yml. Its value lists the tests
# that the job runs. The tests in "all" run in every job. A job skips each test that is not in its
# list or in "all". The build tags of the test file still select the architecture.
#
# Every test function in tests/ must be in this file, in "all" or in one or more jobs, and every
# test in this file must exist. e2e-skip-pattern.sh fails if not. So, when you add a test, you must
# select its jobs.
#
# These tests are in "all": the smoke tests, change streams, resume tokens, cold start, the circuit
# breaker cursor and the deployment platform connector tests. They check the connection to each
# datastore and its change stream.
#
# Tests that do not depend on the datastore are in one job for each architecture: health monitor
# detection, node labels, preflight and janitor requests.
#
# Pipeline tests are in one MongoDB job and one PostgreSQL job for each architecture. The MongoDB,
# MongoDB (no TLS) and MongoDB (Percona) jobs use the same MongoDB engine with a different
# connection or operator, so one of them is sufficient for each test. MongoDB-only tests are in one
# MongoDB job for each architecture.
#
# Every health monitor that can publish to the deployment platform connector has at least one test
# in the deployment platform connector job of its architecture.
#
# The tests in health_events_analyzer_recovery_test.go and health_events_analyzer_test.go are in the
# same job, and run in file order. TestMultipleRemediationsNotTriggered needs a node with no
# remediations. The analyzer tests take nodes from the node pool, but other tests use the same nodes
# without the pool. When the earlier analyzer tests run first, they take those nodes, as on main.
#
# To balance the jobs, use the test durations in results/e2e-tests.json of each job.


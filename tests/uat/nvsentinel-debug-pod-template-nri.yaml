# Used when there is no nvidia RuntimeClass, which the GPU Operator deletes in
# NRI plugin mode (cdi.nriPluginEnabled=true). The pod requests the management
# CDI device through the Container Toolkit's NRI plugin, which injects it only
# for pods in the GPU Operator namespace or in
# NRI_MANAGEMENT_CDI_DEVICE_NAMESPACES on the toolkit DaemonSet. Keep in sync
# with nvsentinel-debug-pod-template.yaml.
apiVersion: v1
kind: Pod
metadata:
  generateName: uat-node-debug-
  namespace: nvsentinel
  labels:
    app.kubernetes.io/name: uat-node-debug
  annotations:
    nvidia.cdi.k8s.io/container.nvsentinel-debug: management.nvidia.com/gpu=all
spec:
  nodeName: NODE_NAME
  restartPolicy: Never
  tolerations:
    - operator: Exists
  containers:
    - name: nvsentinel-debug
      # Same base image as the syslog-health-monitor runtime stage.
      image: public.ecr.aws/docker/library/debian:trixie-slim
      command: ["sleep", "3600"]
      securityContext:
        privileged: true

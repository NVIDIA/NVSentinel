apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-quarantine-config
  namespace: nvsentinel
data:
  config.toml: |
    [[rule-sets]]
      name = "Cordon-True-Rule"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuXidError' && '79' in event.errorCode"
      [rule-sets.taint]
        key = "TestCordon"
        value = "True"
        effect = "NoSchedule"
      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      name = "Cordon-False-Rule"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuXidError' && '143' in event.errorCode"
      [rule-sets.taint]
        key = "TestCordon"
        value = "False"
        effect = "PreferNoSchedule"
      [rule-sets.cordon]
        shouldCordon = false

    [[rule-sets]]
      name = "Mixed-Cordon-Rule-1"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuInforomWatch' && event.isFatal == true"
      [rule-sets.taint]
        key = "Mixed1"
        value = "True"
        effect = "NoSchedule"
      [rule-sets.cordon]
        shouldCordon = false

    [[rule-sets]]
      name = "Mixed-Cordon-Rule-2"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuInforomWatch' && event.componentClass == 'GPU'"
      [rule-sets.taint]
        key = "Mixed2"
        value = "True"
        effect = "PreferNoSchedule"
      [rule-sets.cordon]
        shouldCordon = true


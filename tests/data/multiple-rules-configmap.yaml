apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-quarantine-config
  namespace: nvsentinel
data:
  config.toml: |
    [[rule-sets]]
      name = "Rule-A-XID-143-152"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuXidError' && ('143' in event.errorCode || '152' in event.errorCode)"
      [rule-sets.taint]
        key = "GPUHealth"
        value = "False"
        effect = "PreferNoSchedule"
      [rule-sets.cordon]
        shouldCordon = false

    [[rule-sets]]
      name = "Rule-B-GpuInforomWatch"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuInforomWatch' && event.isFatal == true"
      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "False"
        effect = "NoSchedule"
      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      name = "Rule-C-XID-79"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuXidError' && '79' in event.errorCode"
      [rule-sets.taint]
        key = "GPU-Fatal"
        value = "True"
        effect = "NoSchedule"
      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      name = "Rule-D-XID-62-Exclusion"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.checkName == 'GpuXidError' && '62' in event.errorCode"

    [[rule-sets]]
      name = "Rule-E-NIC"
      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'nic-health-monitor' && event.isFatal == true"
      [rule-sets.taint]
        key = "NICHealth"
        value = "False"
        effect = "NoSchedule"
      [rule-sets.cordon]
        shouldCordon = true


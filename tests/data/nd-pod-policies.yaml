apiVersion: v1
kind: ConfigMap
metadata:
  name: node-drainer
  namespace: nvsentinel
data:
  config.toml: |
    evictionTimeoutInSeconds = "5"
    systemNamespaces = "^(kube-.*|nvsentinel|gpu-operator)$"
    deleteAfterTimeoutMinutes = 1
    notReadyTimeoutMinutes = 5
    partialDrainEnabled = true

    [[userNamespaces]]
    name = "pod-policies-test"
    mode = "Immediate"

    [[podDrainPolicies]]
    name = "protected-workers"
    namespace = "pod-policies-test"
    podSelector = "protected=yes"
    mode = "AllowCompletion"

    [[podDrainPolicies]]
    name = "workers"
    namespace = "pod-policies-test"
    podSelector = "role in (worker,overlap)"
    mode = "Immediate"

    [[podDrainPolicies]]
    name = "bounded"
    namespace = "pod-policies-test"
    podSelector = "role=bounded"
    mode = "DeleteAfterTimeout"

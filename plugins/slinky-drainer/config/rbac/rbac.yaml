apiVersion: v1
kind: ServiceAccount
metadata:
  name: slinky-drainer
  namespace: nvsentinel
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slinky-drainer-role
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: controller
rules:
- apiGroups: ["nvsentinel.nvidia.com"]
  resources: ["drainrequests"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["nvsentinel.nvidia.com"]
  resources: ["drainrequests/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["nvsentinel.nvidia.com"]
  resources: ["drainrequests/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
# The controller reads and deletes pods only in the namespace that it gets in
# --slinky-namespace, so the pod rule is a Role in that namespace and not a part
# of the ClusterRole. The namespace of this Role and of its RoleBinding must be
# the same as the value of that flag. config/default sets all three from
# one value. The namespace must exist before you apply this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slinky-drainer-pods
  namespace: slinky
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slinky-drainer-rolebinding
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slinky-drainer-role
subjects:
- kind: ServiceAccount
  name: slinky-drainer
  namespace: nvsentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slinky-drainer-pods
  namespace: slinky
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slinky-drainer-pods
subjects:
- kind: ServiceAccount
  name: slinky-drainer
  namespace: nvsentinel

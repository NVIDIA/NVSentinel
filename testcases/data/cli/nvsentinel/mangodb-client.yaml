apiVersion: v1
kind: Pod
metadata:
  name: mongo-client-pod
  namespace: nvsentinel
spec:
  restartPolicy: Never
  containers:
    - name: mongo-client
      image: rtsp/mongosh:latest
      command: [ "sh", "-c", "sleep 36000" ]  # Keep the pod running for 10 hours
      volumeMounts:
        - name: mongo-certificates
          mountPath: /certs
          readOnly: true
  volumes:
    - name: mongo-certificates
      secret:
        secretName: mongo-app-client-cert-secret
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nodeGroup
                operator: In
                values:
                  - monitoring
                  - customer-cpu
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists

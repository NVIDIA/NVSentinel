apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-job
spec:
  ttlSecondsAfterFinished: 30
  template:
    spec:
      containers:
      - name: gpu-container
        image: nvidia/cuda:12.3.2-base-ubuntu22.04 
        command: ["sleep", "infinity"]
        resources:
          limits:
            nvidia.com/gpu: 1
      restartPolicy: Never
      tolerations:
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          key: nvidia.com/gpu
          value: present
          operator: Equal
        - effect: NoSchedule
          key: dedicated
          value: user-workload
          operator: Equal
  backoffLimit: 3

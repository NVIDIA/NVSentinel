apiVersion: v1
data:
  config.toml: |2

    evictionTimeoutInSeconds = "60"
    systemNamespaces = "^(nvsentinel|kube-system|gpu-operator|prometheus|observability|gmp-system|nv-storage)$"
    [[userNamespaces]]
    name = "*"
    mode = "AllowCompletion"

    [[userNamespaces]]
    name = "busybox"
    mode = "Immediate"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: node-drainer
    app.kubernetes.io/version: 1.16.0
    argocd.argoproj.io/instance: nvsentinel
    helm.sh/chart: node-drainer-0.1.0
  name: node-drainer-config
  namespace: nvsentinel

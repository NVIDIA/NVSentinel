apiVersion: v1
kind: Pod
metadata:
  name: gpu-sleep-pod
  namespace: nvsentinel
  labels:
    app: gpu-sleep
spec:
  runtimeClassName: kata-qemu-nvidia-gpu
  nodeName: nvcf-dgxc-k8s-forge-az51-ct1-w-5603
  containers:
    - name: gpu-container
      image: nvidia/cuda:12.0.0-devel-ubuntu20.04
      command: ["sleep"]
      args: ["infinity"]
      resources:
        limits:
          nvidia.com/pgpu: 1
          memory: "1Gi"
        requests:
          nvidia.com/pgpu: 1
          memory: "1Gi"
          cpu: "500m"
  restartPolicy: Always
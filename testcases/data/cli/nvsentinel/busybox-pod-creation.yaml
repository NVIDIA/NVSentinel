apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: busybox-1
      namespace: busybox
    spec:
      nodeSelector:
        kubernetes.io/hostname: $NODE_NAME_1
      tolerations:
        - effect: NoExecute
          operator: Exists
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: busybox
          image: busybox
          command: ["sleep", "3600"]
  - apiVersion: v1
    kind: Pod
    metadata:
      name: busybox-2
      namespace: busybox
    spec:
      nodeSelector:
        kubernetes.io/hostname: $NODE_NAME_2
      tolerations:
        - effect: NoExecute
          operator: Exists
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: busybox
          image: busybox
          command: ["sleep", "3600"]
  - apiVersion: v1
    kind: Pod
    metadata:
      name: busybox-3
      namespace: busybox
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: $NODE_NAME_3
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - effect: NoExecute
          operator: Exists
      containers:
        - name: busybox
          image: busybox
          command: ["sleep", "3600"]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 60"]

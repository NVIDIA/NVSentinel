apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-quarantine-config
  namespace: nvsentinel
  labels:
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: fault-quarantine
    app.kubernetes.io/version: 1.16.0
    argocd.argoproj.io/instance: nvsentinel
    helm.sh/chart: fault-quarantine-0.1.0
data:
  config.toml: |
    [[rule-sets]]
      version = "1"
      name = "Example rule 1"
      priority = 1

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'gpu-health-monitor' && event.checkName == 'GpuInforomWatch'"

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.isFatal == true"

      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "False"
        effect = "NoSchedule"

      [rule-sets.cordon]
        shouldCordon = true

    [[rule-sets]]
      name = "Example rule 2"

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'gpu-health-monitor' && event.checkName == 'GpuXidError' && ('143' in event.errorCode || '152' in event.errorCode)"

      [rule-sets.taint]
        key = "GPUHealth"
        value = "False"
        effect = "PreferNoSchedule"

      [rule-sets.cordon]
        shouldCordon = false

    [[rule-sets]]
      version = "1"
      name = "Example rule 3"
      priority = 2 # Higher priority than Rule 1 and taint key-value is the same, this will be applied over rule 1

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.agent == 'gpu-health-monitor' && event.checkName == 'GpuInforomWatch' && event.componentClass == 'GPU'"

      [[rule-sets.match.all]]
        kind = "HealthEvent"
        expression = "event.isFatal == true"

      [rule-sets.taint]
        key = "AggregatedNodeHealth"
        value = "False"
        effect = "PreferNoSchedule"

      [rule-sets.cordon]
        shouldCordon = false

# Native defaults. Keep detection semantics aligned with the Helm defaults.
[logging]
LogFormat = %(levelname)s %(message)s
DateTimeFormat = %Y-%m-%dT%H:%M:%S

[dcgm]
PollIntervalSeconds = 15
ProbeDeadlineSeconds = 45
ProbeStoreOnly = true

[dcgmfieldsmonitoring]
gputemplimitmonitoringenabled = true
gputemplimitstoreonly = true
gpupowerbrakemonitoringenabled = false
gpupowerbrakestoreonly = true
gpupowerbrakeminconsecutivepolls = 3

[dcgmhealthcheck]
SuppressedErrorCodes = DCGM_FR_CLOCK_THROTTLE_POWER,DCGM_FR_CLOCKS_EVENT_POWER,DCGM_FR_CLOCK_THROTTLE_THERMAL,DCGM_FR_CLOCKS_EVENT_THERMAL
ConnectivityFailureEscalationThreshold = 0
MinConsecutivePolls =

[dcgmconnectivity]
FailureThreshold = 1
SuccessThreshold = 1

[eventprocessors.platformconnector]
SocketPath = /run/nvsentinel/nvsentinel.sock

[cli]
EnabledEventProcessors = PlatformConnectorEventProcessor

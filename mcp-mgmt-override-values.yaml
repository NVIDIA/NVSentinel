# This file contains overrides applied ONLY when generating MANAGEMENT resources.
mongodb-store:
  mongodb:
    global:
      namespaceOverride: "${NAMESPACE}"
    rbac:
      create: true
    externalAccess:
      enabled: true
      service:
        type: LoadBalancer
        annotations:
          cloud.google.com/load-balancer-type: "Internal"
          cloud.google.com/neg: '{"exposed_ports": {"27017":{}}}'
        publicNames:
          - ${RELEASE_NAME}-mongodb-0.psc.gcp.internal
          - ${RELEASE_NAME}-mongodb-1.psc.gcp.internal
          - ${RELEASE_NAME}-mongodb-2.psc.gcp.internal
        annotationsList:
          - external-dns.alpha.kubernetes.io/hostname: "${RELEASE_NAME}-mongodb-0.psc.gcp.internal"
          - external-dns.alpha.kubernetes.io/hostname: "${RELEASE_NAME}-mongodb-1.psc.gcp.internal"
          - external-dns.alpha.kubernetes.io/hostname: "${RELEASE_NAME}-mongodb-2.psc.gcp.internal" 
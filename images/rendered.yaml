kind: ConfigMap
metadata:
  name: nvsentinel-syslog-health-monitor
  labels:
    helm.sh/chart: syslog-health-monitor-0.1.0
    app.kubernetes.io/name: syslog-health-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
data:
  # This ConfigMap is currently minimal as primary configuration is passed
  # via command-line arguments in the DaemonSet, sourced from values.yaml.
  # It can be extended in the future if needed for more complex configurations
  # or scripts.

  template:
    metadata:
      labels:
        app.kubernetes.io/name: syslog-health-monitor
        app.kubernetes.io/instance: nvsentinel
    spec:
      imagePullSecrets:
        - name: nvidia-ngcuser-pull-secret
      securityContext:
        {}
      containers:
        - name: syslog-health-monitor
          securityContext:
            capabilities:
              add:
              - SYSLOG
              - SYS_ADMIN
            runAsUser: 0
          image: "ghcr.io/nvidia/nvsentinel-syslog-health-monitor:v0.1.0"
          imagePullPolicy: 
          args:
            - "--config-file"
            - "/etc/syslog-monitor/log_check_definitions.yaml"
            - "--polling-interval"
            - "15s"
            - "--metrics-port"
            - "2112"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: metrics
              containerPort: 2112
          livenessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env: 
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config-volume
              mountPath: /etc/syslog-monitor
              readOnly: true
            - name: var-run-vol
              mountPath: /var/run/
            - name: syslog-state-vol
              mountPath: /var/run/syslog_health_monitor
            # Regular mode: Mount var/log directly
            - name: var-log-vol
              mountPath: /nvsentinel/var/log
              readOnly: true
            - name: proc-vol
              mountPath: /nvsentinel/proc
              readOnly: true
            - name: sys-vol
              mountPath: /nvsentinel/sys
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: nvsentinel-syslog-health-monitor
        - name: var-run-vol
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
        - name: syslog-state-vol
          hostPath:
            path: /var/run/syslog_health_monitor
            type: DirectoryOrCreate
        # Regular mode: Direct var/log mount
        - name: var-log-vol
          hostPath:
            path: /var/log
            type: Directory
        - name: sys-vol
          hostPath:
            path: /sys
            type: Directory
        - name: proc-vol    
          hostPath:
            path: /proc
            type: Directory

      nodeSelector:
        nvsentinel.dgxc.nvidia.com/driver.installed: "true"

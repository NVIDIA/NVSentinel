            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: var-run-vol
              mountPath: /var/run
            - name: platform-connector-configmap
              mountPath: /etc/config/
            - name: mongo-app-client-cert
              mountPath: /etc/ssl/mongo-client
              readOnly: true
          env: 
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: mongodb-config
                optional: true
      volumes:
        - name: var-run-vol
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
        - name: platform-connector-configmap
          configMap:
            name: nvsentinel-platform-connector-config
        - name: mongo-app-client-cert
          secret:
            secretName: mongo-app-client-cert-secret
            optional: true

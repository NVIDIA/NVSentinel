apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nvsentinel-metrics-access
  labels:
    helm.sh/chart: nvsentinel-v0.1.0
    app.kubernetes.io/name: nvsentinel
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 2112
        - protocol: TCP
          port: 9216 # MongoDB metrics port

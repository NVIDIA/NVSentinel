        - name: nvidia-ngcuser-pull-secret
      serviceAccountName: nvsentinel
      securityContext:
        {}
      containers:
        - name: platform-connector
          ports:
            - name: metrics
              containerPort: 2112
          livenessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
              - ALL
            runAsUser: 0
          image: "ghcr.io/nvidia/nvsentinel-platform-connectors:v0.1.0"
          imagePullPolicy: IfNotPresent
          args:
          - "--config=/etc/config/config.json"
          - "--metrics-port=2112"
          - "--mongo-client-cert-mount-path=/etc/ssl/mongo-client"
          - "--socket=/var/run/nvsentinel.sock"

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvsentinel-gpu-health-monitor-dcgm-3.x
  labels:
    helm.sh/chart: gpu-health-monitor-0.1.0
    app.kubernetes.io/name: gpu-health-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 5%
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-health-monitor
      app.kubernetes.io/instance: nvsentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-health-monitor
        app.kubernetes.io/instance: nvsentinel
    spec:
      imagePullSecrets:
        - name: nvidia-ngcuser-pull-secret
      securityContext:
        {}
      containers:
        - name: gpu-health-monitor
          command: ["gpu_health_monitor"]
          args:
            - --config-file
            - "/etc/dcgmhealth/config.ini"
            - --dcgm-error-mapping-config-file
            - "/etc/dcgmhealth/dcgmerrorsmapping.csv"
            - --dcgm-addr
            - "nvidia-dcgm.gpu-operator.svc:5555"
            - --port
            - "2112"
            - --verbose
            - "False"
            - --state-file
            - /var/run/statefile
            - --dcgm-k8s-service-enabled
            - "true"
          securityContext:
            runAsUser: 0
          image: "ghcr.io/nvidia/nvsentinel-gpu-health-monitor:v0.1.0-dcgm-3.x"
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: metrics
              containerPort: 2112
          livenessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 2112
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config-vol
              mountPath: /etc/dcgmhealth
            - name: var-run-vol
              mountPath: /var/run/
          env: 
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
      volumes:
        - name: config-vol
          configMap:
            name: nvsentinel-gpu-health-monitor
            defaultMode: 0777
        - name: var-run-vol
          hostPath:
            path: /var/run/nvsentinel
            type: Directory
      nodeSelector:
        nvsentinel.dgxc.nvidia.com/dcgm.version: "3.x"
---

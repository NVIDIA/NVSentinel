apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-gpu-health-monitor
  labels:
    helm.sh/chart: gpu-health-monitor-0.1.0
    app.kubernetes.io/name: gpu-health-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.ini: |
    [logging]
    LogFormat = %%(asctime)s,%%(msecs)03d %%(levelname)-8s [%%(filename)s:%%(lineno)d] %%(message)s
    DateTimeFormat = %%Y-%%m-%%d:%%H:%%M:%%S

    [dcgm]
    PollIntervalSeconds = 15

    [eventprocessors.kubernetes]
    ConflictRetryCount = 10

    [eventprocessors.platformconnector]
    SocketPath = /var/run/nvsentinel.sock

    [cli]
    EnabledEventProcessors = PlatformConnectorEventProcessor

    [DCGMHealthConditionsCategorizationMapping]
    DCGM_HEALTH_WATCH_THERMAL=NonFatal
    DCGM_HEALTH_WATCH_POWER=NonFatal
    DCGM_HEALTH_WATCH_NVLINK=Fatal
    DCGM_HEALTH_WATCH_SM=Fatal
    DCGM_HEALTH_WATCH_MEM=Fatal
    DCGM_HEALTH_WATCH_INFOROM=Fatal
    DCGM_HEALTH_WATCH_MCU=Fatal
    DCGM_HEALTH_WATCH_DRIVER=Fatal
    DCGM_HEALTH_WATCH_NVSWITCH_FATAL=Fatal
    DCGM_HEALTH_WATCH_NVSWITCH_NONFATAL=NonFatal
    DCGM_HEALTH_WATCH_PCIE=Fatal
    DCGM_HEALTH_WATCH_PMU=Fatal

  dcgmerrorsmapping.csv: |-
    DCGM_FR_UNKNOWN,CONTACT_SUPPORT
    DCGM_FR_UNRECOGNIZED,CONTACT_SUPPORT
    DCGM_FR_PCI_REPLAY_RATE,CONTACT_SUPPORT
    DCGM_FR_VOLATILE_DBE_DETECTED,COMPONENT_RESET
    DCGM_FR_VOLATILE_SBE_DETECTED,IGNORE
    DCGM_FR_PENDING_PAGE_RETIREMENTS,IGNORE
    DCGM_FR_RETIRED_PAGES_LIMIT,CONTACT_SUPPORT
    DCGM_FR_RETIRED_PAGES_DBE_LIMIT,CONTACT_SUPPORT
    DCGM_FR_CORRUPT_INFOROM,COMPONENT_RESET
    DCGM_FR_CLOCKS_EVENT_THERMAL,CONTACT_SUPPORT
    DCGM_FR_CLOCK_THROTTLE_THERMAL,IGNORE
    DCGM_FR_POWER_UNREADABLE,RESTART_VM
    DCGM_FR_CLOCKS_EVENT_POWER,IGNORE
    DCGM_FR_CLOCK_THROTTLE_POWER,IGNORE
    DCGM_FR_NVLINK_ERROR_THRESHOLD,IGNORE
    DCGM_FR_NVLINK_DOWN,RESTART_VM
    DCGM_FR_NVSWITCH_FATAL_ERROR,CONTACT_SUPPORT
    DCGM_FR_NVSWITCH_NON_FATAL_ERROR,IGNORE
    DCGM_FR_NVSWITCH_DOWN,COMPONENT_RESET
    DCGM_FR_NO_ACCESS_TO_FILE,CONTACT_SUPPORT
    DCGM_FR_NVML_API,CONTACT_SUPPORT
    DCGM_FR_DEVICE_COUNT_MISMATCH,CONTACT_SUPPORT
    DCGM_FR_BAD_PARAMETER,CONTACT_SUPPORT
    DCGM_FR_CANNOT_OPEN_LIB,CONTACT_SUPPORT
    DCGM_FR_DENYLISTED_DRIVER,CONTACT_SUPPORT

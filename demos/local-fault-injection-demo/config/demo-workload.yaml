apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-workload
  namespace: default
  labels:
    app: gpu-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-workload
  template:
    metadata:
      labels:
        app: gpu-workload
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      terminationGracePeriodSeconds: 5
      containers:
        - name: workload
          image: busybox:stable
          command: ["sh", "-c", "echo 'training job running'; sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

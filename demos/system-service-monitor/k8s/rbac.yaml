apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-service-monitor
  namespace: nvsentinel
  labels:
    app.kubernetes.io/name: system-service-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/component: metrics

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system-service-monitor
  labels:
    app.kubernetes.io/name: system-service-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/component: metrics
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system-service-monitor
  labels:
    app.kubernetes.io/name: system-service-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/component: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system-service-monitor
subjects:
  - kind: ServiceAccount
    name: system-service-monitor
    namespace: nvsentinel

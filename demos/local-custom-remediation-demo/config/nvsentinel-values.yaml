global:
  dryRun: false

  systemNodeSelector:
    node-role.kubernetes.io/control-plane: ""
  systemNodeTolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  faultQuarantine:
    enabled: true
  nodeDrainer:
    enabled: true
  faultRemediation:
    enabled: true
  mongodbStore:
    enabled: true

  gpuHealthMonitor:
    enabled: false
  syslogHealthMonitor:
    enabled: false
  cspHealthMonitor:
    enabled: false
  kubernetesObjectMonitor:
    enabled: false
  nicHealthMonitor:
    enabled: false
  nvcreCertificationMonitor:
    enabled: false
  slurmDrainMonitor:
    enabled: false

  healthEventsAnalyzer:
    enabled: false
  lifecycleManager:
    enabled: false
  eventExporter:
    enabled: false
  preflight:
    enabled: false
  inclusterFileServer:
    enabled: false
  janitor:
    enabled: false
  janitorProvider:
    enabled: false
  labeler:
    enabled: false
  metadataCollector:
    enabled: false

podMonitor:
  enabled: false

mongodb-store:
  useBitnami: false
  usePerconaOperator: true

  job:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  psmdb-operator:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  psmdb-db:
    unsafeFlags:
      replsetSize: true

    replsets:
      rs0:
        size: 1
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeSpec:
          pvc:
            resources:
              requests:
                storage: 3Gi
        sidecars: []

platformConnector:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

fault-quarantine:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  circuitBreaker:
    enabled: false

  ruleSets:
    - enabled: true
      version: "1"
      name: "Memory pressure monitor ruleset"
      match:
        all:
          - kind: "HealthEvent"
            expression: "event.agent == 'memory-pressure-monitor' && event.componentClass == 'Memory' && event.isFatal == true"
      cordon:
        shouldCordon: true

node-drainer:
  systemNamespaces: "^(nvsentinel|kube-system|gpu-operator|cert-manager|local-path-storage)$"
  userNamespaces: []
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

fault-remediation:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  maintenance:
    actions:
      RECLAIM_MEMORY:
        apiGroup: "demo.nvsentinel.nvidia.com"
        version: "v1alpha1"
        kind: "MemoryReclaim"
        scope: "Cluster"
        completeConditionType: "MemoryReclaimed"
        templateFileName: "reclaim-memory-template.yaml"
        equivalenceGroup: "memory-reclaim"

    templates:
      "reclaim-memory-template.yaml": |
        apiVersion: demo.nvsentinel.nvidia.com/v1alpha1
        kind: MemoryReclaim
        metadata:
          name: memory-reclaim-{{ .HealthEvent.NodeName }}-{{ .HealthEventID }}
          labels:
            app.kubernetes.io/managed-by: nvsentinel
        spec:
          nodeName: {{ .HealthEvent.NodeName }}

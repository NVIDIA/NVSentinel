# The monitor reads host state via nsenter (hostPID + privileged) and talks
# to no Kubernetes API — node identity comes from the NODE_NAME downward-API
# env var — so the ServiceAccount carries no RBAC grants.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-services-monitor
  namespace: nvsentinel
  labels:
    app.kubernetes.io/name: system-services-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/component: metrics

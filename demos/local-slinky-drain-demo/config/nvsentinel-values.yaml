global:
  dryRun: false

  systemNodeSelector:
    node-role.kubernetes.io/control-plane: ""
  systemNodeTolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  gpuHealthMonitor:
    enabled: true
  faultQuarantine:
    enabled: true
  nodeDrainer:
    enabled: true
  mongodbStore:
    enabled: true

  syslogHealthMonitor:
    enabled: false
  cspHealthMonitor:
    enabled: false
  kubernetesObjectMonitor:
    enabled: false
  nicHealthMonitor:
    enabled: false
  nvcreCertificationMonitor:
    enabled: false
  slurmDrainMonitor:
    enabled: false

  faultRemediation:
    enabled: false
  healthEventsAnalyzer:
    enabled: false
  lifecycleManager:
    enabled: false
  eventExporter:
    enabled: false
  preflight:
    enabled: false
  inclusterFileServer:
    enabled: false
  janitor:
    enabled: false
  janitorProvider:
    enabled: false
  metadataCollector:
    enabled: false

  labeler:
    enabled: false

podMonitor:
  enabled: false

mongodb-store:
  useBitnami: false
  usePerconaOperator: true

  job:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  psmdb-operator:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  psmdb-db:
    unsafeFlags:
      replsetSize: true

    replsets:
      rs0:
        size: 1
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeSpec:
          pvc:
            resources:
              requests:
                storage: 3Gi
        sidecars: []

platformConnector:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

fault-quarantine:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  circuitBreaker:
    enabled: false

node-drainer:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

  userNamespaces: []

  customDrain:
    enabled: true
    templateConfigMapName: "slinky-drain-template"
    templateMountPath: "/etc/drain-template"
    templateFileName: "drain-template.yaml"
    namespace: "nvsentinel"
    apiGroup: "nvsentinel.nvidia.com"
    version: "v1alpha1"
    kind: "DrainRequest"
    resource: "drainrequests"
    statusConditionType: "DrainComplete"
    statusConditionStatus: "True"
    timeout: "1800"

gpu-health-monitor:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

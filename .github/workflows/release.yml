name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create release from (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write      # Required for creating releases and uploading assets
  packages: write      # Required for publishing Helm charts to ghcr.io
  actions: read        # Required for downloading artifacts

jobs:
  build-image-list:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Compute ref name with short SHA
        id: ref-name
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SAFE_REF="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            SAFE_REF="${{ github.ref_name }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_REF="${{ github.ref_name }}-${SHORT_SHA}"
          fi
          # Sanitize ref name: replace slashes with hyphens for Docker tag compatibility
          SAFE_REF=$(echo "$SAFE_REF" | sed 's/\//-/g')
          echo "value=$SAFE_REF" >> $GITHUB_OUTPUT

      - name: Build image list
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          chmod +x ./scripts/build-image-list.sh
          ./scripts/build-image-list.sh
          cat versions.txt

      - name: Upload versions.txt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: versions
          path: versions.txt
          retention-days: 90

  helm-publish:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    needs: build-image-list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Load Helm version from .versions.yaml
        id: helm-version
        run: |
          HELM_VERSION=$(yq eval '.testing_tools.helm' .versions.yaml)
          echo "helm_version=${HELM_VERSION}" >> $GITHUB_OUTPUT

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ steps.helm-version.outputs.helm_version }}

      - name: Configure Helm for GitHub Packages
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute ref name with short SHA
        id: ref-name
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SAFE_REF="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            SAFE_REF="${{ github.ref_name }}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_REF="${{ github.ref_name }}-${SHORT_SHA}"
          fi
          # Sanitize ref name: replace slashes with hyphens for Docker tag compatibility
          SAFE_REF=$(echo "$SAFE_REF" | sed 's/\//-/g')
          echo "value=$SAFE_REF" >> $GITHUB_OUTPUT

      - name: Package and publish Helm chart
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
          CI_COMMIT_TAG: ${{ steps.ref-name.outputs.value }}
          HELM_REGISTRY_TYPE: oci
          HELM_OCI_REGISTRY: ghcr.io
          HELM_OCI_REPOSITORY: nvidia
          SAFE_REF: ${{ steps.ref-name.outputs.value }}
        run: make -C distros/kubernetes helm-publish

  create-github-release:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    needs:
      - build-image-list
      - helm-publish
      - publish-harnessctl
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download versions.txt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: versions
          path: .

      - name: Download harnessctl CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: harnessctl-binaries
          path: harnessctl-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body: |
            Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

            ## Container Images

            See versions.txt for the full list of container images and versions.

            ## Helm Chart

            Install with:
            ```
            helm install nvsentinel oci://ghcr.io/nvidia/nvsentinel --version ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
            ```

            ## harnessctl (scale-test harness)

            Operator CLI archives: `harnessctl_<version>_<os>_<arch>.tar.gz` (linux/darwin/windows × amd64/arm64).

            Install the matching binary for your machine:
            ```
            curl -fsSL https://raw.githubusercontent.com/nvidia/nvsentinel/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}/tests/scale-tests/harness/harnessctl/installer | bash
            ```
            Or download an asset below and extract `harnessctl` onto your `PATH`.
          files: |
            versions.txt
            harnessctl-dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') }}

  publish-harnessctl:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: tests/scale-tests/harness/harnessctl/go.mod
          cache-dependency-path: tests/scale-tests/harness/harnessctl/go.sum

      - name: Build multi-arch CLI archives
        working-directory: tests/scale-tests/harness/harnessctl
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/harnessctl-dist"
          mkdir -p "$OUT"
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            BIN=harnessctl
            if [[ "$GOOS" == "windows" ]]; then BIN=harnessctl.exe; fi
            echo "building CLI ${GOOS}/${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="-s -w" -o "$BIN" .
            tar -czf "$OUT/harnessctl_${VER}_${GOOS}_${GOARCH}.tar.gz" "$BIN"
            rm -f "$BIN"
          done
          ls -la "$OUT"

      - name: Upload harnessctl CLI archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: harnessctl-binaries
          path: harnessctl-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

name: "Reflection: Publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override image/chart tag (default: <chart-version>-<short-sha>)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

env:
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_PROJECT: reflectionai-gpu-platform
  AR_REPOSITORY: nvsentinel

jobs:
  # Compute the image/chart tag once, share across jobs
  compute-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            CHART_VERSION=$(grep '^version:' distros/kubernetes/nvsentinel/Chart.yaml | awk '{print $2}')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
            echo "value=${CHART_VERSION}-g${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

  # Build all Go components via ko
  build-ko-images:
    runs-on: ubuntu-latest
    needs: compute-tag
    steps:
      - uses: actions/checkout@v4

      - name: Load versions
        id: versions
        run: |
          echo "go_version=$(yq '.languages.go' .versions.yaml)" >> "$GITHUB_OUTPUT"
          echo "ko_version=$(yq '.container_tools.ko' .versions.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go_version }}

      - name: Install ko
        run: go install github.com/google/ko@${{ steps.versions.outputs.ko_version }}

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Login to Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | ko login ${{ env.GCP_REGISTRY }} -u oauth2accesstoken --password-stdin

      - name: Build and push all Go images
        env:
          KO_DOCKER_REPO: ${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.AR_REPOSITORY }}
          VERSION: ${{ needs.compute-tag.outputs.tag }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          PLATFORMS: linux/amd64
        run: |
          # Ensure go.work exists for multi-module repo
          if [ ! -f go.work ]; then
            go work init
            go work use \
              ./event-exporter \
              ./fault-quarantine \
              ./fault-remediation \
              ./health-events-analyzer \
              ./health-monitors/csp-health-monitor \
              ./health-monitors/kubernetes-object-monitor \
              ./health-monitors/nic-health-monitor \
              ./janitor \
              ./janitor-provider \
              ./labeler \
              ./node-drainer \
              ./platform-connectors \
              ./plugins/slinky-drainer \
              ./preflight
          fi

          ko build --platform="${PLATFORMS}" --tags="${VERSION}" --sbom=none \
            ./event-exporter \
            ./fault-quarantine \
            ./fault-remediation \
            ./health-events-analyzer \
            ./health-monitors/csp-health-monitor/cmd/csp-health-monitor \
            ./health-monitors/csp-health-monitor/cmd/maintenance-notifier \
            ./health-monitors/kubernetes-object-monitor \
            ./health-monitors/nic-health-monitor \
            ./janitor \
            ./janitor-provider \
            ./labeler \
            ./node-drainer \
            ./platform-connectors \
            ./plugins/slinky-drainer \
            ./preflight

  # Build Docker-based images (Python health monitors, preflight checks, etc.)
  build-docker-images:
    runs-on: ubuntu-latest
    needs: compute-tag
    strategy:
      matrix:
        include:
          - component: gpu-health-monitor-dcgm3
            make_command: 'make -C health-monitors/gpu-health-monitor docker-publish-dcgm3'
          - component: gpu-health-monitor-dcgm4
            make_command: 'make -C health-monitors/gpu-health-monitor docker-publish-dcgm4'
          - component: syslog-health-monitor
            make_command: 'make -C health-monitors/syslog-health-monitor docker-publish'
          - component: metadata-collector
            make_command: 'make -C metadata-collector docker-publish'
          - component: log-collector
            make_command: 'make -C log-collector docker-publish-log-collector'
          - component: file-server-cleanup
            make_command: 'make -C log-collector docker-publish-file-server-cleanup'
          - component: preflight-dcgm-diag
            make_command: 'make -C preflight-checks/dcgm-diag docker-publish'
          - component: preflight-nccl-allreduce
            make_command: 'make -C preflight-checks/nccl-allreduce docker-publish'
          - component: preflight-nccl-loopback
            make_command: 'make -C preflight-checks/nccl-loopback docker-publish'
          - component: gpu-reset
            make_command: 'make -C gpu-reset docker-publish'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push ${{ matrix.component }}
        env:
          CONTAINER_REGISTRY: ${{ env.GCP_REGISTRY }}
          CONTAINER_ORG: ${{ env.GCP_PROJECT }}
          CI_COMMIT_REF_NAME: ${{ needs.compute-tag.outputs.tag }}
          PLATFORMS: linux/amd64
          DISABLE_REGISTRY_CACHE: "true"
        run: ${{ matrix.make_command }}

  # Package and push Helm chart (after all images are published)
  publish-helm-chart:
    runs-on: ubuntu-latest
    needs:
      - compute-tag
      - build-ko-images
      - build-docker-images
    steps:
      - uses: actions/checkout@v4

      - name: Load Helm version
        id: versions
        run: echo "helm_version=$(yq '.testing_tools.helm' .versions.yaml)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ steps.versions.outputs.helm_version }}

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Login to Helm OCI registry
        run: echo "${{ steps.auth.outputs.access_token }}" | helm registry login ${{ env.GCP_REGISTRY }} -u oauth2accesstoken --password-stdin

      - name: Build Helm dependencies
        run: |
          cd distros/kubernetes/nvsentinel
          # Add dependency repos and build deps
          helm dependency build || echo "Some optional dependencies may not be available"

      - name: Package and push Helm chart
        env:
          SAFE_REF: ${{ needs.compute-tag.outputs.tag }}
          HELM_OCI_REGISTRY: ${{ env.GCP_REGISTRY }}
          HELM_OCI_REPOSITORY: ${{ env.GCP_PROJECT }}/${{ env.AR_REPOSITORY }}
          HELM_EXPERIMENTAL_OCI: "1"
        run: make -C distros/kubernetes helm-publish

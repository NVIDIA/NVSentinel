# TEMPORARY: removed before #2388 merges. Scans the published images with the .openvex.json of the
# pull request and lists the critical and high findings with their PURLs in the job summary.
name: tmp-vex-check

on:
  push:
    branches: [pull-request/2388]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    steps:
      - name: kubectl with govulncheck
        run: |
          set +e -uo pipefail
          mkdir -p "${RUNNER_TEMP}/k" && cd "${RUNNER_TEMP}/k"
          for v in v1.35.10 v1.36.6 v1.37.2; do
            curl -fsSL -o "kubectl-${v}" "https://dl.k8s.io/release/${v}/bin/linux/amd64/kubectl" && chmod +x "kubectl-${v}"
          done
          docker run --rm -v "${PWD}:/k" -w /k \
            public.ecr.aws/docker/library/golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9 \
            bash -c '
              go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 >/dev/null 2>&1
              for b in kubectl-*; do
                echo "===== GOVULNCHECK ${b}"
                go version -m "${b}" | grep -E "^\s+(go|dep\s+golang.org/x/net)\s" | head -3
                /go/bin/govulncheck -mode=binary -show verbose "${b}" 2>&1 \
                  | grep -E "^(Vulnerability #|    (More info|Module|Found in|Fixed in|Example traces found)|  (GO-|    #))|No vulnerabilities|Your code is affected|Your code may"
                echo "--- JSON summary (called = symbol reachable):"
                /go/bin/govulncheck -mode=binary -format json "${b}" 2>/dev/null \
                  | jq -r "select(.finding) | .finding | [.osv, (.trace[0].module // \"\"), (.trace[0].version // \"\"), (if (.trace[0].function // \"\") != \"\" then \"called:\" + .trace[0].function else \"imported-only\" end)] | @tsv" \
                  | sort -u
              done'
      - name: python:3.15-alpine digests with Grype
        run: |
          set +e -uo pipefail
          out="${RUNNER_TEMP}/py" && mkdir -p "${out}" && chmod 777 "${out}"
          for d in sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb \
                   sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd; do
            ref="public.ecr.aws/docker/library/python:3.15-alpine@${d}"
            echo "===== GRYPE ${ref}"
            docker run --rm "${ref}" python3 -c 'import sys, zlib; print("python", sys.version.split()[0], "zlib", zlib.ZLIB_RUNTIME_VERSION)'
            docker run --rm -v "${out}:/out" anchore/grype:v0.118.0 "registry:${ref}" --only-fixed -q -o json=/out/g.json
            jq -r '.matches[] | select(.vulnerability.id == "CVE-2026-115557" or .vulnerability.id == "CVE-2026-4738")
              | "\(.vulnerability.id) \(.artifact.name) \(.artifact.version) fixed-in=\(.vulnerability.fix.versions | join(","))"' "${out}/g.json"
            echo "(end of matches)"
          done
          echo "===== DESCRIPTIONS"
          jq -r '[.matches[] | select(.vulnerability.id == "CVE-2026-115557" or .vulnerability.id == "CVE-2026-4738")] | unique_by(.vulnerability.id)[]
            | "\(.vulnerability.id): \(.vulnerability.description // ((.relatedVulnerabilities // [])[0].description) // "n/a")"' "${out}/g.json"
          docker run --rm -v "${out}:/out" anchore/grype:v0.118.0 \
            "registry:public.ecr.aws/docker/library/python:3.15-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb" \
            --only-fixed -q -o json=/out/old.json
          jq -r '[.matches[] | select(.vulnerability.id == "CVE-2026-115557" or .vulnerability.id == "CVE-2026-4738")] | unique_by(.vulnerability.id)[]
            | "\(.vulnerability.id): \(.vulnerability.description // ((.relatedVulnerabilities // [])[0].description) // "n/a")"' "${out}/old.json"
      - name: x/net advisories found in kubectl
        run: |
          set +e -uo pipefail
          for id in GO-2026-6603 GO-2026-6610 GO-2026-6611 GO-2026-6612 GO-2026-6617; do
            echo "===== ${id}"
            curl -fsSL "https://vuln.go.dev/ID/${id}.json" \
              | jq -r '"\(.summary // "")\n\(.details // "")\nsymbols: \([.affected[].ecosystem_specific.imports[]? | "\(.path): \(.symbols | join(","))"] | join("; "))"'
          done

  find-images:
    if: false
    runs-on: linux-amd64-cpu32
    timeout-minutes: 10
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: images
        run: |
          set -euo pipefail
          images=$(./scripts/retry.sh scripts/published-images.sh main-6e388be | jq -c '.')
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | .ref' <<< "${images}"

  trace-dcgm:
    if: false
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: ghcr.io/nvidia/nvsentinel/gpu-health-monitor:main-6e388be-dcgm-4.x
            kind: monitor
          - ref: ghcr.io/nvidia/nvsentinel/preflight-dcgm-diag:main-6e388be
            kind: diag
    name: trace (${{ matrix.kind }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          REF: ${{ matrix.ref }}
          KIND: ${{ matrix.kind }}
        run: |
          set +e -uo pipefail
          H="${GITHUB_WORKSPACE}/.github/tmp-trace"
          MAP="${GITHUB_WORKSPACE}/distros/kubernetes/nvsentinel/charts/gpu-health-monitor/files/dcgmerrorsmapping.csv"
          PP=/trace/hook:/usr/share/datacenter-gpu-manager-4/bindings/python3
          docker pull -q "${REF}"
          echo "::group::libraries that libdcgm and the DCGM modules link"
          docker run --rm --entrypoint bash "${REF}" -c '
            for f in $(find / -xdev \( -name "libdcgm*.so*" -o -name "libdcgmmodule*.so*" \) -type f 2>/dev/null); do
              echo "# $f" >&2; ldd "$f"; done | awk "/=> \\//{print \$3}" | sort -u' > "${RUNNER_TEMP}/dcgm-libs.txt"
          cat "${RUNNER_TEMP}/dcgm-libs.txt"
          echo "::endgroup::"
          echo "FLAGGED LIBRARIES LINKED BY DCGM:"
          grep -E 'libevent|libxml2|libX11|libpcre2|libz\.|libperl|libapt|libc\.so' "${RUNNER_TEMP}/dcgm-libs.txt" || echo "(none)"
          run() {  # name, then docker run arguments
            local name=$1; shift
            local out="${RUNNER_TEMP}/out-${name}"
            mkdir -p "${out}" && chmod 777 "${out}"
            echo "::group::run ${name}"
            docker run --rm -v "${H}:/trace/hook:ro" -v "${out}:/trace/out" -v "${MAP}:/trace/map.csv:ro" \
              -v "${H}/config.ini:/trace/config.ini:ro" -e PYTHONPATH="${PP}" "$@" 2>&1 | tail -40
            echo "::endgroup::"
            echo "RESULT ${name}:"
            docker run --rm -i --entrypoint python3 -v "${H}:/trace/hook:ro" -v "${out}:/trace/out:ro" "${REF}" \
              -I /trace/hook/owners.py < "${RUNNER_TEMP}/dcgm-libs.txt"
          }
          monitor_args=(--config-file /trace/config.ini --dcgm-error-mapping-config-file /trace/map.csv
            --dcgm-addr 127.0.0.1:5555 --port 2112 --state-file /tmp/statefile
            --dcgm-k8s-service-enabled false --metadata-path /tmp/gpu_metadata.json)
          if [ "${KIND}" = monitor ]; then
            run remote --entrypoint timeout "${REF}" -s INT 45 gpu_health_monitor "${monitor_args[@]}" --dcgm-mode remote
            run local-managed --entrypoint timeout "${REF}" -s INT 45 gpu_health_monitor "${monitor_args[@]}" --dcgm-mode local-managed
          else
            run diag -e DCGM_HOSTENGINE_ADDR=127.0.0.1:5555 -e NODE_NAME=node-0 \
              -e PLATFORM_CONNECTOR_SOCKET=unix:///trace/out/none.sock \
              --entrypoint timeout "${REF}" -s INT 90 python3 -m dcgm_diag
          fi

  scan:
    needs: find-images
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.find-images.outputs.images) }}
    name: scan (${{ matrix.image.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          REF: ${{ matrix.image.ref }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/out"
          mkdir -p "${out}" && chmod 777 "${out}" && cp .openvex.json "${out}/"
          grype() {
            docker run --rm -v "${out}:/out" anchore/grype:v0.118.0 "registry:${REF}" --only-fixed -q "$@"
          }
          grype -o sarif=/out/plain.sarif -o json=/out/plain.json
          grype --vex /out/.openvex.json -o sarif=/out/vex.sarif -o json=/out/vex.json
          count() {
            jq -r '.runs[0] as $r
              | (reduce ($r.tool.driver.rules // [])[] as $x ({}; .[$x.id] = ($x.properties["security-severity"] | tonumber))) as $s
              | [$r.results[] | $s[.ruleId]]
              | "\(map(select(. >= 9)) | length) critical, \(map(select(. >= 7 and . < 9)) | length) high"' "$1"
          }
          {
            echo "## ${REF}"
            echo "- without .openvex.json: $(count "${out}/plain.sarif")"
            echo "- with .openvex.json: $(count "${out}/vex.sarif")"
            echo
            echo "Critical and high findings left with .openvex.json (id, type, name, version, purl, path):"
            echo '```text'
            jq -r '.runs[0].tool.driver.rules[] | select((.properties["security-severity"] | tonumber) >= 7) | .id' \
              "${out}/vex.sarif" | sort -u > "${out}/ids.txt"
            jq -r --rawfile r "${out}/ids.txt" '($r | split("\n") | map(select(length > 0))) as $ids
              | .matches[] | (.vulnerability.id + "-" + .artifact.name) as $k | select($ids | index($k))
              | [.vulnerability.id, .artifact.type, .artifact.name, .artifact.version, .artifact.purl,
                 .artifact.locations[0].path] | @tsv' "${out}/vex.json" | sort -u
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

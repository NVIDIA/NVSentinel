# Scans the source code every day for dependencies with known vulnerabilities and for malware.
# Both scans report their findings as code scanning alerts in the Security tab.
name: Daily Security Scan

on:
  schedule:
    - cron: '30 7 * * *'  # daily at 07:30 UTC, runs on the default branch only
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vulnerability-scan:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu32
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Grype finds the go.mod and poetry.lock files of every module. govulncheck runs on each Go
      # module first, so that Grype does not report a Go vulnerability whose code is not called.
      - name: Scan dependencies
        uses: ./.github/actions/security-scan
        with:
          severity-cutoff: medium
          category: grype-source
          govulncheck: 'true'

  malware-scan:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for malware
        uses: ./.github/actions/malware-scan
        with:
          category: clamav-source

name: Helm Charts E2E Test

# E2E test using Kind cluster with locally built images and KWOK fake GPU nodes

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - 'distros/kubernetes/nvsentinel/**'
      - 'tilt/release/**'
      - '.github/workflows/helm-e2e-test.yml'
      - 'scripts/validate-nvsentinel.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  packages: write

env:
  KIND_VERSION: '0.30.0'
  HELM_VERSION: 'v3.14.4'
  KWOK_VERSION: 'v0.7.0'
  CLUSTER_NAME: 'helm-e2e-test'
  NVSENTINEL_NAMESPACE: 'nvsentinel'
  VALIDATION_TIMEOUT_MINUTES: '10'
  VALIDATION_INTERVAL_SECONDS: '30'
  FAKE_GPU_NODE_COUNT: '3'

jobs:
  prepare-environment:
    uses: ./.github/workflows/prepare-environment.yml

  helm-e2e-test:
    name: "Helm Charts E2E Test"
    runs-on: linux-amd64-cpu32
    timeout-minutes: 60
    needs: prepare-environment
    steps:
      - uses: actions/checkout@v4

      - name: Workaround for freeing up more disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          docker system prune -f

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          go-version: ${{ needs.prepare-environment.outputs.go_version }}
          python-version: ${{ needs.prepare-environment.outputs.python_version }}
          poetry-version: ${{ needs.prepare-environment.outputs.poetry_version }}
          golangci-lint-version: ${{ needs.prepare-environment.outputs.golangci_lint_version }}
          protobuf-version: ${{ needs.prepare-environment.outputs.protobuf_version }}
          protoc-gen-go-version: ${{ needs.prepare-environment.outputs.protoc_gen_go_version }}
          protoc-gen-go-grpc-version: ${{ needs.prepare-environment.outputs.protoc_gen_go_grpc_version }}
          grpcio-tools-version: ${{ needs.prepare-environment.outputs.grpcio_tools_version }}
          black-version: ${{ needs.prepare-environment.outputs.black_version }}
          shellcheck-version: ${{ needs.prepare-environment.outputs.shellcheck_version }}
          ko-version: ${{ needs.prepare-environment.outputs.ko_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Helm e2e testing tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/kind
            /usr/local/bin/kubectl
            /usr/local/bin/helm
            /usr/local/bin/kwok
            /usr/local/bin/kwokctl
          key: ${{ runner.os }}-${{ runner.arch }}-helm-e2e-tools-${{ env.KIND_VERSION }}-${{ env.HELM_VERSION }}-${{ env.KWOK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-helm-e2e-tools-

      - name: Install testing tools
        run: |
          ARCH=$(case $(uname -m) in x86_64) echo amd64;; aarch64|arm64) echo arm64;; *) echo $(uname -m);; esac)

          # Install Kind
          if ! command -v kind &> /dev/null || ! kind version | grep -q "${{ env.KIND_VERSION }}"; then
            curl -fsSL --retry 3 -o ./kind https://github.com/kubernetes-sigs/kind/releases/download/v${{ env.KIND_VERSION }}/kind-linux-${ARCH}
            chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          fi

          # Install kubectl
          if ! command -v kubectl &> /dev/null; then
            curl -fsSL --retry 3 -O "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/${ARCH}/kubectl"
            chmod +x kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          fi

          # Install Helm
          if ! command -v helm &> /dev/null || ! helm version --short | grep -q "${{ env.HELM_VERSION }}"; then
            curl -fsSL --retry 3 https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-${ARCH}.tar.gz | tar -xzO linux-${ARCH}/helm | sudo tee /usr/local/bin/helm > /dev/null
            sudo chmod +x /usr/local/bin/helm
          fi

          # Install KWOK
          if ! command -v kwok &> /dev/null || ! kwok --version | grep -q "${{ env.KWOK_VERSION }}"; then
            curl -fsSL --retry 3 -o /tmp/kwok https://github.com/kubernetes-sigs/kwok/releases/download/${{ env.KWOK_VERSION }}/kwok-linux-${ARCH}
            curl -fsSL --retry 3 -o /tmp/kwokctl https://github.com/kubernetes-sigs/kwok/releases/download/${{ env.KWOK_VERSION }}/kwokctl-linux-${ARCH}
            chmod +x /tmp/kwok /tmp/kwokctl
            sudo mv /tmp/kwok /tmp/kwokctl /usr/local/bin/
          fi

          # Verify installations
          kind version
          kubectl version --client
          helm version --short
          kwok --version

      - name: Compute ref name with SHA
        id: ref-name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SAFE_REF_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "value=${SAFE_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set registry configuration
        id: registry-config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "registry=ghcr.io" >> $GITHUB_OUTPUT
            echo "org=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "ko_repo=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "image_prefix=ghcr.io/nvidia/nvsentinel" >> $GITHUB_OUTPUT
            echo "use_local=false" >> $GITHUB_OUTPUT
          else
            echo "registry=localhost:5000" >> $GITHUB_OUTPUT
            echo "org=nvsentinel" >> $GITHUB_OUTPUT
            echo "ko_repo=localhost:5000/nvsentinel" >> $GITHUB_OUTPUT
            echo "image_prefix=localhost:5000/nvsentinel" >> $GITHUB_OUTPUT
            echo "use_local=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.registry-config.outputs.use_local == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container images locally
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
          CONTAINER_REGISTRY: ${{ steps.registry-config.outputs.registry }}
          CONTAINER_ORG: ${{ steps.registry-config.outputs.org }}
          PLATFORMS: linux/amd64
          DISABLE_REGISTRY_CACHE: true
          VERSION: ${{ steps.ref-name.outputs.value }}
          KO_DOCKER_REPO: ${{ steps.registry-config.outputs.ko_repo }}
        run: |
          # Build Docker images (gpu-health-monitor, syslog-health-monitor)
          make docker-all
          
          # Ko images are built separately in next step for multi-platform support
          
          docker images | grep "${{ steps.registry-config.outputs.image_prefix }}.*:${{ steps.ref-name.outputs.value }}" || docker images | grep nvsentinel

      - name: Start local registry for multi-platform images
        if: steps.registry-config.outputs.use_local == 'true'
        run: |
          # Start a local Docker registry that can handle multi-platform manifests
          docker run -d -p 5000:5000 --name registry registry:2
          echo "Local registry started at localhost:5000"

      - name: Build and push ko images to local registry
        if: steps.registry-config.outputs.use_local == 'true'
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          # Build multi-platform images and push to local registry
          for module_info in \
            "fault-quarantine-module:./fault-quarantine-module" \
            "fault-remediation-module:./fault-remediation-module" \
            "health-events-analyzer:./health-events-analyzer" \
            "csp-health-monitor:./health-monitors/csp-health-monitor/cmd/csp-health-monitor" \
            "maintenance-notifier:./health-monitors/csp-health-monitor/cmd/maintenance-notifier" \
            "janitor:./janitor" \
            "labeler-module:./labeler-module" \
            "node-drainer-module:./node-drainer-module" \
            "platform-connectors:./platform-connectors"; do
            
            module_name="${module_info%%:*}"
            module_path="${module_info##*:}"
            
            echo "Building ${module_name} for linux/amd64,linux/arm64..."
            KO_DOCKER_REPO="localhost:5000/nvsentinel" \
              ko build --platform=linux/amd64,linux/arm64 \
              --bare \
              --tags="${CI_COMMIT_REF_NAME}" \
              "${module_path}"
          done

      - name: Build and publish ko images to GHCR
        if: steps.registry-config.outputs.use_local == 'false'
        env:
          VERSION: ${{ steps.ref-name.outputs.value }}
          KO_DOCKER_REPO: ${{ steps.registry-config.outputs.ko_repo }}
        run: |
          # For main branch: build and push to GHCR
          make ko-build

      - name: Create Kind cluster
        run: |
          REGISTRY_MIRROR=$(jq -r '.["registry-mirrors"][0]? // empty' /etc/docker/daemon.json 2>/dev/null || echo "")
          
          # Get local registry container IP for Kind to connect to
          REGISTRY_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' registry || echo "")

          cat > /tmp/kind-config.yaml <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: ${CLUSTER_NAME}
          containerdConfigPatches:
          $(if [[ -n "$REGISTRY_IP" ]]; then
            echo "- |-"
            echo "  [plugins.\"io.containerd.grpc.v1.cri\".registry.mirrors.\"localhost:5000\"]"
            echo "    endpoint = [\"http://${REGISTRY_IP}:5000\"]"
          fi)
          $(if [[ -n "$REGISTRY_MIRROR" ]]; then
            echo "- |-"
            echo "  [plugins.\"io.containerd.grpc.v1.cri\".registry.mirrors.\"docker.io\"]"
            echo "    endpoint = [\"${REGISTRY_MIRROR}\"]"
          fi)
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          - role: worker
          - role: worker
          EOF

          kind create cluster --config=/tmp/kind-config.yaml
          kubectl cluster-info
          kubectl get nodes
          
          # Configure kubectl to trust the local registry
          if [ "${{ steps.registry-config.outputs.use_local }}" = "true" ]; then
            echo "Kind cluster configured to pull from local registry at localhost:5000"
          fi

      - name: Load Docker images into Kind cluster
        if: steps.registry-config.outputs.use_local == 'true'
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          # Load Docker-built images (gpu/syslog monitors) into Kind
          # Ko images will be pulled from the local registry
          mapfile -t images < <(docker images --format "{{.Repository}}:{{.Tag}}" | grep "localhost.*health-monitor.*:${CI_COMMIT_REF_NAME}$")
          
          if [ ${#images[@]} -gt 0 ]; then
            echo "Loading ${#images[@]} Docker images into Kind..."
            for image in "${images[@]}"; do
              echo "  Loading: $image"
              kind load docker-image "$image" --name "${CLUSTER_NAME}"
            done
          else
            echo "No Docker images found to load"
          fi

      - name: Push images to GitHub Container Registry
        if: steps.registry-config.outputs.use_local == 'false'
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          echo "Pushing images to GitHub Container Registry..."
          make docker-push
          make ko-publish

      - name: Load GHCR images into Kind cluster
        if: steps.registry-config.outputs.use_local == 'false'
        env:
          VERSION: ${{ steps.ref-name.outputs.value }}
          IMAGE_PREFIX: ${{ steps.registry-config.outputs.image_prefix }}
        run: |
          # Pull and load all images from GHCR into Kind
          # This includes both Docker-built health monitors and ko-built modules
          
          # List of all modules
          modules=(
            "csp-health-monitor"
            "gpu-health-monitor"
            "syslog-health-monitor"
            "fault-quarantine-module"
            "fault-remediation-module"
            "health-events-analyzer"
            "janitor"
            "labeler-module"
            "maintenance-notifier"
            "node-drainer-module"
            "platform-connectors"
          )
          
          echo "Pulling and loading images from GHCR..."
          for module in "${modules[@]}"; do
            image="${IMAGE_PREFIX}/${module}:${VERSION}"
            echo "Processing: $image"
            docker pull "$image"
            kind load docker-image "$image" --name "${CLUSTER_NAME}"
          done

      - name: Install infrastructure dependencies
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.19.1 --set installCRDs=true \
            --wait --timeout=5m

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --set prometheus.enabled=true \
            --set alertmanager.enabled=false \
            --set grafana.enabled=false \
            --set kubeStateMetrics.enabled=false \
            --set nodeExporter.enabled=false \
            --wait --timeout=5m

          helm repo add kwok https://raw.githubusercontent.com/kubernetes-sigs/kwok/refs/heads/main/site/static/charts/ --force-update
          helm upgrade --install kwok kwok/kwok \
            --namespace kube-system \
            --wait --timeout=5m

      - name: Create fake GPU nodes
        run: |
          for i in $(seq 1 ${{ env.FAKE_GPU_NODE_COUNT }}); do
            sed "s/kwok-node-PLACEHOLDER/kwok-gpu-node-${i}/g" tilt/kwok-node-template.yaml | kubectl apply -f -
          done
          kubectl get nodes -l type=kwok

      - name: Patch values for E2E testing
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          # Replace repository URLs with correct prefix for current environment
          # PR branches: ghcr.io/nvidia/nvsentinel/ -> localhost/nvsentinel-e2e/nvsentinel/
          # Main branch: ghcr.io/nvidia/nvsentinel/ -> ghcr.io/nvidia/nvsentinel/ (no-op, uses loaded images)
          sed -i 's|ghcr\.io/nvidia/nvsentinel/|${{ steps.registry-config.outputs.image_prefix }}/|g' \
            distros/kubernetes/nvsentinel/charts/*/values.yaml \
            distros/kubernetes/nvsentinel/values.yaml

          # Create patched values file
          cp tilt/release/values-release.yaml /tmp/values-patched.yaml
          sed -i '/^global:/a\
            image:\
              tag: "'"${CI_COMMIT_REF_NAME}"'"\
            imagePullSecrets: []' /tmp/values-patched.yaml

          # Add MongoDB scheduling for real nodes only
          cat >> /tmp/values-patched.yaml <<'EOF'
          mongodb:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: type
                      operator: NotIn
                      values: ["kwok"]
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
            tolerations:
            - operator: Exists
          EOF

      - name: Install NVSentinel via Helm
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          helm upgrade --install nvsentinel ./distros/kubernetes/nvsentinel \
            --create-namespace \
            --namespace ${{ env.NVSENTINEL_NAMESPACE }} \
            --values /tmp/values-patched.yaml \
            --set global.image.tag="${CI_COMMIT_REF_NAME}" \
            --debug

          kubectl get pods -n ${{ env.NVSENTINEL_NAMESPACE }}

      - name: Validate deployment with retry
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          chmod +x scripts/validate-nvsentinel.sh
          max_attempts=$((${{ env.VALIDATION_TIMEOUT_MINUTES }} * 60 / ${{ env.VALIDATION_INTERVAL_SECONDS }}))

          for attempt in $(seq 1 $max_attempts); do
            if ./scripts/validate-nvsentinel.sh --version "${CI_COMMIT_REF_NAME}" --namespace "${{ env.NVSENTINEL_NAMESPACE }}" --image-pattern "${{ steps.registry-config.outputs.image_prefix }}" --verbose; then
              echo "Validation passed on attempt $attempt"
              exit 0
            fi
            [ $attempt -lt $max_attempts ] && sleep ${{ env.VALIDATION_INTERVAL_SECONDS }}
          done

          echo "Validation failed after $max_attempts attempts"
          kubectl get pods -n ${{ env.NVSENTINEL_NAMESPACE }} -o wide
          kubectl get events -n ${{ env.NVSENTINEL_NAMESPACE }} --sort-by='.lastTimestamp'
          exit 1

      - name: Export Kind logs
        if: always()
        run: |
          mkdir -p /tmp/kind-logs
          kind export logs /tmp/kind-logs --name "${CLUSTER_NAME}" || true

      - name: Collect debug artifacts
        if: failure()
        env:
          CI_COMMIT_REF_NAME: ${{ steps.ref-name.outputs.value }}
        run: |
          SAFE_REF_NAME=$(echo "${CI_COMMIT_REF_NAME}" | sed 's/\//-/g')
          mkdir -p /tmp/debug-artifacts
          kubectl get all --all-namespaces > /tmp/debug-artifacts/all-resources.yaml || true
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' > /tmp/debug-artifacts/all-events.yaml || true
          kubectl get pods -n ${{ env.NVSENTINEL_NAMESPACE }} -o yaml > /tmp/debug-artifacts/nvsentinel-pods.yaml || true
          kubectl logs -n ${{ env.NVSENTINEL_NAMESPACE }} --all-containers=true --tail=500 > /tmp/debug-artifacts/nvsentinel-logs.txt || true
          ./scripts/validate-nvsentinel.sh --version "${SAFE_REF_NAME}" --namespace "${{ env.NVSENTINEL_NAMESPACE }}" --image-pattern "localhost/nvsentinel-e2e/nvsentinel" --verbose > /tmp/debug-artifacts/validation-output.txt 2>&1 || true
          docker images > /tmp/debug-artifacts/docker-images.txt
          df -h > /tmp/debug-artifacts/disk-usage.txt

      - name: Upload Kind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-e2e-kind-logs-${{ github.run_id }}
          path: /tmp/kind-logs/
          retention-days: 7

      - name: Upload debugging artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: helm-e2e-debug-artifacts-${{ github.run_id }}
          path: /tmp/debug-artifacts/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name "${CLUSTER_NAME}" || true
          docker system prune -f || true

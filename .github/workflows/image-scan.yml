# Scans the latest images from main every week for known vulnerabilities, and reports the findings
# as code scanning alerts in the Security tab, with one category for each image.
name: Weekly Image Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  find-images:
    if: github.repository == 'nvidia/nvsentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Images from main are tagged main-<short commit>. Scan the images of the latest commit that
      # published successfully.
      - name: Find the images of the latest publish from main
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh run list -R "${REPOSITORY}" --workflow publish.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "${sha}" ]; then
            echo "::error::No successful run of publish.yml on main"
            exit 1
          fi
          images=$(./scripts/retry.sh scripts/published-images.sh "main-${sha:0:7}")
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | "\(.ref) \(.size_mb) MB"' <<< "${images}"

  scan:
    needs: find-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.find-images.outputs.images) }}
    name: scan (${{ matrix.image.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Grype does not finish a scan of the largest images on a GitHub-hosted runner. For those, scan
      # the SBOM that the publish workflow attested, after a check of its signature.
      - name: Load the Cosign version
        id: versions
        if: matrix.image.large
        run: echo "cosign=$(yq '.container_tools.cosign' .versions.yaml)" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        if: matrix.image.large
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ steps.versions.outputs.cosign }}

      - name: Get the SBOM of the image
        id: sbom
        if: matrix.image.large
        env:
          IMAGE: ${{ matrix.image.ref }}
        run: |
          set -euo pipefail
          ./scripts/retry.sh cosign verify-attestation --type cyclonedx \
            --certificate-identity-regexp '^https://github\.com/NVIDIA/NVSentinel/\.github/workflows/publish\.yml@refs/(heads|tags)/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}" > "${RUNNER_TEMP}/attestations.json"
          head -1 "${RUNNER_TEMP}/attestations.json" | jq -r .payload | base64 -d | jq .predicate \
            > "${RUNNER_TEMP}/sbom.cdx.json"
          echo "file=${RUNNER_TEMP}/sbom.cdx.json" >> "${GITHUB_OUTPUT}"

      # The registry: prefix makes Grype pull the image itself, without a copy in the Docker daemon.
      - name: Scan the image
        uses: ./.github/actions/security-scan
        with:
          image: ${{ !matrix.image.large && format('registry:{0}', matrix.image.ref) || '' }}
          sbom: ${{ steps.sbom.outputs.file }}
          severity-cutoff: high
          category: ${{ matrix.image.category }}

[logging]
LogFormat = %%(asctime)s,%%(msecs)03d %%(levelname)-8s [%%(filename)s:%%(lineno)d] %%(message)s
DateTimeFormat = %%Y-%%m-%%d:%%H:%%M:%%S

[dcgm]
PollIntervalSeconds = 15
ProbeDeadlineSeconds = 45
ProbeStoreOnly = true

[dcgmfieldsmonitoring]
gputemplimitmonitoringenabled = true
gputemplimitstoreonly = true
gputemplimitminconsecutivepolls = 3
gpupowerbrakemonitoringenabled = false
gpupowerbrakestoreonly = true
gpupowerbrakeminconsecutivepolls = 3

[dcgmhealthcheck]
ImexMonitoringEnabled = false
SuppressedErrorCodes = DCGM_FR_CLOCK_THROTTLE_POWER,DCGM_FR_CLOCKS_EVENT_POWER,DCGM_FR_CLOCK_THROTTLE_THERMAL,DCGM_FR_CLOCKS_EVENT_THERMAL,DCGM_FR_NVLINK_EFFECTIVE_BER_THRESHOLD,DCGM_FR_NVLINK_SYMBOL_BER_THRESHOLD
ConnectivityFailureEscalationThreshold = 0
MinConsecutivePolls = 

[dcgmconnectivity]
FailureThreshold = 1
SuccessThreshold = 1

[eventprocessors.kubernetes]
ConflictRetryCount = 10

[eventprocessors.platformconnector]
SocketPath = /var/run/nvsentinel.sock

[cli]
EnabledEventProcessors = PlatformConnectorEventProcessor


name: 'Vulnerability Scan'
description: 'Scan a path or an image with Grype and upload the findings to the GitHub Security tab'

inputs:
  path:
    description: 'Path to scan, when image is empty'
    required: false
    default: '.'
  # In an image, Grype matches a Go binary to a Go vulnerability only when the binary contains the
  # vulnerable symbols.
  image:
    description: 'Image to scan instead of the path, for example ghcr.io/nvidia/nvsentinel/janitor:v1.0.0'
    required: false
    default: ''
  # Every finding is reported. This only sets the alert level: findings at or above the cutoff are
  # errors and the others are warnings.
  severity-cutoff:
    description: 'Lowest severity reported as an error: negligible, low, medium, high or critical'
    required: false
    default: 'medium'
  category:
    description: 'Code scanning category, which keeps these alerts apart from other scans'
    required: true
  # Grype matches versions, so it reports a vulnerable Go module even when nothing calls the
  # vulnerable code. With this input, govulncheck checks each Go module first, and Grype does not
  # report a Go vulnerability whose code the module does not call. It applies to a scan of the source.
  govulncheck:
    description: 'Leave out Go vulnerabilities whose code is not called, as govulncheck reports them'
    required: false
    default: 'false'
  # Grype does not report a finding that a statement in the document says does not affect the
  # product. A statement names an image as its product, so this applies to an image scan.
  vex:
    description: 'OpenVEX document with the vulnerabilities that do not affect NVSentinel'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Load the Go and govulncheck versions
      id: versions
      if: inputs.govulncheck == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "go=$(yq '.languages.go' .versions.yaml)" >> "${GITHUB_OUTPUT}"
        echo "govulncheck=$(yq '.go_tools.govulncheck' .versions.yaml)" >> "${GITHUB_OUTPUT}"

    - name: Set up Go
      if: inputs.govulncheck == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ steps.versions.outputs.go }}
        cache: false

    - name: Leave out Go vulnerabilities that are not called
      id: govulncheck
      if: inputs.govulncheck == 'true'
      shell: bash
      env:
        GOVULNCHECK_VERSION: ${{ steps.versions.outputs.govulncheck }}
      run: |
        set -euo pipefail
        ./scripts/retry.sh go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        PATH="$(go env GOPATH)/bin:${PATH}" "${GITHUB_ACTION_PATH}/govulncheck-ignore-rules.sh" .grype.yaml "${RUNNER_TEMP}/grype.yaml"
        echo "config=${RUNNER_TEMP}/grype.yaml" >> "${GITHUB_OUTPUT}"

    # Findings do not fail the step. They are reported as code scanning alerts instead.
    # A scanner error, for example a failed database download, does fail it.
    # Without govulncheck, config is empty and Grype reads .grype.yaml by itself.
    - name: Run Grype
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
      with:
        path: ${{ inputs.image == '' && inputs.path || '' }}
        image: ${{ inputs.image }}
        severity-cutoff: ${{ inputs.severity-cutoff }}
        output-format: sarif
        only-fixed: true
        fail-build: false
        config: ${{ steps.govulncheck.outputs.config }}
        vex: ${{ inputs.vex }}

    - name: Upload findings to the Security tab
      uses: github/codeql-action/upload-sarif@17783bfb99b07f70fae080b654aed0c514057477  # v2.23.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: ${{ inputs.category }}

    # Counts the findings for the run summary. The severity comes from the security-severity score
    # of each finding, banded the same way as in the Security tab.
    - name: Summarize the findings
      shell: bash
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
        CATEGORY: ${{ inputs.category }}
      run: |
        set -euo pipefail
        jq -r --arg category "${CATEGORY}" '
          .runs[0] as $run
          | (reduce ($run.tool.driver.rules // [])[] as $rule ({};
              .[$rule.id] = ($rule.properties["security-severity"] // "0" | tonumber))) as $score
          | [($run.results // [])[] | $score[.ruleId] // 0
             | if . >= 9 then "Critical" elif . >= 7 then "High" elif . >= 4 then "Medium"
               elif . > 0 then "Low" else "Unknown" end] as $levels
          | ["Critical", "High", "Medium", "Low", "Unknown"] as $names
          | "### \($category)\n\n| " + ($names | join(" | ")) + " | Total |\n|" + ("---|" * 6) + "\n| "
            + ([$names[] as $n | $levels | map(select(. == $n)) | length | tostring] | join(" | "))
            + " | \($levels | length) |\n"
        ' "${SARIF}" >> "${GITHUB_STEP_SUMMARY}"

name: 'Generate SBOM and Attest'
description: 'Generates SBOM and build provenance attestation for container images'

inputs:
  image_name:
    description: 'Full image name (without tag or digest)'
    required: true
  image_digest:
    description: 'Image digest (sha256:...)'
    required: true
  registry_password:
    description: 'Registry password for authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Authenticate to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_password }}

    - name: Derive safe filename
      id: name
      shell: bash
      run: |
        IMAGE="${{ inputs.image_name }}"
        SAFE="$(basename "${IMAGE%%:*}")"  # strip tag if present, then basename
        echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

    - name: Generate SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      with:
        image: "${{ inputs.image_name }}@${{ inputs.image_digest }}"
        format: cyclonedx-json
        output-file: sbom-${{ steps.name.outputs.safe }}.cdx.json
        upload-artifact: true
        upload-release-assets: auto
    
    - name: Verify SBOM file
      id: find-sbom
      shell: bash
      run: |
        SBOM_FILE="sbom-${{ steps.name.outputs.safe }}.cdx.json"
        if [ ! -f "$SBOM_FILE" ]; then
          echo "::error::SBOM file not found: $SBOM_FILE"
          exit 1
        fi
        echo "sbom_file=$SBOM_FILE" >> "$GITHUB_OUTPUT"

    - name: Load Cosign version from .versions.yaml
      id: cosign-version
      shell: bash
      run: |
        COSIGN_VERSION=$(yq eval '.container_tools.cosign' .versions.yaml)
        echo "cosign_version=${COSIGN_VERSION}" >> $GITHUB_OUTPUT

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      with:
        cosign-release: ${{ steps.cosign-version.outputs.cosign_version }}

    - name: Cosign SBOM attestation
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign attest \
          --yes \
          --predicate "${{ steps.find-sbom.outputs.sbom_file }}" \
          --type cyclonedx \
          "${{ inputs.image_name }}@${{ inputs.image_digest }}"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.image_name }}
        subject-digest: ${{ inputs.image_digest }}
        push-to-registry: true
# Single-manifest collector Job for KACE-286/KACE-287.
# Usage:
#  - Replace NODE_NAME_PLACEHOLDER with the target node name.
#  - Replace ${SAFE_REF_NAME} with the appropriate image tag (e.g., latest, v1.0.0).
#  - Optionally set UPLOAD_URL_BASE to the in-cluster file server upload endpoint.
#    Example: http://nvsentinel-file-server.nvsentinel.svc.cluster.local/upload
#  - Apply: kubectl apply -f collector-job.yaml


apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-job
  namespace: nvsentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collector-job
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collector-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collector-job
subjects:
  - kind: ServiceAccount
    name: collector-job
    namespace: nvsentinel
---
apiVersion: batch/v1
kind: Job
metadata:
  name: collector-job
  namespace: nvsentinel
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: nvsentinel-collector
    spec:
      serviceAccountName: collector-job
      imagePullSecrets:
          - name: nvidia-ngcuser-pull-secret
      restartPolicy: Never
      nodeName: NODE_NAME_PLACEHOLDER
      tolerations:
        - key: "dedicated"
          operator: "Exists"
        - key: "components.gke.io/gke-managed-components"
          operator: "Exists"
      # hostPID not required; the collector uses kubectl exec into driver pod
      containers:
        - name: collector
          image: nvcr.io/nv-ngc-devops/nvsentinel-log-collector:helm-13-multi
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KEEP_ALIVE
              value: "false"
            - name: GPU_OPERATOR_NAMESPACES
              value: "nvidia-gpu-operator,gpu-operator"
            - name: ENABLE_GPU_OPERATOR_MUST_GATHER
              value: "false"
            - name: COLLECTION_TIMEOUT_SECONDS
              value: "900"
            - name: UPLOAD_URL_BASE
              value: "http://nvsentinel-file-server.nvsentinel.svc.cluster.local/upload"
          volumeMounts:
            # Artifacts only; no host filesystem mounts are required
            - name: artifacts
              mountPath: /artifacts
      volumes:
        # Ephemeral workspace for artifacts that will be uploaded to the file server
        - name: artifacts
          emptyDir: {}

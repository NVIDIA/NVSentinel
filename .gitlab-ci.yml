kubernetes distro lint:
  stage: lint
  script:
    - cd distros/kubernetes
    - helm lint nvsentinel/

kubernetes distro helm publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd distros/kubernetes
    - helm repo add --force-update ngc ${HELM_URL}/${NGC_ORG}/${NGC_TEAM} --username=${NGC_USER_NAME} --password=${NGC_PASSWORD}
    - helm package nvsentinel --version ${CI_COMMIT_TAG}
    - helm cm-push -f nvsentinel-${CI_COMMIT_TAG}.tgz ngc

docs test:
  stage: test
  image: node:20.15.0-alpine3.20
  script:
  - cd docs/nvsentinel
  - yarn install
  - yarn build

pages:
  stage: deploy
  image: node:20.15.0-alpine3.20
  script:
  - cd docs/nvsentinel
  - yarn install
  - yarn build
  - mv ./build ../../public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

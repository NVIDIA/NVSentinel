kubernetes-distro-lint:
  stage: lint-test
  script:
    - cd distros/kubernetes
    - helm lint nvsentinel/


kubernetes-distro-helm-publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd distros/kubernetes
    - helm repo add --force-update ngc ${HELM_URL}/${NGC_ORG} --username=${NGC_USER_NAME} --password=${NGC_PASSWORD}
    - helm repo add --force-update mongodb ${HELM_URL}/${NGC_ORG} --username=${NGC_USER_NAME} --password=${NGC_PASSWORD}
    - cd nvsentinel/charts/mongodb-store && helm dependency update && cd ../../..
    - cd nvsentinel && helm dependency update && cd ..
    - helm package nvsentinel --version ${CI_COMMIT_TAG}
    - helm cm-push -f nvsentinel-${CI_COMMIT_TAG}.tgz ngc
    - helm repo add --force-update ngc ${HELM_URL}/${NGC_ORG} --username=${NGC_USER_NAME} --password=${NGC_PASSWORD}
    - helm cm-push -f nvsentinel-${CI_COMMIT_TAG}.tgz ngc


tilt:
  needs:
    - prepare-vars
  variables:
    CTLPTL_YAML: ctlptl-config.yaml
  script:
    # the following is a WAR to workaround the missing dependencies in the tilt shared
    # gitlab component. We're going to be moving to github anyway, so opting to stick
    # with a hack for now.
    - | 
      apt-get update
      apt-get install -y build-essential
      ARCH=$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')
      curl -sL https://go.dev/dl/go1.24.0.linux-${ARCH}.tar.gz | tar -C /usr/local -xzf -
      export PATH=$PATH:/usr/local/go/bin
    - make e2e-test-ci
  tags:
    - dind

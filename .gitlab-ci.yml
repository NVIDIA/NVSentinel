  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd health-monitors/nic-health-monitor
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${NVCR_CONTAINER_REPO}\":{\"auth\":\"$(printf "%s:%s" "${NGC_USER_NAME}" "${NGC_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor

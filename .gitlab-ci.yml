# =================================================================================================
.dind-service:
  image: docker:28.1.1
  services:
    - docker:28.1.1-dind
  tags:
    - eks-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_VERIFY: true
    DOCKER_TLS_CERTDIR: /builds/certs
    DOCKER_CERT_PATH: /builds/certs/client
    BUILDX_BUILDER: nvsentinel-builder
    DOCKER_BUILDKIT: 1
    BUILDKIT_PROGRESS: plain

.container-publish-base:
  extends:
    - .dind-service
  timeout: 15 minutes
  retry:
    max: 2
    when:
      - job_execution_timeout
      - script_failure
  before_script:
    - apk update && apk upgrade
    - apk add --no-cache bash git make
    - docker info
    - docker login nvcr.io -u ${NGC_USER_NAME} -p ${NGC_PASSWORD}
    - docker context create ${BUILDX_BUILDER}-context || true
    - docker buildx create --name ${BUILDX_BUILDER} ${BUILDX_BUILDER}-context --driver docker-container --driver-opt network=host --buildkitd-flags '--allow-insecure-entitlement network.host'
    - docker buildx use ${BUILDX_BUILDER}
    - docker buildx inspect --bootstrap

default:
  before_script:
    - echo "hack needed for tilt"

prepare-vars:
  stage: .pre  # or stage: init
  script:
    - SAFE_REF_NAME=$(echo $CI_COMMIT_REF_NAME | sed 's/\//-/g')
    - if [ -z "$CI_COMMIT_TAG" ]; then SAFE_REF_NAME="0.0.0-$SAFE_REF_NAME"; fi
    - echo "SAFE_REF_NAME=$SAFE_REF_NAME" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

build-image-list:
  stage: .pre
  # This job generates versions.txt which contains a list of all container images and their versions
  # The file is generated by build_image_list.sh which:
  # 1. Reads image repository and tag information from distros/kubernetes/nvsentinel/values.yaml
  # 2. Combines consumed and built image lists
  # 3. Outputs the final list to versions.txt
  script:
    - export SAFE_REF_NAME=$(echo "$CI_COMMIT_REF_NAME" | sed 's/\//-/g')
    - chmod +x ./build_image_list.sh
    - ./build_image_list.sh
    - cat versions.txt
  artifacts:
    paths:
      - versions.txt
  needs:
    - prepare-vars


nic-health-monitor-lint-test:
  stage: lint-test
  script:
    - cd health-monitors/nic-health-monitor
    - go vet ./...
    - golangci-lint run
    - gotestsum --junitfile report.xml -- -race -short $(go list ./... | grep -v pkg/protos) -coverprofile=coverage.txt -covermode atomic
    - go tool cover -func coverage.txt
    - gocover-cobertura < coverage.txt > coverage.xml
  artifacts:
    when: always
    reports:
      codequality: health-monitors/nic-health-monitor/code-quality-report.json
      coverage_report:
        coverage_format: cobertura
        path: health-monitors/nic-health-monitor/coverage.xml
      junit: health-monitors/nic-health-monitor/report.xml
    paths:
      - health-monitors/nic-health-monitor/code-quality-report.json
  coverage: '/total:\s*\(statements\)\s*\d+.\d+%/'


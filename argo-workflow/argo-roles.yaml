apiVersion: v1
kind: Namespace
metadata:
  name: nvsentinel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvsentinel-workflow-sa
  namespace: nvsentinel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvsentinel-workflow-role
rules:
# Essential Argo Workflows permissions
- apiGroups: ["argoproj.io"]
  resources: 
    - "workflows"
    - "workflowtemplates"
    - "workflowtaskresults"
    - "workflowtasksets"
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# Pod permissions (workflows create pods to run steps)
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "delete"]

# ConfigMap permissions for state management
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

# Secret permissions for authentication
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

# Events permissions for status updates
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvsentinel-workflow-binding
subjects:
- kind: ServiceAccount
  name: nvsentinel-workflow-sa
  namespace: nvsentinel-system
roleRef:
  kind: ClusterRole
  name: nvsentinel-workflow-role
  apiGroup: rbac.authorization.k8s.io
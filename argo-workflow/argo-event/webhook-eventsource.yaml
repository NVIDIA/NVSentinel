apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: nvsentinel-gitlab-events
  namespace: nvsentinel-system
spec:
  eventBusName: default
  service:
    ports:
    - port: 12000
      targetPort: 12000
  gitlab:
    nvsentinel-tags:
      # GitLab API token for webhook management
      accessToken:
        name: gitlab-credentials
        key: nvsentinel-token
      # GitLab instance URL
      gitlabBaseURL: "https://gitlab-master.nvidia.com"
      # Projects to monitor (can use project ID or path)
      projects:
      - "dgxcloud/mk8s/k8s-addons/nvsentinel"
      # Events to listen for
      events:
      - "TagPushEvents"
      # Webhook configuration
      webhook:
        endpoint: "/push"
        method: "POST"
        port: "12000"
        # Public URL that GitLab will call
        url: "https://nvsentinel-kube-001/eventsources/nvsentinel-gitlab-events"
      # Security options
      enableSSLVerification: false
      deleteHookOnFinish: true
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-cluster-patterns
  namespace: nvsentinel-system
data:
  clusters.yaml: |
    patterns:
      - name: "gcp-non-prod"
        include: "(tg220000-dgxc-runai-gcp-cmh-dev0)$"
        exclude: ""
        spec:
          templates:
            include:
              - release: gcp-runai
              - release: dgxc-janitor
                revision: janitor/1.20.0-1.24.3

          featureFlags:
            enableFaultQuarantineModule: true
            enableMongodbStore: true
            enableSysLogHealthMonitor: true
            enableNodeDrainerModule: true
            enableFaultRemediationModule: true
            dgxcJanitorEnabled: true
            enableNicHealthMonitor: false
          
          dgxcJanitor:
            autotest:
              allowed: true
              nodeSelector:
                matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - customer-gpu
            nodeSelector:
              cloud.google.com/gke-nodepool: system
            tolerations:
              - key: "components.gke.io/gke-managed-components"
                operator: "Equal"
                value: "true"
                effect: "NoExecute"

          nvsentinel:
            faultHandlingDryRun: true
            nodeDrainerConfig: |
              evictionTimeoutInSeconds = "60"
              [[userNamespaces]]
                name = "runai*"
                mode = "AllowCompletion"

      - name: "aws-non-prod"
        include: "(t3141592-dgxc-k8s-runai-aws-use1-dev0)$"
        exclude: ""
        spec:
          templates:
            include:
              - release: aws-runai
              - release: dgxc-janitor
                revision: janitor/1.20.0-1.24.3
              
          featureFlags:
            enableFaultQuarantineModule: true
            enableMongodbStore: true
            enableSysLogHealthMonitor: true
            enableNodeDrainerModule: true
            enableFaultRemediationModule: true
            dgxcJanitorEnabled: true
            enableNicHealthMonitor: false
          
          dgxcJanitor:
            autotest:
              allowed: true
              nodeSelector:
                matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values:
                      - customer-gpu
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "system-workload"
                effect: "NoSchedule"

              - key: "dedicated"
                operator: "Equal"
                value: "system-workload"
                effect: "NoExecute"

          nvsentinel:
            faultHandlingDryRun: true
            nodeDrainerConfig: |
              evictionTimeoutInSeconds = "60"
              [[userNamespaces]]
                name = "runai*"
                mode = "AllowCompletion"
              
      
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-processed-tags
  namespace: nvsentinel-system
data:
  processed-tags.txt: |
    # This file tracks processed NVSentinel versions
    # Format: version:timestamp:status
    # 1.87.0:2024-01-15T10:30:00Z:completed
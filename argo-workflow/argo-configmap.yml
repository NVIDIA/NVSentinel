apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-cluster-patterns
  namespace: nvsentinel-system
data:
  maxTimeoutInMinutes: "10080"
  sbomReleaseBranch: "release/1.8.x"
  clusters.yaml: |
    patterns:
      - name: "gcp-non-prod"
        include: "(tg220000-dgxc-runai-gcp-cmh-dev0)$"
        exclude: ""
        spec:
          templates:
            include:
              - release: gcp-runai
              - release: dgxc-janitor
                revision: janitor/1.20.0-1.24.3

          featureFlags:
            enableFaultQuarantineModule: true
            enableMongodbStore: true
            enableSysLogHealthMonitor: true
            enableNodeDrainerModule: true
            enableFaultRemediationModule: true
            dgxcJanitorEnabled: true
            enableNicHealthMonitor: false
          
          dgxcJanitor:
            nodeSelector:
              cloud.google.com/gke-nodepool: system
            tolerations:
              - key: "components.gke.io/gke-managed-components"
                operator: "Equal"
                value: "true"
                effect: "NoExecute"

          nvsentinel:
            faultHandlingDryRun: true
            nodeSelector:
              nodeGroup: "system-cpu"
            nodeDrainerConfig: |
              evictionTimeoutInSeconds = "60"
              [[userNamespaces]]
                name = "runai*"
                mode = "AllowCompletion"
      - name: "aws-non-prod"
        include: "(t3141592-dgxc-k8s-runai-aws-use1-dev0)$"
        exclude: ""
        spec:
          templates:
            include:
              - release: aws-runai
              - release: dgxc-janitor
                revision: janitor/1.20.0-1.24.3
              
          featureFlags:
            enableFaultQuarantineModule: true
            enableMongodbStore: true
            enableSysLogHealthMonitor: true
            enableNodeDrainerModule: true
            enableFaultRemediationModule: true
            dgxcJanitorEnabled: true
            enableNicHealthMonitor: false
          
          dgxcJanitor:
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "system-workload"
                effect: "NoSchedule"

              - key: "dedicated"
                operator: "Equal"
                value: "system-workload"
                effect: "NoExecute"

          nvsentinel:
            faultHandlingDryRun: true
            nodeSelector:
              nodeGroup: "system-cpu"
            nodeDrainerConfig: |
              evictionTimeoutInSeconds = "60"
              [[userNamespaces]]
                name = "runai*"
                mode = "AllowCompletion"
      - name: "osmo-non-prod"
        include: "(osmogroot-dgxc-k8s-dev1)$"
        exclude: ""
        spec:
          templates:
            include:
              - release: dgxc-janitor
                revision: janitor/1.20.0-1.24.3
              
          featureFlags:
            enableFaultQuarantineModule: true
            enableMongodbStore: true
            enableSysLogHealthMonitor: true
            enableNodeDrainerModule: true
            enableFaultRemediationModule: true
            dgxcJanitorEnabled: true
            enableNicHealthMonitor: true
          
          dgxcJanitor:
            autotest:
              allowed: true
              nodeSelector:
                matchExpressions:
                  - key: nodeGroup
                    operator: In
                    values:
                      - gpu
            nodeSelector:
              nodeGroup: monitoring
            serviceAccount:
              annotations:
                azure.workload.identity/client-id: 6d7529ef-faa1-4078-9e0c-313a350e9a7e

          nvsentinel:
            faultHandlingDryRun: true
            nodeSelector:

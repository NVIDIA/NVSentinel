apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-cluster-patterns
  namespace: nvsentinel-system
data:
  clusters.yaml: |
    patterns:
      - name: "non-prod"
        include: "(tg220000-dgxc-runai-gcp-cmh-dev0|tagb200qs2-dgxc-k8s-aws-usw2-dev0)$"
        exclude: ""
        spec:
          featureFlags:
            dgxcJanitorEnabled: true
            enableSysLogHealthMonitor: true
            enableCSPHealthMonitor: true
          nvsentinel:
            faultQuarantineConfig: |
              label-prefix = "k8saas.nvidia.com/"
      
              [[rule-sets]]
                version = "1"
                name = "NIC fatal error ruleset"                  # an admin friendly name for the rule set, used only for logging

                [[rule-sets.match.all]]
                  kind = "HealthEvent"                   # the kind of rule (the evaluator to use)
                  expression = "event.agent == 'nic-health-monitor' && event.componentClass == 'NIC'"

                [[rule-sets.match.all]]
                  kind = "HealthEvent" 
                  expression = "event.isFatal == true"

                [[rule-sets.match.all]]
                  kind = "Node"
                  expression = '''
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false")
                  '''
                [[rule-sets.match.all]]
                  kind = "MaxPercentageOfNodesToCordon"
                  expression = "maxPercentageOfNodesToCordon <= 100.0"
              
                [rule-sets.cordon]
                  shouldCordon = true
            nodeDrainerConfig: |
              evictionTimeoutInSeconds = "60"
              [[userNamespaces]]
                name = "runai-non-prod"
                mode = "AllowCompletion"


      - name: "GCP-QA"
        include: "(tg440000-dgxc-runai-gcp-cmh-qa1)$"
        exclude: ""
        spec:
          featureFlags:
            dgxcJanitorEnabled: true
            enableSysLogHealthMonitor: true
            enableCSPHealthMonitor: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvsentinel-processed-tags
  namespace: nvsentinel-system
data:
  processed-tags.txt: |
    # This file tracks processed NVSentinel versions
    # Format: version:timestamp:status
    # 1.87.0:2024-01-15T10:30:00Z:completed
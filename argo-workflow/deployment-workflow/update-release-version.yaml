apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-update-release-version
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  # Update release-nvsentinel.yaml in nvsentinel/{version} branch
  - name: update-release-version
    inputs:
      parameters:
      - name: version
      - name: user_id
    
    outputs:
      parameters:
      - name: release-mr-result
        valueFrom:
          path: /tmp/release-mr-result
    
    container:
      image: nvcr.io/nv-ngc-devops/python-gitlab:alpine
      command: ["python", "/scripts/update-release-version.py"]
      volumeMounts:
      - name: update-release-version-script-volume
        mountPath: /scripts
      env:
      - name: NVSENTINEL_COMPONENT_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: nvsentinel-component-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      - name: USER_ID
        value: "{{inputs.parameters.user_id}}"
    volumes:
    - name: update-release-version-script-volume
      configMap:
        name: update-release-version-script

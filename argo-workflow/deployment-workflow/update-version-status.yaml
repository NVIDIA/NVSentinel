apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-version-complete
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
   # Mark version as complete (runs after ALL MR pods complete)
  - name: complete-version
    inputs:
      parameters:
      - name: version
      - name: mr-results
    
    container:
      image: nvcr.io/nv-ngc-devops/python:3.12-slim
      command: ["sh", "-c"]
      args: ["pip install -q --no-cache-dir kubernetes~=23.3 && python3 /scripts/update-version-status.py"]
      volumeMounts:
      - name: update-status-script-volume
        mountPath: /scripts
      env:
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      - name: MR_RESULTS
        value: "{{inputs.parameters.mr-results}}"
      - name: WORKFLOW_NAME
        value: "{{workflow.name}}"
    volumes:
    - name: update-status-script-volume
      configMap:
        name: update-version-status-script
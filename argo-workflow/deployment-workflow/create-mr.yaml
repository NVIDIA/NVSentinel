apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-create-mr
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  # Create MRs for multiple clusters
  - name: create-mrs
    inputs:
      parameters:
      - name: version
      - name: clusters
    
    outputs:
      parameters:
      - name: mr-results
        valueFrom:
          path: /tmp/mr-results.json
    
    container:
      image: nvcr.io/nv-ngc-devops/python:3.12-slim
      command: ["sh", "-c"]
      args: ["apt-get -qq update && apt-get install -qq -y git curl && pip install --quiet PyYAML && python3 /scripts/create-mr.py"]
      volumeMounts:
      - name: create-mr-script-volume
        mountPath: /scripts
      env:
      - name: MANIFEST_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: manifest-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      - name: CLUSTERS
        value: "{{inputs.parameters.clusters}}"
    volumes:
    - name: create-mr-script-volume
      configMap:
        name: create-mr-script
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-check-existing-workflow
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  
  templates:
  # Template to check for existing workflows
  - name: check-existing-workflows
    inputs:
      parameters:
      - name: version
    
    outputs:
      parameters:
      - name: should-proceed
        valueFrom:
          path: /tmp/should-proceed.txt
      - name: message
        valueFrom:
          path: /tmp/message.txt
    
    container:
      image: nvcr.io/nv-ngc-devops/python:3.12-slim
      command: ["sh", "-c"]
      args: ["pip install -q --no-cache-dir kubernetes~=23.3 && python3 /scripts/check-existing-workflow.py"]
      env:
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      volumeMounts:
      - name: check-existing-workflow-script-volume
        mountPath: /scripts
    volumes:
    - name: check-existing-workflow-script-volume
      configMap:
        name: check-existing-workflow-script

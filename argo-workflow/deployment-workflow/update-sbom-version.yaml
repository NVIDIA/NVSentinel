apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-update-sbom-version
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  - name: update-sbom-version
    inputs:
      parameters:
      - name: version
    outputs:
      parameters:
      - name: ace-mr-result
        valueFrom:
          path: /tmp/ace-mr-result
      - name: manifest-template-mr-result
        valueFrom:
          path: /tmp/manifest-template-mr-result
    
    container:
      image: nvcr.io/nv-ngc-devops/python-gitlab:alpine
      command: ["sh", "-c"]
      args: ["apk add --no-cache git curl && python3 -m pip install --quiet ruamel.yaml && python3 /scripts/update-sbom-version.py"]
      volumeMounts:
      - name: update-sbom-version-script-volume
        mountPath: /scripts
      env:
      - name: MANIFEST_TEMPLATE_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: manifest-template-token
      - name: ACE_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: ace-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      - name: SBOM_RELEASE_BRANCH
        valueFrom:
          configMapKeyRef:
            name: nvsentinel-cluster-patterns
            key: sbomReleaseBranch
    volumes:
    - name: update-sbom-version-script-volume
      configMap:
        name: update-sbom-version-script

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-find-clusters
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  - name: resolve-clusters
    inputs:
      parameters:
      - name: version
    
    outputs:
      parameters:
      - name: clusters
        valueFrom:
          path: /tmp/clusters.json
    
    container:
      image: nvcr.io/nv-ngc-devops/python:3.12-slim
      command: ["sh", "-c"]
      args: ["apt-get -qq update && apt-get install -qq -y git curl && pip install --quiet PyYAML && python3 /scripts/find-clusters.py"]
      volumeMounts:
      - name: find-clusters-script-volume
        mountPath: /scripts
      - name: cluster-patterns-volume
        mountPath: /cluster-patterns
      env:
      - name: MANIFEST_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: manifest-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
    volumes:
    - name: find-clusters-script-volume
      configMap:
        name: find-clusters-script
    - name: cluster-patterns-volume
      configMap:
        name: nvsentinel-cluster-patterns

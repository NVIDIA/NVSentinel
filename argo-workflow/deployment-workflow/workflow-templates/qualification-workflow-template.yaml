apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-qualification-workflow
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  entrypoint: deploy-nvsentinel
  
  arguments:
    parameters:
    - name: version
      description: "NVSentinel version to deploy"
    - name: user_id
      description: "User who triggered the deployment"      
  templates:
  # Main deployment orchestration with duplicate check
  - name: deploy-nvsentinel
    dag:
      tasks:
      # Step 1: Discover target clusters
      - name: find-clusters
        templateRef:
          name: nvsentinel-find-clusters
          template: resolve-clusters
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
        
      # Step 2: Update non prod clusters with new version and config
      - name: create-non-prod-mr
        templateRef:
          name: nvsentinel-create-mr
          template: create-mrs
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: clusters
            value: "{{tasks.find-clusters.outputs.parameters.clusters}}"
          - name: user_id
            value: "{{workflow.parameters.user_id}}"
          - name: deploy_type
            value: "non-prod"
        depends: "find-clusters"
        
      # Step 3: Monitor non-prod clusters MR
      - name: monitor-non-prod-clusters
        templateRef:
          name: nvsentinel-monitor-cluster-mr
          template: monitor-mr
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-data
            value: "{{item}}"
        withParam: "{{tasks.create-non-prod-mr.outputs.parameters.mr-results}}"
        depends: "create-non-prod-mr"
        
      # Step 4: Run autotest for non-prod clusters
      - name: run-autotest
        templateRef:
          name: nvsentinel-run-autotest
          template: run-autotest
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: cluster-data
            value: "{{item}}"
        withParam: "{{tasks.monitor-non-prod-clusters.outputs.parameters.cluster-data}}"
        depends: "monitor-non-prod-clusters"
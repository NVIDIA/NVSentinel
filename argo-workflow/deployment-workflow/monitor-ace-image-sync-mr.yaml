apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-monitor-ace-image-sync-mr
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  # Monitor single MR until completion
  - name: monitor-mr 
    inputs:
      parameters:
      - name: version
      - name: mr-data
    
    outputs:
      parameters:
      - name: monitoring-result
        valueFrom:
          path: /tmp/monitoring-result.json
    
    container:
      image: nvcr.io/nv-ngc-devops/python-gitlab:alpine
      command: ["sh", "-c"]
      args: ["pip install -q requests && python3 /scripts/monitor-mr.py"]
      volumeMounts:
      - name: monitor-mr-script-volume
        mountPath: /scripts
      env:
      - name: GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: ace-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: PROJECT_PATH
        value: "dgxcloud%2Fplatform%2Frelease%2Face"
      - name: MR_VERSION
        value: "{{inputs.parameters.version}}"
      - name: MR_DATA
        value: "{{inputs.parameters.mr-data}}"
    volumes:
    - name: monitor-mr-script-volume
      configMap:
        name: monitor-mr-script
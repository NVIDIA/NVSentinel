apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-deployment
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  entrypoint: deploy-nvsentinel
  
  arguments:
    parameters:
    - name: version
      description: "NVSentinel version to deploy"
    - name: commit-sha
      description: "Git commit SHA"
      default: "unknown"
    - name: triggered-by
      description: "What triggered this deployment"
      default: "manual"
    - name: timestamp
      description: "Deployment timestamp"
      default: "unknown"
      
  templates:
  # Main deployment orchestration with duplicate check
  - name: deploy-nvsentinel
    dag:
      tasks:
      # Step 1: Check for duplicates first
      - name: check-existing-workflow
        templateRef:
          name: nvsentinel-check-existing-workflow
          template: check-existing-workflows
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
      
      # Step 2: Create release MR in nvsentinel repo (only if no duplicates)
      - name: update-release-version
        templateRef:
          name: nvsentinel-update-release-version
          template: update-release-version
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
        depends: "check-existing-workflow"
        
      # Step 3: Monitor MR raised in nvsentinel-component repo
      - name: monitor-release-mr
        templateRef:
          name: nvsentinel-monitor-release-mr
          template: monitor-release-mr
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-data
            value: "{{tasks.update-release-version.outputs.parameters.release-mr-result}}"
        depends: "update-release-version"

      # Step 4: Update SBOM repos
      - name: update-sbom-version
        templateRef:
          name: nvsentinel-update-sbom-version
          template: update-sbom-version
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
        depends: "monitor-release-mr"

      # Step 5: Monitor ACE MR
      - name: monitor-ace-mr
        templateRef:
          name: nvsentinel-monitor-ace-mr
          template: monitor-mr
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-data
            value: "{{tasks.update-sbom-version.outputs.parameters.ace-mr-result}}"
        depends: "update-sbom-version"
      
      # Step 6: Monitor manifest template MR
      - name: monitor-manifest-template-mr
        templateRef:
          name: nvsentinel-monitor-manifest-template-mr
          template: monitor-mr
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-data
            value: "{{tasks.update-sbom-version.outputs.parameters.manifest-template-mr-result}}"
        depends: "update-sbom-version"

      # Step 7: Discover target clusters (only after release MR is merged)
      - name: find-clusters
        templateRef:
          name: nvsentinel-find-clusters
          template: resolve-clusters
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
        depends: 'monitor-ace-mr.Succeeded && monitor-manifest-template-mr.Succeeded'

      # Step 8: Create all MRs
      - name: create-mrs
        templateRef:
          name: nvsentinel-create-mr
          template: create-mrs
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: clusters
            value: "{{tasks.find-clusters.outputs.parameters.clusters}}"
        depends: "find-clusters"

      # Step 9: Monitor each MR individually
      - name: monitor-mrs
        templateRef:
          name: nvsentinel-monitor-mrs
          template: monitor-mr
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-data
            value: "{{item}}"
        withParam: "{{tasks.create-mrs.outputs.parameters.mr-results}}"
        depends: "create-mrs"

      # Step 10: Mark version as complete
      - name: version-complete
        templateRef:
          name: nvsentinel-version-complete
          template: complete-version
        arguments:
          parameters:
          - name: version
            value: "{{workflow.parameters.version}}"
          - name: mr-results
            value: "{{tasks.monitor-mrs.outputs.parameters.monitoring-result}}"
        depends: "monitor-mrs"
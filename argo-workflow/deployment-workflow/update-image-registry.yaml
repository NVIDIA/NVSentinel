apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-update-image-registry
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  # Update release-nvsentinel.yaml in nvsentinel/{version} branch
  - name: update-image-registry
    inputs:
      parameters:
      - name: version
    
    outputs:
      parameters:
      - name: ace-image-sync-mr-result
        valueFrom:
          path: /tmp/ace-image-sync-mr-result
      - name: nvcr-registry-mr-result
        valueFrom:
          path: /tmp/nvcr-registry-mr-result
      - name: bcp-registry-mr-result
        valueFrom:
          path: /tmp/bcp-registry-mr-result
    
    container:
      image: nvcr.io/nv-ngc-devops/python-gitlab:alpine
      command: ["sh", "-c"]
      args: ["apk add --no-cache git curl && python3 -m pip install --quiet ruamel.yaml && python3 /scripts/image-sync.py"]
      volumeMounts:
      - name: image-sync-volume
        mountPath: /scripts
      env:
      - name: ACE_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: ace-token
      - name: NVCR_REGISTRY_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: nvcr-registry-token
      - name: BCP_REGISTRY_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: bcp-registry-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
    volumes:
    - name: image-sync-volume
      configMap:
        name: image-sync-script

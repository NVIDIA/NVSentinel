apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: nvsentinel-create-non-prod-mr
  namespace: nvsentinel-system
spec:
  serviceAccountName: nvsentinel-workflow-sa
  imagePullSecrets:
  - name: nvidia-ngcuser-pull-secret
  templates:
  - name: create-mr
    inputs:
      parameters:
      - name: version
      - name: clusters
      - name: user_id
    
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/mr-results.json
    
    container:
      image: nvcr.io/nv-ngc-devops/python:3.12-slim
      command: ["sh", "-c"]
      args: [
        "apt-get -qq update && 
         apt-get install -qq -y git curl && 
         pip install --quiet requests ruamel.yaml pyyaml && 
         python3 -u /scripts/create-mr.py"
      ]
      volumeMounts:
      - name: script-volume
        mountPath: /scripts
      - name: cluster-patterns
        mountPath: /patterns   

      env:
      - name: MANIFEST_GITLAB_TOKEN
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: manifest-token
      - name: GITLAB_URL
        valueFrom:
          secretKeyRef:
            name: gitlab-credentials
            key: url
      - name: VERSION
        value: "{{inputs.parameters.version}}"
      - name: DEPLOY_TYPE
        value: "non-prod"
      - name: CLUSTERS
        value: "{{inputs.parameters.clusters}}"
      - name: USER_ID
        value: "{{inputs.parameters.user_id}}"
    volumes:
    - name: script-volume
      configMap:
        name: create-mr-script
    - name: cluster-patterns
      configMap:
        name: nvsentinel-cluster-patterns
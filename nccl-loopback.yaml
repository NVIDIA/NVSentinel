apiVersion: v1
kind: Pod
metadata:
  name: nccl-loopback-test
spec:
  restartPolicy: Never
  containers:
  - name: nccl-test
    image: nvcr.io/nvidia/pytorch:24.01-py3
    command: ["python3", "-c"]
    args:
      - |
        import torch
        import torch.distributed as dist
        import os, time

        os.environ["MASTER_ADDR"] = "localhost"
        os.environ["MASTER_PORT"] = "29500"
        os.environ["WORLD_SIZE"] = str(torch.cuda.device_count())
        
        # Simple single-process multi-GPU test
        n_gpus = torch.cuda.device_count()
        print(f"Testing {n_gpus} GPUs")
        
        # Allocate tensors on each GPU and do peer-to-peer
        size_mb = 256
        tensors = [torch.randn(size_mb * 1024 * 1024 // 4, device=f"cuda:{i}") for i in range(n_gpus)]
        
        # Warm up
        for i in range(n_gpus):
            for j in range(n_gpus):
                if i != j:
                    tensors[j].copy_(tensors[i])
        torch.cuda.synchronize()
        
        # Benchmark
        iters = 10
        start = time.time()
        for _ in range(iters):
            for i in range(n_gpus):
                for j in range(n_gpus):
                    if i != j:
                        tensors[j].copy_(tensors[i])
        torch.cuda.synchronize()
        elapsed = time.time() - start
        
        total_bytes = size_mb * 1024 * 1024 * n_gpus * (n_gpus - 1) * iters
        bw_gbps = total_bytes / elapsed / 1e9
        print(f"Peer-to-peer bandwidth: {bw_gbps:.2f} GB/s")
        print("PASS" if bw_gbps > 10 else "FAIL - bandwidth too low")
    resources:
      limits:
        nvidia.com/gpu: 8
